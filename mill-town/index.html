<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A six-round classroom simulation: govern a New England town through the arrival of the textile mills, 1823–1855.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Mill Town Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: indigo-dye header band over a two-column "town report" workspace; one column on phones. */
:root {
  --bg: #ECEEEB; --surface: #F9F9F6; --sunk: #E0E4E0; --ink: #1D2228; --muted: #5A626B; --line: #C9CEC9;
  --accent: #283C6E; --accent-ink: #FFFFFF; --brick: #9B3F2C; --gold: #9C6F12;
  --good: #2E7547; --bad: #B03A2A; --warn: #9C6F12;
  --f-company: #283C6E; --f-old: #4F6B4A; --f-workers: #A43D5B; --f-irish: #B07A1A;
  --land: #E6E5D8; --field: #D3D9B8; --water: #5F87A6; --mud: #7A6A45; --house: #FBFAF4; --roof: #59606A; --mill: #9B3F2C; --board: #C77B5E; --shack: #8A8478;
  --f-display: "Sorts Mill Goudy", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "Libre Franklin", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171C; --surface: #1B2027; --sunk: #242A32; --ink: #E3E6E8; --muted: #9AA3AC; --line: #313842;
  --accent: #9DB2E6; --accent-ink: #10151F; --brick: #D9795F; --gold: #DDAE4E;
  --good: #79BE8D; --bad: #EC7B67; --warn: #DDAE4E;
  --f-company: #9DB2E6; --f-old: #9DBB93; --f-workers: #E58AA5; --f-irish: #E0AE55;
  --land: #262B25; --field: #333B2A; --water: #4F7896; --mud: #6B5D3C; --house: #D8D6CB; --roof: #8A93A0; --mill: #B65A42; --board: #A0644D; --shack: #6E6A61;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13171C; --surface: #1B2027; --sunk: #242A32; --ink: #E3E6E8; --muted: #9AA3AC; --line: #313842;
  --accent: #9DB2E6; --accent-ink: #10151F; --brick: #D9795F; --gold: #DDAE4E;
  --good: #79BE8D; --bad: #EC7B67; --warn: #DDAE4E;
  --f-company: #9DB2E6; --f-old: #9DBB93; --f-workers: #E58AA5; --f-irish: #E0AE55;
  --land: #262B25; --field: #333B2A; --water: #4F7896; --mud: #6B5D3C; --house: #D8D6CB; --roof: #8A93A0; --mill: #B65A42; --board: #A0644D; --shack: #6E6A61;
  color-scheme: dark; }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--accent);color:var(--accent-ink)}
header.band .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:30px;line-height:1.05}
.brand small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px}
.timeline{display:flex;gap:4px;flex-wrap:wrap}
.timeline span{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);opacity:.6}
.timeline span.done{opacity:.85}
.timeline span.now{opacity:1;background:var(--accent-ink);color:var(--accent);font-weight:500}
.statusbar{border-bottom:1px solid var(--line);background:var(--surface)}
.statusbar .wrap{display:flex;flex-wrap:wrap;gap:6px 26px;padding-block:10px;align-items:baseline}
.stat{display:flex;gap:8px;align-items:baseline}
.stat b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:16px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.meter{display:inline-block;width:64px;height:7px;border-radius:4px;background:var(--sunk);vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.meter i.mid{background:var(--warn)} .meter i.low{background:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
main{padding-block:22px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.02}
h2{font-size:19px;font-weight:700}
h3{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
.grid.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:880px){.grid,.grid.even{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r);padding:11px 20px;font-weight:700;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible,.seg button:focus-visible,.up:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.yearhead{display:flex;flex-direction:column;gap:4px}
.era{font-family:var(--f-mono);font-size:13px;color:var(--brick);letter-spacing:.03em}
.intro{max-width:64ch}
.callout{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,transparent);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:14px}
.callout.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.callout.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
/* issues */
.issue{display:flex;flex-direction:column;gap:10px}
.issue .who{font-size:12.5px;color:var(--muted);font-style:italic}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.opt b{font-size:14.5px}
.opt .d{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--accent);padding:9px 11px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);white-space:nowrap}
.tag.up{color:var(--good)} .tag.dn{color:var(--bad)}
.lf{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.hint{font-size:12.5px;color:var(--ink);border-top:1px dashed var(--line);padding-top:5px}
/* budget */
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:fit-content;max-width:100%}
.seg button{border:none;background:var(--surface);color:var(--ink);padding:7px 13px;font-size:13.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ups{display:flex;flex-direction:column;gap:6px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;background:var(--bg);color:var(--ink);text-align:left}
.up[aria-pressed="true"]{border:2px solid var(--accent);padding:7px 11px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.up:disabled{opacity:.5;cursor:not-allowed}
.up .lv{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.up .lv i{width:9px;height:9px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.up .lv i.on{background:var(--accent);border-color:var(--accent)}
.up .lv i.new{background:var(--gold);border-color:var(--gold)}
.up .e{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
/* tables / receipt */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr.me td{background:color-mix(in srgb,var(--gold) 14%,transparent);font-weight:600}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.receipt{font-size:14px}
.receipt .sec{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px dashed var(--line)}
.receipt .sec:first-of-type{border-top:none;padding-top:0}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
.rline .how{color:var(--muted);font-size:12.5px;grid-column:1/-1;margin-top:-2px}
.rline .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bigline{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:16px;padding-top:8px;border-top:2px solid var(--ink)}
.reporthead{font-family:var(--f-display);font-size:22px;line-height:1.15}
/* factions */
.fac{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:4px 10px;align-items:center}
.fac .nm{font-weight:700;display:flex;align-items:center;gap:7px}
.fac .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.fac .bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fac .bar i{display:block;height:100%;background:var(--c)}
.why{display:block;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.facd summary{list-style:none;cursor:pointer}
.facd summary::-webkit-details-marker{display:none}
.facd[open] summary .nm{text-decoration:underline}
.c-company{--c:var(--f-company)} .c-old{--c:var(--f-old)} .c-workers{--c:var(--f-workers)} .c-irish{--c:var(--f-irish)}
.quote{border-left:3px solid var(--c);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.quote q{font-family:var(--f-display);font-size:17px;line-height:1.3;quotes:"“" "”"}
.quote span{font-size:12.5px;color:var(--muted)}
.facgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.facgrid{grid-template-columns:minmax(0,1fr)}}
.faccard{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.faccard b{font-size:15px}
.faccard p{font-size:13.5px}
.votebar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.votebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.map svg{width:100%;height:auto;display:block;border-radius:4px}
.map figcaption{font-size:12.5px;color:var(--muted)}
.map{margin:0;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kv div{display:flex;flex-direction:column;gap:1px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
input[type=text]{font:inherit;padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:320px}
label.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px}
label.chk input{margin-top:3px}
.setup{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.setup{grid-template-columns:minmax(0,1fr)}}
.chart svg{width:100%;height:auto;display:block}
.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grade{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.grade b{font-family:var(--f-display);font-size:34px;line-height:1}
.grade .g-A,.grade .g-B{color:var(--good)} .grade .g-C{color:var(--warn)} .grade .g-D,.grade .g-F{color:var(--bad)}
.footer-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand"><small>Practice mode · Your town + 4 neighboring towns</small>The Mill Town Game</div>
    <div class="timeline" id="timeline"></div>
  </div>
</header>
<div class="statusbar" id="statusbar" hidden><div class="wrap" id="statusInner"></div></div>
<main><div class="wrap" id="app"></div></main>

<script>
// ===== Mill Town engine =====
const MT = (() => {
  const FK = ['company', 'old', 'workers', 'irish'];
  const FACTION = {
    company: { name: 'The Company', short: 'Company', who: 'The Boston investors who own the mills, plus their local agents and overseers. They want cheap water power, low taxes, and few rules.' },
    old: { name: 'Old families', short: 'Old families', who: 'Yankee farmers, shopkeepers, lawyers, and ministers whose families have lived here for generations. They own most of the property, pay most of the taxes, and cast most of the votes.' },
    workers: { name: 'Mill workers', short: 'Workers', who: 'Young Yankee women from New England farms who run the looms (the “mill girls”), plus the men who fix the machines. After 1845, more and more are Irish.' },
    irish: { name: 'Irish newcomers', short: 'Irish', who: 'Laborers who dig the canals and build the mills, and their families. After 1845, refugees from the Great Famine.' },
  };
  const MILLV = 120000, JOBS = 450, LEASE = 300, INTEREST = 0.06, BASE_RATE = 6;
  const CATS = {
    roads:   { name: 'Roads & bridges', up: 2000, keep: 220, desc: 'Graded streets, sidewalks, and a bridge across the river.', eff: 'Raises property values 6% per level. The Company and old families like it.' },
    water:   { name: 'Drains & sewers', up: 2500, keep: 260, desc: 'Brick drains carry filth away from homes and wells.', eff: '+7 public health per level, but the drains empty into the river.' },
    fire:    { name: 'Fire department', up: 1200, keep: 220, desc: 'Hand-pumped engines, hose, cisterns, and paid firemen.', eff: 'Lowers the chance of a great fire and the damage it does.' },
    schools: { name: 'Public schools', up: 1800, keep: 320, desc: 'Schoolhouses and teachers for a growing number of children.', eff: 'Every group likes schools. Helps newcomers and old-timers get along.' },
    police:  { name: 'Night watch & police', up: 1000, keep: 200, desc: 'Watchmen and constables keep order in the streets.', eff: 'Lowers the chance of riots. Old families feel safer.' },
  };
  const CK = Object.keys(CATS);
  const RELIEF = { stingy: { name: 'Stingy', f: 0.5 }, standard: { name: 'Standard', f: 1 }, generous: { name: 'Generous', f: 1.4 } };

  const EVENTS = {
    fire:      { name: 'Great fire', kind: 'local', note: 'A fire starts in a stable and races through crowded wooden buildings before the engines can stop it.', rumor: ['Dry weather', 'A long dry spell has left the wooden buildings like tinder.'] },
    riot:      { name: 'Street riot', kind: 'local', note: 'A quarrel between Yankee and Irish young men turns into a brawl, then a riot. Windows are smashed and homes damaged.', rumor: ['Bad blood in the streets', 'Fights between Yankee and Irish young men are getting more common.'] },
    freshet:   { name: 'Spring flood', kind: 'local', note: 'Melting snow and heavy rain send the river over its banks. A bridge and part of the canal wall wash out.', rumor: ['High water?', 'Deep snow in the hills could mean a big spring flood.'] },
    sickness:  { name: 'Summer fevers', kind: 'local', note: 'Dysentery and typhoid spread from foul wells and overflowing privies. Children are hit hardest.', rumor: ['Summer sickness', 'Doctors say summer fevers are worst where wells sit next to privies.'] },
    tariff1828:{ name: 'Tariff of 1828', kind: 'world', note: 'Congress raises taxes on imported cloth. Southern planters call it the “Tariff of Abominations,” but New England mills profit.', rumor: ['A higher tariff?', 'Congress is debating higher taxes on British cloth, which would help American mills.'] },
    panic1837: { name: 'Panic of 1837', kind: 'world', note: 'Banks fail across the country and cloth sales collapse. Mills cut hours and wages, and many mill women go home to their families’ farms.', rumor: ['Trouble in the banks?', 'Land speculation and shaky paper money have bankers nervous. Some predict a crash.'] },
    speedup:   { name: 'Speed-up and stretch-out', kind: 'world', note: 'The Company runs the machines faster and gives each worker more looms to tend for the same pay.', rumor: ['More looms per worker?', 'Overseers are being paid bonuses for getting more cloth out of each room.'] },
    walker:    { name: 'Lower tariff', kind: 'world', note: 'The Walker Tariff of 1846 cut taxes on imports. Cheaper British cloth competes with yours, and Company profits shrink.', rumor: ['Cheaper British cloth?', 'Since Congress cut the tariff, British cloth is selling well in Boston.'] },
    cholera:   { name: 'Cholera epidemic', kind: 'world', note: 'Cholera spreads through water fouled by sewage. It kills within days, and it hits crowded, poor neighborhoods hardest.', rumor: ['Cholera in New York', 'Cholera has arrived by ship in New York and Boston. Will it come here?'] },
    panic1857: { name: 'Panic of 1857', kind: 'world', note: 'Another bank panic. The mills shut down for weeks and workers are laid off.', rumor: ['Shaky banks again?', 'Railroad stocks are falling, and some banks have stopped paying out gold.'] },
  };

  const ISSUES = {
    water: { title: 'Who controls the falls?', short: 'Water rights', who: 'Brought by the Company’s agent',
      text: 'The investors want permission to raise a dam, dig a power canal, and divide the falling water among their mills. Farmers upriver warn that a higher dam will flood their meadows and block the spring runs of shad and salmon.',
      opts: [
        { k: 'sell', label: 'Sell the water rights', lf: true, desc: 'The Company pays $8,000 now and controls the river forever. Room for many mills.', fx: { cash: 8000, company: 14, old: -4, millCap: 22, flags: { water: 'sold' } }, hint: 'The town can never charge for the water again.' },
        { k: 'lease', label: 'Lease the water power', desc: 'The Company pays rent every year for each mill’s share of the water. Less money now, steady income later.', fx: { cash: 1000, company: -5, millCap: 20, flags: { water: 'lease' } }, hint: '+$300 a year for every mill.' },
        { k: 'protect', label: 'Allow the dam, with conditions', desc: 'Require fish ladders and payment to flooded farmers. The Company says this eats its profits and plans fewer mills.', fx: { company: -12, old: 8, riverMod: 12, millCap: 14, flags: { water: 'protect' } }, hint: 'Fewer mills can ever be built.' },
        { k: 'refuse', label: 'Refuse the dam', desc: 'Keep the river as it is. The investors will take their money to another town.', fx: { company: -40, old: 10, millCap: 2, flags: { water: 'refused' } }, hint: 'Only a couple of small local mills will ever be built.' },
      ] },
    zoning: { title: 'How will the town grow?', short: 'Town plan', who: 'Brought by the town surveyor',
      text: 'Hundreds of workers will soon need streets, houses, and stores. Should the town decide where mills, houses, and shops may go, or let each landowner build whatever and wherever they like?',
      opts: [

  const YEARS = [

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const clone = o => JSON.parse(JSON.stringify(o));
  const opt = (id, k) => ISSUES[id].opts.find(o => o.k === k);

  function newTown(name) {
    return { name, treasury: 2500, debt: 0, mills: 0, millCap: 22, pop: { old: 1400, ops: 0, irish: 40 },
      infra: { roads: 1, water: 0, fire: 0, schools: 1, police: 0 },
      approval: { company: 55, old: 62, workers: 55, irish: 45 },
      healthMod: 0, riverMod: 0, cohesion: 72, housingQ: 0.3, planAdj: 0, exempt: null, exemptMills: 0,
      flags: {}, econ: 1, fireLoss: 0, reliefMult: 1, deaths: 0, fires: 0, riots: 0 };
  }

  function derive(S) {
    const pop = S.pop.old + S.pop.ops + S.pop.irish;
    const roadsM = 1 + 0.06 * S.infra.roads;
    const railM = S.flags.rail === 'downtown' ? 1.15 : S.flags.rail === 'edge' ? 1.05 : 1;
    const exF = S.exempt ? (S.exempt.type === 'full' ? 1 : 0.5) : 0;
    const exMills = Math.min(S.exemptMills, S.mills);
    const millV = (S.mills - exMills * exF) * MILLV * S.econ;
    const homeV = pop * 80 * roadsM * railM * S.econ;
    const V = Math.max(150000, 300000 * S.econ + millV + homeV - S.fireLoss);
    const irishShare = pop ? S.pop.irish / pop : 0;
    const crowd = irishShare * (1 - clamp(S.housingQ, 0, 0.9)) + (S.flags.zoning === 'none' && pop > 4000 ? 0.08 : 0);
    const river = clamp(100 - S.mills * 2.2 - S.infra.water * 3 - pop / 1500 + S.riverMod, 5, 100);
    const health = clamp(88 - pop / 1000 - crowd * 45 + S.infra.water * 7 + S.healthMod - (100 - river) * 0.08, 10, 95);
    const fireRisk = clamp(0.05 + pop / 40000 + (S.flags.zoning === 'none' ? 0.08 : 0) + (!S.flags.buildingCode && S.pop.irish > 2000 ? 0.05 : 0) - S.infra.fire * 0.035, 0.03, 0.5);
    const riotRisk = clamp((58 - S.cohesion) / 70 * (1 - 0.12 * S.infra.police), 0.03, 0.6);
    const feel = pop < 2500 ? 'Farm village' : pop < 6000 ? 'Mill village' : pop < 14000 ? 'Mill town' : 'Factory city';
    return { pop, V, millV, homeV, exMills, exF, irishShare, crowd, river, health, fireRisk, riotRisk, feel, debtLimit: V * 0.06, ps: 1 + pop / 6000 };
  }

  const upCost = (S, c, d) => Math.round(CATS[c].up * (1 + 0.35 * S.infra[c]) * (1 + d.pop / 12000) / 50) * 50;
  const keepCost = (S, c, d, lvl = S.infra[c]) => CATS[c].keep * lvl * d.ps;

  // Money for one year. choices: {issueId: optKey}; B: {rate, ups:{cat:true}, relief, borrow}
  function budget(S, yi, choices, B) {
    const d = derive(S); const yr = YEARS[yi];
    const income = [], spend = [], bonds = [];
    income.push({ label: 'Property tax', amt: d.V * B.rate / 1000, how: `${fmt(d.V)} assessed value × $${B.rate.toFixed(2)} per $1,000` + (d.exMills && d.exF ? `. ${d.exMills} new mill${d.exMills > 1 ? 's' : ''} ${d.exF === 1 ? 'pay nothing' : 'pay half'} under the tax break.` : '') });
    if (S.flags.water === 'lease' && S.mills) income.push({ label: 'Water-power rent from the Company', amt: S.mills * LEASE, how: `${S.mills} mills × $${LEASE}` });
    for (const id of yr.issues) {
      const o = choices[id] && opt(id, choices[id]); if (!o) continue;
      if (o.fx.cash > 0) income.push({ label: o.label, amt: o.fx.cash, how: ISSUES[id].short });
      if (o.fx.cash < 0) spend.push({ label: o.label, amt: -o.fx.cash, how: ISSUES[id].short });
      if (o.fx.debt) bonds.push({ label: o.label, amt: o.fx.debt });
    }
    for (const c of CK) if (S.infra[c]) spend.push({ label: `Upkeep: ${CATS[c].name.toLowerCase()}`, amt: keepCost(S, c, d), how: `Level ${S.infra[c]}, scaled to ${fmtN(d.pop)} people` });
    for (const c of CK) if (B.ups && B.ups[c] && S.infra[c] < 5) spend.push({ label: `Build: ${CATS[c].name.toLowerCase()} to level ${S.infra[c] + 1}`, amt: upCost(S, c, d), up: c });
    const need = d.pop * 0.02 * 12 * S.reliefMult;
    spend.push({ label: `Poor relief (${RELIEF[B.relief].name.toLowerCase()})`, amt: need * RELIEF[B.relief].f, how: `About ${fmtN(d.pop * 0.02 * S.reliefMult)} people need help${S.reliefMult > 1 ? ' (hard times)' : ''}` });
    if (S.debt) spend.push({ label: 'Interest on town bonds', amt: S.debt * INTEREST, how: `${fmt(S.debt)} × 6%` });
    const totalIn = income.reduce((s, x) => s + x.amt, 0), totalOut = spend.reduce((s, x) => s + x.amt, 0);
    const newBonds = bonds.reduce((s, x) => s + x.amt, 0);
    const end = S.treasury + totalIn - totalOut + (B.borrow || 0);
    const debtEnd = S.debt + newBonds + (B.borrow || 0) + (end < 0 ? -end : 0);
    return { d, income, spend, bonds, totalIn, totalOut, newBonds, net: totalIn - totalOut, end, debtEnd, borrow: B.borrow || 0 };
  }

  // Phase 1: apply the board's decisions. Returns the town just before events, plus approval reasons.
  function decide(S0, yi, choices, B) {
    const S = clone(S0); const yr = YEARS[yi];
    const parts = { company: [], old: [], workers: [], irish: [] }; const notes = [];
    const add = (f, label, v) => { if (Math.abs(v) >= 0.5) parts[f].push([label, v]); };
    const bud = budget(S0, yi, choices, B);
    for (const id of yr.issues) {
      const o = opt(id, choices[id]); const fx = o.fx;
      for (const f of FK) if (fx[f]) add(f, `${ISSUES[id].short}: ${o.label.toLowerCase()}`, fx[f]);
      if (fx.healthMod) S.healthMod += fx.healthMod;
      if (fx.riverMod) S.riverMod += fx.riverMod;
      if (fx.cohesion) S.cohesion += fx.cohesion;
      if (fx.housingQ) S.housingQ = clamp(S.housingQ + fx.housingQ, 0, 0.9);
      if (fx.millCap != null) S.millCap = fx.millCap;
      if (fx.millCapAdd) S.millCap += fx.millCapAdd;
      if (fx.planAdj) S.planAdj += fx.planAdj;
      if (fx.exempt) S.exempt = { type: fx.exempt, until: yi + 2 };
      if (fx.flags) Object.assign(S.flags, fx.flags);
      if (fx.irishOut) S.irishOut = fx.irishOut;
    }
    for (const c of CK) if (B.ups && B.ups[c] && S.infra[c] < 5) S.infra[c]++;
    S.treasury = bud.end; S.debt = S0.debt + bud.newBonds + bud.borrow;
    S.fireLoss = 0;
    return { S, parts, notes, bud };
  }

  function eventOdds(S, yi) {
    const d = derive(S);
    return YEARS[yi].events.map(([id, p, hist]) => {
      let prob = p;
      if (prob == null) prob = id === 'fire' ? d.fireRisk : id === 'riot' ? d.riotRisk : id === 'sickness' ? clamp((100 - d.health) / 220, 0.05, 0.4) : 0.1;
      return { id, p: prob, hist };
    });
  }
  function suggestEvents(S1, yi, rnd = Math.random, mode = 'history+random') {
    return eventOdds(S1, yi).filter(e => (mode !== 'random' && e.hist) || (mode !== 'history' && rnd() < e.p)).map(e => e.id);
  }

  // The whole round.
  function resolve(S0, yi, choices, B, events) {
    const yr = YEARS[yi]; const d0 = derive(S0);
    const { S, parts, notes, bud } = decide(S0, yi, choices, B);
    const add = (f, label, v) => { if (Math.abs(v) >= 0.5) parts[f].push([label, v]); };
    const d1 = derive(S);
    const ev = []; let econNext = 1, jobsF = 1, planCut = 0, reliefNext = 1, evCost = 0;
    for (const id of events) {
      const E = EVENTS[id]; const r = { id, name: E.name, note: E.note, lines: [] };
      if (id === 'fire') {
        const dmg = Math.round(d1.V * 0.03 * (1 - 0.15 * S.infra.fire) * (S.flags.zoning === 'none' ? 1.5 : 1) * (S.flags.buildingCode ? 0.7 : 1));
        const cost = dmg * 0.06; evCost += cost; S.fireLoss = dmg; S.fires++;
        r.cost = cost; r.lines.push(`${fmt(dmg)} of property burned${S.infra.fire ? ` (your fire department, level ${S.infra.fire}, limited the damage)` : ' (the town had no fire department)'}${S.flags.zoning === 'none' ? '. With no building rules, houses and stables stood wall to wall' : ''}.`);
        add('old', 'The great fire', -6); add('company', 'The great fire', -4); add('workers', 'The great fire', -3); add('irish', 'The great fire', -3);
      } else if (id === 'riot') {

<script>
// ===== Town map =====
function drawTown(S, label = '') {
  const r = rng(S.name + '-map'); const d = MT.derive(S);
  const W = 640, H = 380; let g = '';
  const rc = Math.round(100 - d.river);

  g += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--land)"/>`;
  // farm fields shrink as the mill district grows
  const fields = Math.max(2, 14 - Math.round(S.mills * 0.6));
  for (let i = 0; i < fields; i++) { const x = 400 + (i % 5) * 46, y = 18 + Math.floor(i / 5) * 34; g += `<rect x="${x}" y="${y}" width="40" height="28" rx="2" fill="var(--field)"/>`; }
  for (let i = 0; i < Math.max(1, 6 - S.mills); i++) g += `<rect x="${30 + i * 44}" y="330" width="38" height="26" rx="2" fill="var(--field)"/>`;
  // railroad
  if (S.flags.rail === 'downtown' || S.flags.rail === 'edge') {
    const end = S.flags.rail === 'downtown' ? [300, 112] : [70, 52];
    g += `<line x1="0" y1="34" x2="${end[0]}" y2="${end[1]}" stroke="var(--roof)" stroke-width="3"/><line x1="0" y1="34" x2="${end[0]}" y2="${end[1]}" stroke="var(--land)" stroke-width="1.5" stroke-dasharray="2 5"/>`;
    g += `<rect x="${end[0] - 12}" y="${end[1] - 8}" width="24" height="12" fill="var(--roof)"/>`;
  }

  if (S.flags.waterworks) g += `<ellipse cx="596" cy="140" rx="30" ry="14" fill="var(--water)"/><path d="M566 140 C 470 150, 300 120, 150 118" fill="none" stroke="var(--water)" stroke-width="2" stroke-dasharray="5 4"/>`;
  // river + falls
  g += `<path d="M-10 268 C 120 250, 230 290, 330 262 S 520 230, 650 246" fill="none" stroke="${water}" stroke-width="34" stroke-linecap="round"/>`;
  for (let i = 0; i < 5; i++) g += `<path d="M${300 + i * 3} ${250 + i * 5} l6 3" stroke="var(--house)" stroke-width="2" opacity=".85"/>`;
  g += `<text x="286" y="300" font-size="11" fill="var(--muted)" font-family="Libre Franklin, sans-serif">The Falls</text>`;
  if (S.infra.roads >= 2) g += `<rect x="180" y="248" width="12" height="40" fill="var(--roof)" transform="rotate(-8 186 268)"/>`;
  // canal + mills
  if (S.mills) {
    g += `<path d="M300 246 C 380 226, 480 222, 620 214" fill="none" stroke="${water}" stroke-width="6"/>`;
    for (let i = 0; i < S.mills; i++) {

      if (col === 0) g += `<rect x="${x + 8}" y="${y - 7}" width="5" height="7" fill="var(--mill)"/>`;
    }
    g += `<text x="470" y="${232}" font-size="11" fill="var(--muted)" font-family="Libre Franklin, sans-serif">Mill district</text>`;
  }
  // boardinghouses for mill workers
  const bh = Math.min(30, Math.round(S.pop.ops / 280));
  for (let i = 0; i < bh; i++) {
    let x = 322 + (i % 10) * 27, y = 150 - Math.floor(i / 10) * 13;
    if (S.flags.zoning === 'none') { x = 250 + r() * 330; y = 95 + r() * 75; }

  }
  // village of the old families
  if (S.flags.zoning === 'plan') g += `<rect x="92" y="96" width="70" height="40" rx="3" fill="var(--field)"/><text x="104" y="120" font-size="10" fill="var(--muted)" font-family="Libre Franklin, sans-serif">Common</text>`;
  g += `<rect x="120" y="58" width="16" height="18" fill="var(--house)" stroke="var(--roof)"/><path d="M128 36 L132 58 L124 58 Z" fill="var(--house)" stroke="var(--roof)"/>`;
  const nh = Math.min(70, Math.round(S.pop.old / 80));
  for (let i = 0; i < nh; i++) {
    let x, y;
    if (S.flags.zoning === 'plan') { x = 40 + (i % 14) * 16; y = 150 + Math.floor(i / 14) * 15; if (y > 214) { y -= 135; x += 0; } }
    else { const a = r() * Math.PI * 2, rad = 30 + r() * (60 + nh * 1.6); x = 128 + Math.cos(a) * rad * 1.5; y = 100 + Math.sin(a) * rad * 0.7; if (S.flags.zoning === 'none' && r() < 0.25) { x = 300 + r() * 280; y = 90 + r() * 110; } }

  }

  if (S.pop.irish > 300) g += `<text x="96" y="372" font-size="11" fill="var(--muted)" font-family="Libre Franklin, sans-serif">The Acre</text>`;
  if (label) g += `<text x="12" y="22" font-size="13" font-weight="700" fill="var(--ink)" font-family="Libre Franklin, sans-serif">${label}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of ${esc(S.name)}: ${S.mills} mills, about ${MT.fmtN(d.pop)} people">${g}</svg>`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function voteBar(yi) {

// ---------- planning ----------
function tagsFor(o) {
  const fx = o.fx; const t = [];
  const arrows = v => (Math.abs(v) < 6 ? 1 : Math.abs(v) < 13 ? 2 : 3);
  for (const f of FK) if (fx[f]) t.push(`<span class="tag ${fx[f] > 0 ? 'up' : 'dn'}">${FACTION[f].short} ${(fx[f] > 0 ? '▲' : '▼').repeat(arrows(fx[f]))}</span>`);
  if (fx.cash) t.push(`<span class="tag ${fx.cash > 0 ? 'up' : 'dn'}">${money(fx.cash, true)}</span>`);
  if (fx.debt) t.push(`<span class="tag dn">Bonds ${money(fx.debt)}</span>`);
  if (fx.healthMod) t.push(`<span class="tag ${fx.healthMod > 0 ? 'up' : 'dn'}">Health ${fx.healthMod > 0 ? '▲' : '▼'}</span>`);
  if (fx.riverMod) t.push(`<span class="tag ${fx.riverMod > 0 ? 'up' : 'dn'}">River ${fx.riverMod > 0 ? '▲' : '▼'}</span>`);
  if (fx.cohesion) t.push(`<span class="tag ${fx.cohesion > 0 ? 'up' : 'dn'}">Getting along ${fx.cohesion > 0 ? '▲' : '▼'}</span>`);
  if (fx.housingQ) t.push(`<span class="tag ${fx.housingQ > 0 ? 'up' : 'dn'}">Housing ${fx.housingQ > 0 ? '▲' : '▼'}</span>`);
  if (fx.planAdj) t.push(`<span class="tag">${fx.planAdj > 0 ? 'More' : 'Fewer'} mills</span>`);
  return t.join('');
}

function updateForecast() {
  const S = me(); const yr = YEARS[G.yi]; const B = G.budget;

  const tone = tx >= 3 ? ['bad', 'Old families and the Company will be angry about taxes this high.'] : tx >= 1 ? ['', 'Taxpayers will grumble about a rate above $6.'] : tx <= -1.5 ? ['good', 'Taxpayers will be pleased, but will there be enough money?'] : ['', 'A normal rate. Taxpayers won’t complain much.'];
  const overLimit = bud.debtEnd > d.debtLimit;
  $('#fcPanel').innerHTML = `

    <p class="small muted">Money in and out this year, before any fires, floods, or epidemics.</p>

      <div class="sec">${bud.spend.map(x => `<div class="rline"><span>${x.label}</span><span class="amt neg">${money(-x.amt)}</span>${x.how ? `<span class="how">${x.how}</span>` : ''}</div>`).join('')}</div>
      <div class="bigline"><span>Surplus or deficit</span><span class="num ${cls(bud.net)}">${money(bud.net, true)}</span></div>
    </div>
    <div class="kv">
      <div><span class="lbl">Treasury after</span><b class="${bud.end < 0 ? 'neg' : ''}">${money(Math.max(0, bud.end))}</b></div>
      <div><span class="lbl">Debt after</span><b class="${overLimit ? 'neg' : ''}">${money(bud.debtEnd)}</b></div>
    </div>
    ${bud.bonds.length ? `<p class="small">New bonds: ${bud.bonds.map(b => `${b.label} (${money(b.amt)})`).join(', ')}. That adds about ${money(bud.newBonds * 0.06)} a year in interest.</p>` : ''}

    <div class="footer-actions">${ready ? '' : '<span class="small muted">Decide every issue above first.</span>'}<button class="btn" id="adoptBtn" ${ready ? '' : 'disabled'}>Adopt the ${YEARS[G.yi].year} decisions</button></div>`;
  document.querySelectorAll('.up').forEach(b => { const c = b.dataset.up; const lv = b.querySelectorAll('.lv i'); lv.forEach((i, k) => i.className = k < S.infra[c] ? 'on' : k === S.infra[c] && B.ups[c] ? 'new' : ''); });
}
function adopt() {
  G.lastRate = G.budget.rate;

}

// ---------- reveal ----------
function reveal() {
  const yi = G.yi;
  const { S, report } = MT.resolve(me(), yi, G.choices, G.budget, G.cond.events);
  G.town = S; G.history.push(report);
  const world = G.cond.events.filter(id => EVENTS[id].kind === 'world');
  for (const Rv of G.rivals) {
    const R = RIVALS.find(x => x.id === Rv.id);
    const { choices, B } = MT.rivalPlan(R, Rv.S, yi);
    const pre = MT.decide(Rv.S, yi, choices, B).S;
    const rnd = rng(R.id + me().name + yi);
    const local = MT.eventOdds(pre, yi).filter(e => EVENTS[e.id].kind === 'local' && rnd() < e.p).map(e => e.id);
    const res = MT.resolve(Rv.S, yi, choices, B, [...world, ...local]);
    if (!Rv.trackPop) { Rv.trackPop = [res.report.d0.pop]; Rv.trackHealth = [res.report.d0.health]; }
    Rv.trackPop.push(res.report.dA.pop); Rv.trackHealth.push(res.report.dA.health);
    Rv.S = res.S; Rv.track.push({ year: YEARS[yi].year, support: res.report.support, won: res.report.won, events: res.report.events.map(e => e.name), deaths: res.report.events.reduce((s, e) => s + (e.deaths || 0), 0) });
  }
  G.stage = 'results'; save(); render(); window.scrollTo(0, 0);
}

            <div class="rline"><span>Public health</span><span class="amt">${Math.round(r.d0.health)} → <b class="${r.dA.health >= r.d0.health ? 'pos' : 'neg'}">${Math.round(r.dA.health)}</b></span></div>
            <div class="rline"><span>River</span><span class="amt">${Math.round(r.d0.river)} → <b class="${r.dA.river >= r.d0.river ? 'pos' : 'neg'}">${Math.round(r.dA.river)}</b></span></div>
            <div class="rline"><span>Getting along</span><span class="amt">${Math.round(r.cohesion[0])} → <b class="${r.cohesion[1] >= r.cohesion[0] ? 'pos' : 'neg'}">${Math.round(r.cohesion[1])}</b></span></div>
            <div class="rline"><span>Property value</span><span class="amt">${fmt(r.d0.V)} → <b>${fmt(r.dA.V)}</b></span></div>
          </div>
        </div>
      </div>
      <div class="stack">
        <div class="panel">
          <h2>What happened this year</h2>
          ${r.events.length ? r.events.map(e => `<div class="callout ${EVENTS[e.id].kind === 'local' || e.deaths ? 'bad' : ''} small"><b>${e.name}.</b> ${e.note} ${e.lines.join(' ')}</div>`).join('') : '<p class="small muted">A quiet year. No disasters struck.</p>'}
          <p class="small muted"><b>In real-life Lowell:</b> ${yr.hist}</p>
        </div>
        <figure class="map">${drawTown(S)}<figcaption>${esc(S.name)} after ${yr.year}.</figcaption></figure>
        <div class="panel"><h2>Voices of the town</h2>${voices(S)}</div>
        <div class="panel">
          <div class="row"><h2>The election</h2><span class="spacer"></span><span class="pill ${r.won ? 'good' : 'bad'}">${Math.round(r.support)}% support</span></div>
          ${FK.map(f => { const a = r.approvals[f]; const parts = a.parts.slice().sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
            return `<details class="facd c-${f}"><summary class="fac"><span class="nm">${FACTION[f].name}</span><span class="bar"><i style="width:${a.after}%"></i></span><b class="num" style="text-align:right">${a.after}</b></summary>
            <span class="why">${a.before} → ${a.after}. ${Math.round(YEARS[r.yi].voters[f] * 100)}% of voters. ${parts.slice(0, 6).map(p => `${p[0]} <b class="${cls(p[1])}">${signed(p[1])}</b>`).join(' · ')}${Math.abs(a.drift) >= 0.5 ? ` · Memories fade <b>${signed(a.drift)}</b>` : ''}</span></details>`; }).join('')}
          <p class="small muted">Tap a group to see why its approval moved.</p>
        </div>
        <div class="panel"><h2>The neighboring towns</h2>${neighbors()}</div>
      </div>
    </div>
    <div class="footer-actions"><button class="btn" id="nextBtn">${G.yi < LAST ? `On to ${YEARS[G.yi + 1].year}` : 'See how it all turned out'}</button></div>
  </div>`;
}
function townRows() {
  const all = [{ id: 'me', name: me().name, label: 'Your town', S: me(), won: G.history.filter(h => h.won).length },
    ...G.rivals.map(Rv => { const R = RIVALS.find(x => x.id === Rv.id); return { id: R.id, name: R.name, label: R.label, motto: R.motto, S: Rv.S, won: Rv.track.filter(t => t.won).length }; })];
  return all.map(t => ({ ...t, d: MT.derive(t.S) }));
}
function neighbors() {
  const rows = townRows(); const n = G.history.length;
  return `<div class="tblwrap"><table><thead><tr><th>Town</th><th class="r">People</th><th class="r">Mills</th><th class="r">Health</th><th class="r">River</th><th class="r">Debt</th><th class="r">Elections won</th></tr></thead><tbody>
    ${rows.map(t => `<tr class="${t.id === 'me' ? 'me' : ''}"><td>${esc(t.name)}<br><span class="small muted">${t.label}</span></td><td class="r num">${fmtN(t.d.pop)}</td><td class="r num">${t.S.mills}</td><td class="r num ${t.d.health < 55 ? 'neg' : ''}">${Math.round(t.d.health)}</td><td class="r num ${t.d.river < 50 ? 'neg' : ''}">${Math.round(t.d.river)}</td><td class="r num ${t.S.debt > t.d.debtLimit ? 'neg' : ''}">${money(t.S.debt)}</td><td class="r num">${t.won} of ${n}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="small muted">${RIVALS.map(R => `<b>${R.name}</b>: “${R.motto}”`).join(' · ')}</p>`;
}
function nextRound() {
  if (G.yi >= LAST) G.stage = 'end';
  else { G.yi++; G.stage = 'plan'; G.choices = {}; G.budget = defaultBudget(); }
  save(); render(); window.scrollTo(0, 0);
}

// ---------- end ----------
function lineChart(series, labels, fmtY, aria) {
  const Wd = 560, Ht = 230, L = 64, R = 14, T = 12, Bm = 28;
  const all = series.flatMap(s => s.v); let lo = Math.min(0, ...all), hi = Math.max(...all, 1);
  const span = hi - lo; const step = Math.pow(10, Math.floor(Math.log10(span / 3))); const nice = [1, 2, 2.5, 5, 10].map(m => m * step).find(s => span / s <= 5) || step * 10;
  lo = Math.floor(lo / nice) * nice; hi = Math.ceil(hi / nice) * nice;
  const X = i => L + i * (Wd - L - R) / (labels.length - 1); const Y = v => T + (hi - v) / (hi - lo) * (Ht - T - Bm);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += nice) g += `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-width="1.5"' : ''}/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmtY(v)}</text>`;
  labels.forEach((l, i) => g += `<text x="${X(i)}" y="${Ht - 8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${l}</text>`);
  series.forEach(s => { g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" stroke-dasharray="${s.dash || ''}" points="${s.v.map((v, i) => X(i) + ',' + Y(v)).join(' ')}"/>`; s.v.forEach((v, i) => g += `<circle cx="${X(i)}" cy="${Y(v)}" r="${s.w > 2 ? 3.5 : 2.5}" fill="${s.color}"/>`); });
  return `<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${aria}">${g}</svg>`;
}
function grade(v, cuts) { return v >= cuts[0] ? 'A' : v >= cuts[1] ? 'B' : v >= cuts[2] ? 'C' : v >= cuts[3] ? 'D' : 'F'; }
function renderEnd() {
  const S = me(); const H = G.history; const d = MT.derive(S);
  const labels = ['1823', ...H.map(h => YEARS[h.yi + 1] ? YEARS[h.yi + 1].year : 1860)];
  const mine = { pop: [H[0].d0.pop, ...H.map(h => h.dA.pop)], health: [H[0].d0.health, ...H.map(h => h.dA.health)] };
  const colors = { me: 'var(--gold)', thorn: 'var(--f-workers)', wex: 'var(--f-company)', hollis: 'var(--f-old)', ames: 'var(--muted)' };
  const won = H.filter(h => h.won).length;
  const deaths = S.deaths; const fair = ((S.approval.workers + S.approval.irish) / 2 + S.cohesion) / 2;
  const debtRatio = S.debt / d.V;
  const grades = [
    ['Prosperity', grade(d.V, [4.5e6, 3.5e6, 2.5e6, 1.5e6]), `${fmt(d.V)} in taxable property`],
    ['Public health', grade(d.health, [80, 70, 60, 50]), `Health ${Math.round(d.health)}; ${fmtN(deaths)} deaths from epidemics`],
    ['Town finances', grade(-debtRatio, [-0.01, -0.03, -0.05, -0.07]), `${money(S.debt)} debt, ${(debtRatio * 100).toFixed(1)}% of property value`],
    ['Fairness', grade(fair, [70, 60, 50, 40]), `Workers ${S.approval.workers}, Irish ${S.approval.irish}, getting along ${Math.round(S.cohesion)}`],
    ['The river', grade(d.river, [75, 60, 45, 30]), `River health ${Math.round(d.river)} of 100`],
    ['Politics', grade(won, [6, 5, 4, 3]), `Won ${won} of ${H.length} elections`],
  ];
  const dependence = S.pop.ops + S.pop.irish > 0 ? (S.mills * MT.JOBS) / d.pop : 0;
  const rivalsPop = G.rivals.map(Rv => ({ id: Rv.id, name: RIVALS.find(x => x.id === Rv.id).name }));
  app.innerHTML = `<div class="stack fade">
    <div class="yearhead"><span class="era">1823–1860 · Final report</span><h1>${esc(S.name)}, ${d.feel.toLowerCase()}</h1></div>
    <p class="intro">In 1823 your town had about 1,440 people and no mills. It now has <b>${fmtN(d.pop)}</b> people and <b>${S.mills}</b> mills. Old families are ${Math.round(S.pop.old / d.pop * 100)}% of the town, Yankee mill workers ${Math.round(S.pop.ops / d.pop * 100)}%, and Irish newcomers ${Math.round(S.pop.irish / d.pop * 100)}%.</p>
    <div class="panel"><h2>Report card</h2>
      <div class="grades">${grades.map(([k, g, why]) => `<div class="grade"><span class="lbl">${k}</span><b class="g-${g}">${g}</b><span class="small muted">${why}</span></div>`).join('')}</div>
      <p class="small muted">There is no single score. A town can earn an A for prosperity and an F for the river. Which grades matter most is a question for discussion.</p></div>
    <div class="grid even">
      <div class="panel chart"><h2>Population</h2>${lineChart([...townRows().filter(t => t.id !== 'me').map(t => ({ v: popTrack(t.id), color: colors[t.id], w: 1.6, dash: '4 3' })), { v: mine.pop, color: colors.me, w: 3 }], labels, v => v >= 1000 ? Math.round(v / 1000) + 'k' : v, 'Population by year, your town and neighbors')}
        ${chartLegend(colors)}</div>
      <div class="panel chart"><h2>Public health</h2>${lineChart([...townRows().filter(t => t.id !== 'me').map(t => ({ v: healthTrack(t.id), color: colors[t.id], w: 1.6, dash: '4 3' })), { v: mine.health, color: colors.me, w: 3 }], labels, v => Math.round(v), 'Public health by year, your town and neighbors')}
        ${chartLegend(colors)}</div>
    </div>
    <div class="panel"><h2>The neighboring towns</h2>${neighbors()}</div>
    <div class="panel"><h2>Your decisions</h2><div class="tblwrap"><table><thead><tr><th>Year</th><th>Decisions</th><th class="r">Tax rate</th><th>Events</th><th class="r">People after</th><th class="r">Health</th><th class="r">Support</th></tr></thead><tbody>
      ${H.map(h => `<tr><td class="num">${h.year}</td><td class="small">${YEARS[h.yi].issues.map(id => `${ISSUES[id].short}: <b>${MT.opt(id, h.choices[id]).label}</b>`).join('<br>')}</td><td class="r num">$${h.B.rate.toFixed(2)}</td><td class="small">${h.events.map(e => e.name).join(', ') || '–'}</td><td class="r num">${fmtN(h.dA.pop)}</td><td class="r num">${Math.round(h.dA.health)}</td><td class="r num ${h.won ? 'pos' : 'neg'}">${Math.round(h.support)}%</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="panel"><h2>Epilogue: 1860–1861</h2>
      <p class="intro"><b>January 10, 1860.</b> The five-story Pemberton Mill in Lawrence, Massachusetts, collapsed with hundreds of workers inside, many of them Irish women and girls. At least 88 people died. Investigators blamed brittle cast-iron columns and floors crowded with heavy machinery. ${S.flags.inspect ? `Your 1855 inspections had found and replaced weak columns in ${esc(S.name)}’s newest mills. Your workers went to work the next morning without fear.` : `${esc(S.name)} never required inspections. Engineers who checked your newest mills after the disaster found the same weak columns, and two mills had to close for rebuilding.`}</p>
      <p class="intro"><b>April 1861.</b> The Civil War began. Every bale of cotton your mills spun had been grown by enslaved people in the South, and now the cotton stopped coming. Lowell’s mill owners sold off their cotton and closed most of their mills, throwing about 10,000 people out of work. In ${esc(S.name)}, about <b>${Math.round(dependence * 100)}%</b> of residents depended on mill jobs. ${dependence > 0.4 ? 'For most families, the war meant hard times at home.' : dependence > 0.15 ? 'Many families suffered, but the town had other ways to earn a living.' : 'As a farm town, you were spared the worst of the “cotton famine.”'}</p>
    </div>
    <div class="panel"><h2>Think it over</h2>
      <ol class="qs">
        <li>Which decision from 1823 shaped everything after it? Could a later board have undone it?</li>
        <li>Find a laissez-faire choice that saved money at first. Did it cost the town more later, in fires, disease, or a dirty river? Who paid that cost?</li>
        <li>Who paid for roads, drains, and schools, and who benefited most from them? Was that fair?</li>
        <li>Most mill workers and most Irish residents could not vote. Did you make choices for people who couldn’t vote for you? What did it cost you at the polls?</li>
        <li>Old families said the town no longer felt like home. Irish families said they were unwelcome. Using your town’s numbers, what really changed, and what caused it?</li>
        <li>Compare your town with Thornbury, Wexcombe, Hollisford, and North Ames. In which would you rather have lived as a mill girl? As an Irish laborer? As a shopkeeper?</li>
        <li>Northern mills ran on cotton grown by enslaved people. Senator Charles Sumner called this an alliance between “the lords of the lash and the lords of the loom.” What did he mean?</li>
      </ol></div>
    <div class="footer-actions"><button class="btn" id="restartBtn2">Play again</button></div>
  </div>`;
}
function popTrack(id) { const Rv = G.rivals.find(x => x.id === id); return Rv.trackPop || [1440]; }
function healthTrack(id) { const Rv = G.rivals.find(x => x.id === id); return Rv.trackHealth || [86]; }
function chartLegend(colors) {
  return `<div class="legend"><span style="--c:${colors.me}">${esc(me().name)}</span>${G.rivals.map(Rv => `<span style="--c:${colors[Rv.id]}">${RIVALS.find(x => x.id === Rv.id).name}</span>`).join('')}</div>`;
}

// ---------- router ----------
function render() {
  renderChrome();
  if (!G || G.stage === 'setup') return renderSetup();
  if (G.stage === 'intro') return renderIntro();
  if (G.stage === 'plan') return renderPlan();
  if (G.stage === 'desk') return renderDesk();
  if (G.stage === 'results') return renderResults();
  if (G.stage === 'end') return renderEnd();
}
let confirmArmed = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.issue) { G.choices[b.dataset.issue] = b.dataset.opt; b.parentElement.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); updateForecast(); return; }
  if (b.dataset.up) { G.budget.ups[b.dataset.up] = !G.budget.ups[b.dataset.up]; b.setAttribute('aria-pressed', !!G.budget.ups[b.dataset.up]); save(); updateForecast(); return; }
  if (b.dataset.relief) { G.budget.relief = b.dataset.relief; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); updateForecast(); return; }
  switch (b.id) {
    case 'startBtn': setup.desk = $('#desk').checked; startGame(); break;
    case 'introBtn': G.stage = 'plan'; save(); render(); window.scrollTo(0, 0); break;
    case 'adoptBtn': adopt(); break;
    case 'histEvBtn': { const pre = MT.decide(me(), G.yi, G.choices, G.budget).S; G.cond = { events: MT.suggestEvents(pre, G.yi, Math.random, 'history'), mode: 'history' }; save(); renderDesk(); break; }
    case 'redrawBtn': { const pre = MT.decide(me(), G.yi, G.choices, G.budget).S; G.cond = { events: MT.suggestEvents(pre, G.yi), mode: 'history+random' }; save(); renderDesk(); break; }
    case 'revealBtn': reveal(); break;
    case 'nextBtn': nextRound(); break;
    case 'restartBtn2': G = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); window.scrollTo(0, 0); break;
    case 'restartBtn':
      if (Date.now() - confirmArmed < 4000) { G = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); }
      else { confirmArmed = Date.now(); b.textContent = 'Click again to restart'; setTimeout(() => { if (b.isConnected) b.textContent = 'Restart game'; }, 4000); }
      break;
  }
});
document.addEventListener('input', e => {
  if (!G) { if (e.target.id === 'nm') setup.name = e.target.value; return; }
  if (G.stage !== 'plan') return;
  if (e.target.id === 'rate') { G.budget.rate = +e.target.value; save(); updateForecast(); }
  if (e.target.id === 'borrow') { G.budget.borrow = +e.target.value; save(); updateForecast(); }
});
document.addEventListener('change', e => {
  if (G && G.stage === 'desk' && e.target.dataset.ev) { const id = e.target.dataset.ev; G.cond.events = e.target.checked ? [...new Set([...G.cond.events, id])] : G.cond.events.filter(x => x !== id); G.cond.mode = 'custom'; save(); updateDeskPreview(); }
});
render();
})();
</script>
</body>
