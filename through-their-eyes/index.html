<style>
/* Layout: parchment cards, one per moment; two tracks (his war / your war); a 10×10 regiment grid decides each fate. */
:root{
  color-scheme: light;

  --shadow:0 1px 0 rgba(34,37,30,.06), 0 18px 40px -24px rgba(34,37,30,.5);
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;

  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark; --bg:#0F140F; --paper:#192019; --paper-2:#20281F; --ink:#E3E7DA; --ink-soft:#A8AF9D; --rule:#3A4537;
  --river:#8BB5CF; --seal:#DB7261; --on-seal:#1B0D0B; --brass:#DFBD6B; --brass-fill:#BE9641;
  --union:#8FB0DE; --sick:#9DBB76; --home:#A6B394; --good:#8FC07D;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8); } }
:root[data-theme="dark"]{
  color-scheme: dark; --bg:#0F140F; --paper:#192019; --paper-2:#20281F; --ink:#E3E7DA; --ink-soft:#A8AF9D; --rule:#3A4537;
  --river:#8BB5CF; --seal:#DB7261; --on-seal:#1B0D0B; --brass:#DFBD6B; --brass-fill:#BE9641;
  --union:#8FB0DE; --sick:#9DBB76; --home:#A6B394; --good:#8FC07D;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8); }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:1.125rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--river);outline-offset:3px}

.shell{max-width:1060px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.question{font-family:var(--display);font-size:1.45rem;line-height:1.2;margin:1.1em 0 .6em}
.opts{display:grid;gap:10px}
.opt{appearance:none;width:100%;text-align:left;font:inherit;color:inherit;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--paper-2);border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:3px;padding:12px 16px;cursor:pointer}

.verdict{display:flex;align-items:center;gap:16px;margin:22px 0 10px}

.verdict p{margin:0;font-size:1.1rem}
blockquote.q{margin:16px 0;padding:14px 18px;border-left:4px solid var(--brass);background:color-mix(in srgb,var(--brass-fill) 10%,var(--paper));font-family:var(--display);font-size:1.3rem;line-height:1.35}

.box{margin-top:16px;border-left:4px solid var(--river);background:color-mix(in srgb,var(--river) 7%,var(--paper));padding:12px 16px;border-radius:0 4px 4px 0}

.box p{margin:0 0 .5em;font-size:1rem}
.box p:last-child{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.btn{appearance:none;font:inherit;font-weight:700;font-size:1.05rem;border-radius:3px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--seal) 86%,black)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.facts{margin:18px 0 0;border:1px solid var(--rule);background:var(--paper-2);padding:14px 18px;border-radius:2px}
.facts h3{font-size:1.25rem;margin-bottom:.4em}
.facts dl{display:grid;grid-template-columns:auto 1fr;gap:3px 18px;margin:0}
.facts dt{color:var(--ink-soft)} .facts dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.facts .note{font-size:.9rem;color:var(--ink-soft);margin:.6em 0 0}
.grid100{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;max-width:440px;margin:14px 0 10px}
.cell{appearance:none;border:1.5px solid var(--rule);background:var(--paper-2);border-radius:3px;aspect-ratio:1;padding:2px;display:grid;place-items:center;color:var(--ink-soft);cursor:default}
.cell svg{width:72%;height:72%;fill:currentColor}
.pick .cell{cursor:pointer}
.pick .cell:hover{border-color:var(--ink);color:var(--ink)}
.cell.k{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.cell.w{background:var(--brass-fill);border-color:var(--brass-fill);color:#2A1E05}
.cell.c{background:var(--river);border-color:var(--river);color:var(--paper)}
.cell.dis{background:var(--sick);border-color:var(--sick);color:var(--paper)}
.cell.dh{background:var(--home);border-color:var(--home);color:var(--paper)}
.cell.ok{opacity:.75}
.cell.me{outline:3px solid var(--ink);outline-offset:2px;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:1rem;margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:2px;display:inline-block;border:1.5px solid var(--rule)}
.legend i.k{background:var(--seal);border-color:var(--seal)} .legend i.w{background:var(--brass-fill);border-color:var(--brass-fill)}
.legend i.c{background:var(--river);border-color:var(--river)} .legend i.dis{background:var(--sick);border-color:var(--sick)} .legend i.dh{background:var(--home);border-color:var(--home)}
.result{border-left:5px solid var(--ink-soft);background:var(--paper-2);padding:12px 16px;border-radius:0 3px 3px 0;margin-top:12px}
.result.bad{border-color:var(--seal)} .result.good{border-color:var(--home)} .result.mid{border-color:var(--brass-fill)}
.result b{font-family:var(--display);font-weight:400;font-size:1.45rem;display:block}
.sidebyside{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,3vw,28px);margin-top:16px}
@media (max-width:700px){.sidebyside,.tracks{grid-template-columns:1fr}}
.col{border:1px solid var(--rule);border-top:5px solid var(--union);background:var(--paper-2);border-radius:3px;padding:14px 16px}
.col.you{border-top-color:var(--seal)}
.col h3{margin-bottom:.2em}
.col .fate{font-family:var(--display);font-size:1.3rem;margin:0 0 .4em}
.col ol{margin:0;padding-left:1.2em;font-size:.98rem}
.col li{margin-bottom:4px}
.letter{max-width:620px;margin:10px auto 0;font-family:var(--display);font-size:1.3rem;line-height:1.5}
.letter p{margin:0 0 .6em}
.letter .sig{text-align:right;font-style:italic}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:1rem;min-width:520px}
.t th{text-align:left;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--rule);padding:6px 8px}
.t td{border-bottom:1px solid var(--rule);padding:7px 8px;vertical-align:top}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:999px}
.tag.match{background:var(--brass-fill);color:#2A1E05}
.tag.diff{border:1px solid var(--ink-soft);color:var(--ink-soft)}
.sect{margin-top:28px;padding-top:20px;border-top:1px solid var(--rule)}
ol.qs{padding-left:22px;display:grid;gap:8px}
textarea.summary{width:100%;min-height:260px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88rem;line-height:1.5;padding:12px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)}
.copyok{color:var(--good);font-weight:700}
.foot{margin-top:26px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink-soft);font-size:.9rem}
.linkbtn{appearance:none;background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
</style>
</head>

<script>
/* ======================================================================
   THROUGH THEIR EYES
   Two tracks: predict what a real soldier did (his war), and live the war
   yourself as a private in his regiment (your war), with real odds.
   Each chapter: story → prediction → reveal → your choice → your fate.
   ====================================================================== */
/*ENGINE-START*/
// Monthly chance of dying of disease. Union average from Soldier's Odds; Black regiments
// were given more labor duty and worse medical care, and died of disease about twice as often.
const DISEASE = { white: 0.0042, black: 0.0085, confed: 0.0055 };
// Share of wounded who died of their wounds, and share of wounded survivors discharged as unfit (from Soldier's Odds).
const SIDES = { U: { dow: 0.156, discharge: 0.20 }, C: { dow: 0.18, discharge: 0.12 } };
// Chance of dying as a prisoner: early-war prisoners were quickly exchanged; after mid-1863 they were not.
const PRISON = { exchange: 0.03, douglas: 0.08, union: 0.155, andersonville: 0.29, confed: 0.12 };
// A deserter usually made it home; if caught he was punished and sent back; a few were shot as examples.
const DESERT = [['dh', 'Made it home', 0.70], ['c', 'Caught and sent back', 0.29], ['k', 'Caught and shot', 0.01]];

const SOLDIERS = {
  rhodes: {
    name: 'Elisha Hunt Rhodes', short: 'Rhodes', unit: '2nd Rhode Island Infantry', race: 'white', years: '1861–1865',
    img: ['Elisha Hunt Rhodes (7222613128).jpg', 'Elisha Hunt Rhodes, 2nd Rhode Island Infantry.'],
    blurb: 'A 19-year-old clerk from Rhode Island who fought in the East from the first battle to the last.',
    intro: [
      'Elisha Hunt Rhodes was 19 when the war began. His father, a sailor, had drowned at sea, and Elisha helped support his widowed mother. It took a lot of persuading before she let him enlist.',
      'He joined the 2nd Rhode Island Infantry in June 1861. He was soon made first sergeant, though he later admitted he had no idea what a first sergeant was supposed to do. He kept a diary the whole war. You will follow him, and you will enlist in the same regiment.'
    ],
    quote: ['just what a First Sergeant’s duty might be I had no idea.', 'Elisha Hunt Rhodes, on joining the regiment in 1861'],
    end: 'Rhodes fought in every major campaign of the Army of the Potomac, from Bull Run to Appomattox. He rose from the ranks to command his regiment as a colonel. He went home in July 1865, became a businessman in Providence, and died in 1917. His great-grandson published his diary in 1985.',
    endFate: 'Survived the war as colonel of his regiment',
    think: 'Rhodes changed his mind about Black soldiers and about what the war was for. What changed it?',
    chapters: [
      { date: 'July 21, 1861', title: 'Bull Run',
        img: ['Bull run bridge 1862.jpg', 'The wrecked Stone Bridge over Bull Run, photographed in 1862.'],
        text: ['Everyone expects one big battle to end the war. On a hot Sunday the Union army attacks along a creek called Bull Run, and the 2nd Rhode Island is one of the first regiments sent in. Your colonel, John Slocum, and your major, Sullivan Ballou, are both mortally wounded.',
          'By late afternoon the Union line breaks, and the army runs all the way back to Washington.'],
        predict: { q: 'When Confederate bullets first hit the 2nd Rhode Island, what did Rhodes and the men do?',
          options: [['charge', 'Charged the Confederate line with bayonets'], ['lay', 'Dropped flat on the ground without waiting for orders'], ['run', 'Broke and ran to the rear'], ['stand', 'Stood in a straight line and fired, as they had drilled']],
          answer: 'lay', quote: ['immediately laid down without waiting for orders.', 'Rhodes’s diary, describing the regiment under fire at Bull Run'],
          reveal: 'Brand-new soldiers learned fast. Lying down saved lives, and later in the war veterans did it without thinking. Rhodes survived his first battle and the long, humiliating retreat.' },
        yours: { q: 'Bullets are snapping overhead. What do you do?',
          options: [['down', 'Get down and fire from the ground', 'Like the men around you.', { bat: 0.8 }], ['stand', 'Stand and fire, like you were drilled', 'Officers want a straight line.', { bat: 1.25 }]] },
        fate: { months: 2, k: 481 / 18000, w: 1011 / 18000, c: 1216 / 18000, cap: 'exchange',
          facts: [['Union soldiers engaged', '18,000'], ['Killed', '481'], ['Wounded', '1,011'], ['Captured or missing', '1,216']],
          note: 'Whole Union army at Bull Run. Prisoners this early in the war were usually exchanged within months.' } },
      { date: 'March – August 1862', title: 'The Peninsula',
        img: ['Savage Station, Va. Field hospital after the battle of June 27 LOC cwpb.01063.jpg', 'Wounded Union soldiers at a field hospital at Savage’s Station, Virginia, June 1862.'],
        text: ['General George McClellan ships the army to the peninsula southeast of Richmond. By June you are close enough to hear Richmond’s church bells. Then General Robert E. Lee attacks in the Seven Days’ Battles, and McClellan retreats to the James River.',
          'The real killer on the Peninsula is the swamp. Typhoid, dysentery and malaria put thousands of men in the hospital. Rhodes is promoted to lieutenant in July.'],
        predict: { q: 'After the Seven Days, McClellan pulls the army back down the Peninsula. What did Rhodes think?',
          options: [['relief', 'He was relieved to get away from Lee'], ['wrong', 'He thought the army was going the wrong way'], ['home', 'He wanted to go home'], ['lincoln', 'He blamed President Lincoln']],
          answer: 'wrong', quote: ['We are moving in the wrong direction, it seems to me.', 'Rhodes’s diary, summer 1862'],

// New recruits died of disease far more often than veterans who had survived their first year.
const ROOKIE = 1.5, VETERAN = 0.35;
function oddsFor(G, chapter, mod) {

  const pd = 1 - live;
  const b = mod.bat == null ? 1 : mod.bat, cm = mod.cap || 1;
  const k = f.k * b * (1 - pd), w = f.w * b * (1 - pd), c = f.c * b * cm * (1 - pd);
  return [['dis', 'Died of disease', pd], ['k', 'Killed', k], ['w', 'Wounded', w], ['c', 'Captured', c], ['ok', 'Came through', Math.max(0, 1 - pd - k - w - c)]];
}
function woundOdds(G) { const s = SIDES[SOLDIERS[G.sid].side || 'U']; return [['k', 'Died of wounds', s.dow], ['dh', 'Discharged and sent home', (1 - s.dow) * s.discharge], ['ok', 'Recovered and returned', (1 - s.dow) * (1 - s.discharge)]]; }

function resolve(G, chapter, mod, rnd = Math.random) {

  const out = { first: pick(oddsFor(G, chapter, mod), rnd), second: null };
  if (out.first === 'w') out.second = pick(woundOdds(G), rnd);

}

const DFIRST = { dh: ['good', 'You made it home.', ' You slip away at night and walk home through the woods. Your war is over. If the army ever catches you, you could still be shot.'],
  c: ['mid', 'You were caught.', ' Cavalry patrols bring you back in irons. You are whipped, lose your pay and are sent back to the ranks.'],
  k: ['bad', 'You were caught and shot.', ' A court-martial sentences you to death as an example. Your whole brigade is lined up to watch.'] };
const FIRST = { dis: ['bad', 'You died of disease.', 'You never fell in battle. Fever and dysentery killed you in camp, far from any battlefield.'],
  k: ['bad', 'You were killed.', ''], w: ['mid', 'You were wounded.', 'You are carried to a field hospital. What happens next?'],
  c: ['mid', 'You were captured.', ''], ok: ['good', 'You came through.', 'You are alive and in one piece, for now.'] };
function renderFate() {
  const C = CH(), f = C.fate, roll = G.roll;
  const first = roll.pick != null ? (G.res.desert ? DFIRST : FIRST)[roll.fate] : null;
  const capText = f.cap === 'douglas' ? 'You are sent north to Camp Douglas, a crowded, disease-ridden prison camp in Chicago. In the summer of 1862 the two sides agree to exchange prisoners again.' : f.cap === 'exchange' ? 'Early in the war, prisoners were usually exchanged within a few months.' : f.cap === 'andersonville' ? 'Black prisoners were not exchanged, and some were enslaved or killed. You are sent to a Confederate prison.' : f.cap === 'confed' ? 'Prisoner exchanges have stopped. You are sent to a Union prison camp, such as Camp Douglas in Chicago, until the war ends.' : 'Prisoner exchanges have stopped. You are sent to a prison camp until the war ends.';
  app.innerHTML = `<section class="card fade">
    <p class="dateline">Your war${C.fate.where ? '' : ' · ' + esc(C.date)}</p><h2>${esc(C.fate.where ? Cap(C.fate.where) : C.title)}</h2>
    <div class="split"><div>${gridHTML(roll)}
      ${first ? `<div class="result ${first[0]}"><b>${first[1]}</b>${first[2] || (roll.fate === 'c' ? capText : '')}</div>` : ''}
      ${first && G.roll2 ? `<h3 style="margin-top:18px">${roll.fate === 'w' ? 'The surgeon' : 'Prison'}</h3>${gridHTML(G.roll2)}${G.roll2.pick != null ? `<div class="result ${G.roll2.fate === 'k' ? 'bad' : G.roll2.fate === 'dh' ? 'good' : 'mid'}"><b>${G.roll2.groups.find(g => g[0] === G.roll2.fate)[1]}.</b>${secondText()}</div>` : ''}` : ''}
    </div>
    <div><div class="facts"><h3>The real numbers</h3><dl>${f.facts.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl><p class="note">${esc(f.note)}</p></div>
      <div class="facts"><h3>Your odds this chapter</h3><dl>${roll.groups.filter(g => g[2] > 0.0005).map(([k, l, p]) => `<dt>${l}</dt><dd>${pct(p)}</dd>`).join('')}</dl><p class="note">Includes disease over ${f.months} month${f.months > 1 ? 's' : ''}${G.ychoice ? ' and your choice' : ''}.</p></div></div></div>
    ${done() ? `<div class="actions"><button class="btn primary" id="go">${G.you.status === 'active' ? nextChapterLabel() : 'Keep following ' + esc(S().short)}</button></div>` : ''}
  </section>`;
  if (roll.pick == null) bindGrid(roll, renderFate);
  else if (G.roll2 && G.roll2.pick == null) bindGrid(G.roll2, renderFate);
  if (done() && !G.applied) { apply(G, G.ch, G.res); G.applied = true; save(); renderChrome(); }
  const go = $('#go'); if (go) go.onclick = advance;
}
function done() { return G.roll.pick != null && (!G.roll2 || G.roll2.pick != null); }
function secondText() {
  const r = G.roll2.fate, first = G.roll.fate;
  if (first === 'w') return r === 'k' ? ' Infection was the killer. Surgeons had no idea germs existed.' : r === 'dh' ? ' Your wound is too serious for you to keep fighting. You are going home.' : ' After weeks in the hospital, you rejoin your regiment.';
  return r === 'k' ? ' Hunger, exposure and disease killed you in prison.' : (CH().fate.cap === 'exchange' || CH().fate.cap === 'douglas') ? ' After a few months you are exchanged and return to your regiment.' : ' You survive, starving and sick, until the war ends.';
}
function nextChapterLabel() { return G.ch + 1 < S().chapters.length ? 'Next: ' + S().chapters[G.ch + 1].title : 'How it ended'; }
function advance() {
  G.roll = G.roll2 = G.res = null; G.pchoice = G.ychoice = null;
  if (G.ch + 1 < S().chapters.length) { G.ch++; G.step = 'story'; }
  else { G.step = G.you.status === 'dead' ? 'letter' : 'end'; }
  save(); render();
}

// ---------- the letter ----------
function renderLetter() {
  app.innerHTML = `<section class="card fade">
    <p class="dateline">Spotsylvania, Virginia · May 10, 1864</p><h2>A Soldier’s Last Letter</h2>
    <div class="prose"><p>You did not survive the war. Neither did about 700,000 other soldiers. Most of their families never saw them again, and many never learned exactly how they died.</p>
      <p>James Robert Montgomery was a 26-year-old Confederate private from Camden, Mississippi. On May 10, 1864, a shell fragment tore into his right shoulder. Knowing he was dying, he wrote to his father. His blood is still on the paper.</p></div>
    <div class="letter">
      <p>“Dear Father. This is my last letter to you.</p>
      <p>I have been struck by a piece of shell and my right shoulder is horribly mangled and I know death is inevitable.</p>
      <p>My grave will be marked so that you may visit it if you desire to do so.</p>
      <p>Give my love to all my friends.</p>
      <p>Again, a long farewell to you. May we meet in heaven.</p>
      <p class="sig">Your dying son, J. R. Montgomery”</p>
    </div>
    <p class="small" style="margin-top:16px">Excerpts from the letter, as read in the PBS documentary <i>Death and the Civil War</i> (2012). His family never found his grave, so they could never bring him home.</p>
    <div class="actions"><button class="btn primary" id="go">See how ${esc(S().short)}’s war ended</button></div></section>`;
  $('#go').onclick = () => { G.step = 'end'; save(); render(); };
}

// ---------- end ----------
// Where your own war was at a given chapter (some soldiers' chapters follow their story, not yours).
function whereAt(ci) { const c = S().chapters[ci]; return c.fate.where || `${c.title}, ${c.date}`; }
function yourFate() {
  const st = G.you.status, last = G.you.log[G.you.log.length - 1];
  const c = S().chapters[last.ci];
  if (st === 'dead') return last.first === 'dis' ? `Died of disease in camp: ${whereAt(last.ci)}` : `${last.text}: ${whereAt(last.ci)}`;
  if (st === 'home') return `Wounded and discharged: ${whereAt(last.ci)}. Survived.`;
  if (st === 'deserted') return `Deserted and made it home: ${whereAt(last.ci)}. Survived.`;
  if (st === 'wenthome') return 'Went home when your enlistment ended. Survived.';
  if (st === 'prison-survived') return 'Captured, and survived prison until the war ended.';
  return G.you.wounds ? `Survived the war, wounded ${G.you.wounds} time${G.you.wounds > 1 ? 's' : ''}` : 'Survived the war without a wound';
}
function report() {
  const s = S(), p = G.player, n = G.preds.filter(x => x.match).length;
  const L = ['THROUGH THEIR EYES - SUMMARY REPORT', `Student: ${p.first} ${p.initial}.   Teacher: ${p.teacher}   Period: ${p.period}`,
    `Soldier followed: ${s.name}, ${s.unit}`, `Completed: ${new Date().toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' })}`, '',
    `${PR()[1].toUpperCase()} WAR: ${s.endFate}`, `Predictions correct: ${n} of ${s.chapters.length}`, '', `YOUR WAR: ${yourFate()}`, '', 'CHAPTER BY CHAPTER'];
  s.chapters.forEach((c, i) => {
    const pr = G.preds[i]; const y = G.you.log.find(l => l.ci === i);
    const yo = c.yours && G.mine[i] ? c.yours.options.find(o => o[0] === G.mine[i])[1] : null;
    L.push(`${i + 1}. ${c.date} - ${c.title}`);
    if (pr) L.push(`   Prediction: ${pr.match ? 'correct' : 'missed'} (${c.predict.options.find(o => o[0] === pr.pick)[1]})`);
    if (yo) L.push(`   Your choice: ${yo}`);
    if (y) L.push(`   Your fate: ${y.text}`);
  });
  return L.join('\n');
}
// What goes on the class casualty board: your own war, the soldier you followed, and your prediction score.
const TEACHER_KEY = { 'Mr. Sam': 'sam', 'Mrs. Sondej': 'sondej' };
function warRecord() {
  const y = G.you, last = y.log[y.log.length - 1];
  let fate = 'home', where = '';
  if (y.status === 'dead') {
    where = whereAt(last.ci);
    fate = last.desert ? 'executed' : last.first === 'dis' ? 'disease' : last.first === 'k' ? 'killed' : last.first === 'w' ? 'wounds' : 'prison';
  }
  return { soldier: G.sid, side: (S().side || 'U') === 'U' ? 'Union' : 'Confederate', fate, where,
    wounded: y.log.filter(l => l.first === 'w' && l.second !== 'k').map(l => whereAt(l.ci)),
    captured: y.log.filter(l => l.first === 'c' && !l.desert && l.second !== 'k').map(l => whereAt(l.ci)),
    discharged: y.status === 'home', released: y.status === 'prison-survived', deserted: y.status === 'deserted', wentHome: y.status === 'wenthome',
    predicted: G.preds.filter(x => x && x.match).length, chapters: S().chapters.length };
}
async function postResult() {
  if (G.posted && ['posted', 'already', 'sending'].includes(G.posted.status)) return;
  G.posted = { status: 'sending' }; save();
  try {
    const lb = await import('./lb.js');
    const p = G.player;
    G.posted = await lb.postResult({ teacher: TEACHER_KEY[p.teacher] || 'sam', period: +p.period, first: p.first, initial: p.initial }, warRecord());
  } catch (e) { G.posted = { status: 'error', msg: e && e.message ? e.message : 'no connection' }; }
  save();
  const el = document.getElementById('poststatus'); if (el) { el.innerHTML = postStatus(); bindRetry(); }
}
function postStatus() {
  const st = G.posted || {}, who = `${esc(G.player.first)} ${esc(G.player.initial)}.`;
  return st.status === 'posted' ? 'Your war is now on the <a href="leaderboard/" target="_blank">class casualty board</a>.'
    : st.status === 'already' ? `${who} already has a game on the casualty board. Only your first game counts.`
    : st.status === 'error' ? `Your result couldn’t be posted: ${esc(st.msg)} <button class="btn" id="retry" style="padding:4px 12px;font-size:.9rem">Try again</button>`
    : 'Posting to the class casualty board…';
}
function bindRetry() { const b = document.getElementById('retry'); if (b) b.onclick = () => { G.posted = null; postResult(); }; }
function renderEnd() {
  const s = S(), n = G.preds.filter(x => x.match).length, alive = G.you.status !== 'dead';
  app.innerHTML = `<section class="card fade">
    <p class="dateline">${esc(s.unit)} · ${s.years}</p><h2>Two Wars</h2>
    <div class="sidebyside">
      <div class="col"><span class="small">${Cap(PR()[1])} war</span><h3>${esc(s.name)}</h3><p class="fate">${esc(s.endFate)}</p><p style="font-size:1rem;margin:0">${esc(s.end)}</p></div>
      <div class="col you"><span class="small">Your war</span><h3>${esc(yourName())}</h3><p class="fate">${esc(yourFate())}</p>
        <p class="small" id="poststatus" style="margin:0 0 .6em">${postStatus()}</p>
        <ol>${G.you.log.map(l => `<li><b>${esc(whereAt(l.ci))}:</b> ${esc(l.text)}</li>`).join('')}</ol></div>
    </div>
    <div class="sect"><h3>Your predictions: ${n} of ${s.chapters.length}</h3><div class="tblwrap"><table class="t"><thead><tr><th>Chapter</th><th>What really happened</th><th></th></tr></thead><tbody>
      ${s.chapters.map((c, i) => { const pr = G.preds[i]; return `<tr><td><b>${esc(c.title)}</b><br><span class="small">${esc(c.date)}</span></td><td>${esc(c.predict.options.find(o => o[0] === c.predict.answer)[1])}</td><td>${pr ? `<span class="tag ${pr.match ? 'match' : 'diff'}">${pr.match ? 'Called it' : 'Missed'}</span>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div></div>
    <div class="sect"><h3>Think about it</h3><ol class="qs">
      <li>Your war and ${esc(s.short)}’s war turned out ${alive === (s.endFate.startsWith('Survived')) ? 'the same way' : 'differently'}. How much of each soldier’s fate came from choices, and how much from luck?</li>
      <li>Which of ${esc(s.short)}’s choices surprised you most? What does it tell you about ${PR()[2]}?</li>
      <li>${esc(s.think)}</li>
      <li>Look at what happened to the men around you in each chapter. What surprised you most about how soldiers in your regiment died?</li>
    </ol></div>
    <div class="sect"><h3>Your summary report</h3><p class="small">Copy this report and paste it into Canvas.</p>
      <textarea class="summary" id="rep" readonly>${esc(report())}</textarea>
      <div class="actions"><button class="btn primary" id="copy">Copy report</button><span id="copied" class="copyok" aria-live="polite"></span><span style="flex:1"></span><button class="btn" id="again">Follow another soldier</button></div></div>
  </section>`;
  $('#copy').onclick = async () => {
    const t = $('#rep'); let ok = false;
    try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { t.select(); try { ok = document.execCommand('copy'); } catch (e2) {} }
    $('#copied').textContent = ok ? 'Copied! Now paste it into Canvas.' : 'Select the text above and copy it.';
  };
  $('#again').onclick = () => wipe(true);
  bindRetry(); postResult();
}

// ---------- router ----------
function wipe(keepPlayer) {
  if (G && keepPlayer) setup = { ...setup, teacher: G.player.teacher, period: G.player.period, first: G.player.first, initial: G.player.initial, err: '' };
  G = null; try { localStorage.removeItem(KEY); } catch (e) {} render();
}
$('#restart').onclick = () => {
  const b = $('#restart');
  if (G && G.step !== 'end' && !b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Click again to erase this game'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Start over'; }, 4000); return; }
  delete b.dataset.sure; b.textContent = 'Start over'; wipe(true);
};
function render() {
  renderChrome();
  if (!G) renderSetup();
  else ({ intro: renderIntro, story: renderStory, reveal: renderReveal, choice: renderChoice, fate: renderFate, went: renderWent, letter: renderLetter, end: renderEnd })[G.step]();
  window.scrollTo(0, 0); app.focus({ preventScroll: true });
}
render();
</script>
</body>
</html>
