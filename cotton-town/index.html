<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A six-round classroom simulation: govern a Lancashire cotton town through the Industrial Revolution, 1786–1842.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Cotton Town Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: soot-dark header band over a two-column "commissioners' report" workspace; one column on phones. */
:root {
  --bg: #ECEBE8; --surface: #FAF9F7; --sunk: #E0DEDA; --ink: #1F1D1C; --muted: #5E5955; --line: #CBC7C1;
  --accent: #33302E; --accent-ink: #FFFFFF; --brick: #9A3B26; --gold: #96690F;
  --good: #2E7547; --bad: #B03A2A; --warn: #96690F;
  --f-company: #2F4A6E; --f-old: #5B6B3E; --f-workers: #A03B55; --f-irish: #B07419;
  --land: #E3E0D6; --field: #CFD5B4; --water: #6C8295; --mud: #6E5F44; --house: #F6F3EC; --roof: #5B5650; --mill: #9A3B26; --board: #B9705A; --shack: #85807A; --smoke: #6F6A66;
  --f-display: "Old Standard TT", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "Libre Franklin", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141312; --surface: #1C1B1A; --sunk: #262422; --ink: #E7E4E0; --muted: #A39D96; --line: #36332F;
  --accent: #D9D3CB; --accent-ink: #1A1816; --brick: #E07E63; --gold: #DDAE4E;
  --good: #79BE8D; --bad: #EC7B67; --warn: #DDAE4E;
  --f-company: #9FB6DA; --f-old: #AFC08E; --f-workers: #E58AA5; --f-irish: #E0AE55;
  --land: #262521; --field: #333828; --water: #4E6779; --mud: #645639; --house: #D6D2C8; --roof: #8C867E; --mill: #B65A42; --board: #9A5E4B; --shack: #6E6A63; --smoke: #8E8984;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141312; --surface: #1C1B1A; --sunk: #262422; --ink: #E7E4E0; --muted: #A39D96; --line: #36332F;
  --accent: #D9D3CB; --accent-ink: #1A1816; --brick: #E07E63; --gold: #DDAE4E;
  --good: #79BE8D; --bad: #EC7B67; --warn: #DDAE4E;
  --f-company: #9FB6DA; --f-old: #AFC08E; --f-workers: #E58AA5; --f-irish: #E0AE55;
  --land: #262521; --field: #333828; --water: #4E6779; --mud: #645639; --house: #D6D2C8; --roof: #8C867E; --mill: #B65A42; --board: #9A5E4B; --shack: #6E6A63; --smoke: #8E8984;
  color-scheme: dark; }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--accent);color:var(--accent-ink);border-bottom:4px solid var(--brick)}
header.band .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:31px;line-height:1.05;font-weight:700}
.brand small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px}
.timeline{display:flex;gap:4px;flex-wrap:wrap}
.timeline span{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);opacity:.6}
.timeline span.done{opacity:.85}
.timeline span.now{opacity:1;background:var(--accent-ink);color:var(--accent);font-weight:500}
.statusbar{border-bottom:1px solid var(--line);background:var(--surface)}
.statusbar .wrap{display:flex;flex-wrap:wrap;gap:6px 26px;padding-block:10px;align-items:baseline}
.stat{display:flex;gap:8px;align-items:baseline}
.stat b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:16px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.meter{display:inline-block;width:64px;height:7px;border-radius:4px;background:var(--sunk);vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.meter i.mid{background:var(--warn)} .meter i.low{background:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
main{padding-block:22px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.04}
h2{font-size:19px;font-weight:700}
h3{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
.grid.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:880px){.grid,.grid.even{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r);padding:11px 20px;font-weight:700;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:focus-visible,input:focus-visible,.opt:focus-visible,.seg button:focus-visible,.up:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.yearhead{display:flex;flex-direction:column;gap:4px}
.era{font-family:var(--f-mono);font-size:13px;color:var(--brick);letter-spacing:.03em}
.intro{max-width:66ch}
.callout{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,transparent);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:14px}
.callout.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.callout.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.issue .who{font-size:12.5px;color:var(--muted);font-style:italic}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.opt b{font-size:14.5px}
.opt .d{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--brick);padding:9px 11px;background:color-mix(in srgb,var(--brick) 6%,var(--surface))}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);white-space:nowrap}
.tag.up{color:var(--good)} .tag.dn{color:var(--bad)}
.lf{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.hint{font-size:12.5px;border-top:1px dashed var(--line);padding-top:5px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--brick)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:fit-content;max-width:100%}
.seg button{border:none;background:var(--surface);color:var(--ink);padding:7px 13px;font-size:13.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ups{display:flex;flex-direction:column;gap:6px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;background:var(--bg);color:var(--ink);text-align:left}
.up[aria-pressed="true"]{border:2px solid var(--brick);padding:7px 11px;background:color-mix(in srgb,var(--brick) 6%,var(--surface))}
.up:disabled{opacity:.5;cursor:not-allowed}
.up .lv{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.up .lv i{width:9px;height:9px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.up .lv i.on{background:var(--accent);border-color:var(--accent)}
.up .lv i.new{background:var(--brick);border-color:var(--brick)}
.up .e{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr.me td{background:color-mix(in srgb,var(--gold) 14%,transparent);font-weight:600}
.receipt{font-size:14px}
.receipt .sec{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px dashed var(--line)}
.receipt .sec:first-of-type{border-top:none;padding-top:0}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
.rline .how{color:var(--muted);font-size:12.5px;grid-column:1/-1;margin-top:-2px}
.rline .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bigline{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:16px;padding-top:8px;border-top:2px solid var(--ink)}
.reporthead{font-family:var(--f-display);font-size:23px;line-height:1.15}
.fac{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:4px 10px;align-items:center}
.fac .nm{font-weight:700;display:flex;align-items:center;gap:7px}
.fac .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.fac .bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fac .bar i{display:block;height:100%;background:var(--c)}
.why{display:block;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.facd summary{list-style:none;cursor:pointer}
.facd summary::-webkit-details-marker{display:none}
.facd[open] summary .nm{text-decoration:underline}
.c-company{--c:var(--f-company)} .c-old{--c:var(--f-old)} .c-workers{--c:var(--f-workers)} .c-irish{--c:var(--f-irish)}
.quote{border-left:3px solid var(--c);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.quote q{font-family:var(--f-display);font-size:18px;line-height:1.3;quotes:"“" "”"}
.quote span{font-size:12.5px;color:var(--muted)}
.facgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.facgrid{grid-template-columns:minmax(0,1fr)}}
.faccard{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.faccard p{font-size:13.5px}
.votebar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.votebar i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.map{margin:0;display:flex;flex-direction:column;gap:6px}
.map svg{width:100%;height:auto;display:block;border-radius:4px}
.map figcaption{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kv div{display:flex;flex-direction:column;gap:1px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
input[type=text]{font:inherit;padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:320px}
label.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px}
label.chk input{margin-top:3px}
.setup{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.setup{grid-template-columns:minmax(0,1fr)}}
.chart svg{width:100%;height:auto;display:block}
.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grade{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.grade b{font-family:var(--f-display);font-size:36px;line-height:1}
.g-A,.g-B{color:var(--good)} .g-C{color:var(--warn)} .g-D,.g-F{color:var(--bad)}
.footer-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand"><small>Lancashire, 1786–1842 · Your town + 4 neighbors</small>The Cotton Town Game</div>
    <div class="timeline" id="timeline"></div>
  </div>
</header>
<div class="statusbar" id="statusbar" hidden><div class="wrap" id="statusInner"></div></div>
<main><div class="wrap" id="app"></div></main>

<script>
// ===== Cotton Town engine (money in pounds sterling) =====
const MT = (() => {
  const FK = ['company', 'old', 'workers', 'irish'];
  const FACTION = {
    company: { name: 'Mill masters', short: 'Masters', who: 'The cotton manufacturers who build and run the mills. They want cheap labor, low rates, and no interference from government.' },
    old: { name: 'Ratepayers', short: 'Ratepayers', who: 'Shopkeepers, merchants, innkeepers, attorneys, and landlords who pay the local rates. They run the vestry and cast most of the votes.' },
    workers: { name: 'Factory workers', short: 'Workers', who: 'Spinners, piecers, and weavers: men, women, and children. Also the handloom weavers whose trade the power loom is destroying.' },
    irish: { name: 'Irish laborers', short: 'Irish', who: 'Migrants from Ireland who dig canals, haul loads, and take the lowest-paid mill jobs. Many crowd into damp cellars in the district called “Little Ireland.”' },
  };
  const MILLV = 24000, JOBS = 300, BASE_RATE = 12, INTEREST = 0.05;
  const CATS = {
    roads:   { name: 'Paving & streets', up: 400, keep: 44, desc: 'Paved and graded streets, footways, and a stone bridge.', eff: 'Raises property values 6% per level. Masters and ratepayers like it.' },
    water:   { name: 'Drains & sewers', up: 500, keep: 52, desc: 'Brick sewers carry filth out of the courts and cellars.', eff: '+7 public health per level, but the sewers empty into the river.' },
    fire:    { name: 'Fire engines', up: 240, keep: 44, desc: 'Engines, hose, and paid firemen. Cotton mills burn easily.', eff: 'Lowers the chance and cost of a great fire.' },
    schools: { name: 'Schools & institutes', up: 360, keep: 64, desc: 'Grants to Sunday schools, day schools, and a Mechanics’ Institute.', eff: 'Every group likes schools. Helps newcomers and natives get along.' },
    police:  { name: 'Watchmen & police', up: 200, keep: 40, desc: 'Night watchmen, constables, and later a borough police force.', eff: 'Lowers the chance of riots. Ratepayers feel safer.' },
  };
  const CK = Object.keys(CATS);
  const RELIEF = { stingy: { name: 'Stingy', f: 0.5 }, standard: { name: 'Standard', f: 1 }, generous: { name: 'Generous', f: 1.4 } };

  const EVENTS = {
    fire:      { name: 'Mill fire', kind: 'local', note: 'A fire starts among the cotton waste in a spinning room. Oil-soaked floors and wooden beams burn fast, and the fire spreads to nearby cottages.', rumor: ['Fire risk', 'Cotton dust and oil lamps make every mill a tinderbox.'] },
    riot:      { name: 'Street riot', kind: 'local', note: 'A quarrel between English and Irish workers on a Saturday night turns into a riot. Windows are smashed and the Irish cellars attacked.', rumor: ['Trouble on Saturday nights', 'English workers accuse the Irish of undercutting wages.'] },
    freshet:   { name: 'Flood', kind: 'local', note: 'Heavy rain on the moors sends the river over its banks, flooding mills and cellars and washing out a weir.', rumor: ['High water?', 'A wet autumn on the moors could mean floods.'] },
    sickness:  { name: 'Typhus fever', kind: 'local', note: '“Fever” spreads through crowded lodging houses and cellars. Doctors notice it is worst where people live packed together in filth.', rumor: ['Fever in the courts', 'Doctors at the dispensary report more fever cases.'] },
    warBoom:   { name: 'War with France', kind: 'world', note: 'Britain went to war with revolutionary France in 1793. Army orders boost demand, but taxes and food prices soar.', rumor: ['War orders', 'The army needs cloth, and the masters expect big contracts.'] },
    dearth:    { name: 'Dear bread', kind: 'world', note: 'After a terrible harvest, the price of bread nearly doubles. Hungry crowds seize flour carts and sell the flour at what they call a “fair price.”', rumor: ['A poor harvest?', 'Wheat prices are climbing fast.'] },
    blockade:  { name: 'Trade collapse', kind: 'world', note: 'Napoleon’s blockade and Britain’s Orders in Council cut off European and American markets. Mills close or go on short time.', rumor: ['Markets closing?', 'Warehouses are full of cloth nobody can ship.'] },
    postwar:   { name: 'Postwar slump', kind: 'world', note: 'Peace in 1815 brought hard times: war orders ended, soldiers came home looking for work, and the new Corn Law kept bread expensive.', rumor: ['Hard times since the peace', 'Weavers’ wages have fallen by half since the war ended.'] },
    cholera:   { name: 'Cholera', kind: 'world', note: 'Cholera reaches England for the first time. It spreads through sewage-fouled water and kills within a day or two, worst in crowded, filthy districts.', rumor: ['Cholera in Sunderland', 'The disease has crossed Europe and landed in the northeast.'] },
    slump1842: { name: 'The great depression of 1842', kind: 'world', note: 'The worst slump of the century. Mills close, wages are cut, and thousands depend on poor relief and charity.', rumor: ['Short time at the mills', 'Orders have dried up, and masters talk of cutting wages.'] },
  };

  const ISSUES = {
    enclose: { title: 'Enclosing the moor', short: 'Enclosure', who: 'A bill backed by local landowners and a cotton master',
      text: 'The town’s common and moor are open land where cottagers graze a cow, keep geese, and cut turf for fuel. Landowners want Parliament to pass an act enclosing them: dividing the land into private fields and building plots. Cottagers would lose their rights and have to live on wages.',
      opts: [
        { k: 'enclose', label: 'Support enclosure', lf: true, desc: 'Private property will be put to its most profitable use, including mills and housing.', fx: { company: 10, old: 6, workers: -6, millCap: 30, flags: { enclosure: 'full' } }, hint: 'Plenty of building land. Cottagers must find wage work, often in the mills.' },
        { k: 'allot', label: 'Enclose, with allotments for cottagers', desc: 'Set aside small plots for the poor and keep a recreation ground. Costs £120 in surveying.', fx: { cash: -120, company: 2, old: 2, workers: 4, millCap: 24, flags: { enclosure: 'allot' } } },
        { k: 'oppose', label: 'Oppose enclosure', desc: 'Keep the common open. The masters will find land elsewhere.', fx: { company: -15, old: -3, workers: 6, millCap: 12, flags: { enclosure: 'none' } }, hint: 'Far less land for mills.' },
      ] },
    apprentices: { title: 'Pauper apprentices', short: 'Child apprentices', who: 'An offer from London parish overseers',
      text: 'London parishes want to send orphans and pauper children north to work in your mills as “apprentices” until age 21. They would live in an apprentice house beside the mill. It costs the masters little more than food and lodging, and it saves the London parishes their poor rates.',
      opts: [
        { k: 'accept', label: 'Welcome the apprentices', lf: true, desc: 'Cheap labor will bring more mills.', fx: { company: 10, workers: -4, cohesion: -2, planAdj: 1, flags: { apprentices: true } }, hint: 'Children as young as seven may work 12 or more hours a day.' },
        { k: 'inspect', label: 'Accept them, with inspections', desc: 'Pay visitors (£60) to inspect apprentice houses, as the 1802 Health and Morals of Apprentices Act later required.', fx: { cash: -60, company: 2, workers: 2, flags: { apprenticeInspect: true } } },
        { k: 'refuse', label: 'Refuse them', desc: 'The masters must hire local families instead.', fx: { company: -10, workers: 4, planAdj: -1 } },
      ] },
    improve: { title: 'An Improvement Act', short: 'Improvement Act', who: 'A petition from leading ratepayers',

  const YEARS = [

    { year: 1812, title: 'The Luddites', gov: 'commission', plan: 8, share: 0.08, issues: ['luddites', 'smoke'],

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const clone = o => JSON.parse(JSON.stringify(o));
  const opt = (id, k) => ISSUES[id].opts.find(o => o.k === k);

  function newTown(name) {
    return { name, treasury: 500, debt: 0, mills: 0, millCap: 22, pop: { old: 2200, ops: 800, irish: 20 },
      infra: { roads: 1, water: 0, fire: 0, schools: 1, police: 0 },
      approval: { company: 55, old: 62, workers: 55, irish: 45 },
      healthMod: 0, riverMod: 0, cohesion: 72, housingQ: 0.3, planAdj: 0, exempt: null, exemptMills: 0, reliefBase: 1,
      flags: {}, econ: 1, fireLoss: 0, reliefMult: 1, deaths: 0, fires: 0, riots: 0 };
  }

  function derive(S) {
    const pop = S.pop.old + S.pop.ops + S.pop.irish;
    const roadsM = 1 + 0.06 * S.infra.roads;
    const millV = S.mills * MILLV * S.econ;
    const homeV = pop * 16 * roadsM * S.econ;
    const V = Math.max(30000, 60000 * S.econ + millV + homeV - S.fireLoss);
    const RV = V * 0.12;
    const irishShare = pop ? S.pop.irish / pop : 0;
    const crowd = irishShare * (1 - clamp(S.housingQ, 0, 0.9)) * 1.4 + (S.flags.zoning === 'none' && pop > 8000 ? 0.08 : 0) + (S.flags.improve === 'none' && pop > 8000 ? 0.05 : 0);
    const river = clamp(100 - S.mills * 1.3 - S.infra.water * 3 - pop / 3000 + S.riverMod, 5, 100);
    const health = clamp(86 - pop / 2000 - crowd * 45 + S.infra.water * 7 + S.healthMod - (100 - river) * 0.08, 10, 95);
    const fireRisk = clamp(0.06 + pop / 60000 + (S.flags.zoning === 'none' ? 0.08 : 0) + (S.flags.unguarded ? 0.06 : 0) - S.infra.fire * 0.035, 0.03, 0.5);
    const riotRisk = clamp((58 - S.cohesion) / 70 * (1 - 0.12 * S.infra.police) * (S.flags.gas ? 0.85 : 1), 0.03, 0.6);
    const feel = pop < 4000 ? 'Market village' : pop < 12000 ? 'Mill town' : pop < 25000 ? 'Cotton town' : 'Great manufacturing town';
    return { pop, V, RV, irishShare, crowd, river, health, fireRisk, riotRisk, feel, debtLimit: V * 0.06, ps: 1 + pop / 9000 };
  }

  const upCost = (S, c, d) => Math.round(CATS[c].up * (1 + 0.35 * S.infra[c]) * (1 + d.pop / 18000) / 10) * 10;
  const keepCost = (S, c, d) => CATS[c].keep * S.infra[c] * d.ps;

  function budget(S, yi, choices, B) {
    const d = derive(S); const yr = YEARS[yi];
    const income = [], spend = [], bonds = [];
    income.push({ label: 'The rates', amt: d.RV * B.rate / 240, how: `${fmt(d.RV)} rateable value × ${sd(B.rate)} in the pound` });
    if (S.flags.gas === 'public') income.push({ label: 'Gasworks profits', amt: d.pop * 0.05, how: 'Gas sold to mills, shops, and streets' });
    for (const id of yr.issues) {
      const o = choices[id] && opt(id, choices[id]); if (!o) continue;
      if (o.fx.cash > 0) income.push({ label: o.label, amt: o.fx.cash, how: ISSUES[id].short });
      if (o.fx.cash < 0) spend.push({ label: o.label, amt: -o.fx.cash, how: ISSUES[id].short });
      if (o.fx.debt) bonds.push({ label: o.label, amt: o.fx.debt });
    }
    for (const c of CK) if (S.infra[c]) spend.push({ label: `Upkeep: ${CATS[c].name.toLowerCase()}`, amt: keepCost(S, c, d), how: `Level ${S.infra[c]}, scaled to ${fmtN(d.pop)} people` });
    for (const c of CK) if (B.ups && B.ups[c] && S.infra[c] < 5) spend.push({ label: `Build: ${CATS[c].name.toLowerCase()} to level ${S.infra[c] + 1}`, amt: upCost(S, c, d), up: c });
    const people = d.pop * 0.02 * S.reliefMult * S.reliefBase;
    spend.push({ label: `Poor relief (${RELIEF[B.relief].name.toLowerCase()})`, amt: people * 2.4 * RELIEF[B.relief].f, how: `About ${fmtN(people)} people need help${S.reliefMult > 1 ? ' (hard times)' : ''}${S.flags.speenhamland ? '; wage allowances' : ''}${S.flags.workhouse ? '; workhouse test' : ''}` });
    if (S.debt) spend.push({ label: 'Interest on town loans', amt: S.debt * INTEREST, how: `${fmt(S.debt)} borrowed on the security of the rates × 5%` });
    const totalIn = income.reduce((s, x) => s + x.amt, 0), totalOut = spend.reduce((s, x) => s + x.amt, 0);
    const newBonds = bonds.reduce((s, x) => s + x.amt, 0);
    const end = S.treasury + totalIn - totalOut + (B.borrow || 0);
    const debtEnd = S.debt + newBonds + (B.borrow || 0) + (end < 0 ? -end : 0);
    return { d, income, spend, bonds, totalIn, totalOut, newBonds, net: totalIn - totalOut, end, debtEnd, borrow: B.borrow || 0 };
  }

  function decide(S0, yi, choices, B) {
    const S = clone(S0); const yr = YEARS[yi];
    const parts = { company: [], old: [], workers: [], irish: [] }; const notes = [];
    const add = (f, label, v) => { if (Math.abs(v) >= 0.5) parts[f].push([label, v]); };
    const bud = budget(S0, yi, choices, B);
    for (const id of yr.issues) {
      const o = opt(id, choices[id]); const fx = o.fx;
      for (const f of FK) if (fx[f]) add(f, `${ISSUES[id].short}: ${o.label}`, fx[f]);
      if (fx.healthMod) S.healthMod += fx.healthMod;
      if (fx.riverMod) S.riverMod += fx.riverMod;
      if (fx.cohesion) S.cohesion += fx.cohesion;
      if (fx.housingQ) S.housingQ = clamp(S.housingQ + fx.housingQ, 0, 0.9);
      if (fx.millCap != null) S.millCap = fx.millCap;
      if (fx.millCapAdd) S.millCap += fx.millCapAdd;
      if (fx.planAdj) S.planAdj += fx.planAdj;
      if (fx.reliefAdd) S.reliefBase += fx.reliefAdd;
      if (fx.reliefCut) S.reliefBase *= fx.reliefCut;
      if (fx.deaths) { S.deaths += fx.deaths; notes.push(fx.note); }
      if (fx.flags) Object.assign(S.flags, fx.flags);
      S.flags['ch_' + id] = o.k;
    }
    for (const c of CK) if (B.ups && B.ups[c] && S.infra[c] < 5) S.infra[c]++;
    S.treasury = bud.end; S.debt = S0.debt + bud.newBonds + bud.borrow;
    S.fireLoss = 0;
    return { S, parts, notes, bud };
  }

  function eventOdds(S, yi) {
    const d = derive(S);
    return YEARS[yi].events.map(([id, p, hist]) => {
      let prob = p;
      if (prob == null) prob = id === 'fire' ? d.fireRisk : id === 'riot' ? d.riotRisk : id === 'sickness' ? clamp((100 - d.health) / 220, 0.05, 0.4) : 0.1;
      return { id, p: prob, hist };
    });
  }
  function suggestEvents(S1, yi, rnd = Math.random, mode = 'mix') {
    return eventOdds(S1, yi).filter(e => (mode !== 'random' && e.hist) || (mode !== 'history' && !e.hist && rnd() < e.p)).map(e => e.id);
  }

  function resolve(S0, yi, choices, B, events) {
    const yr = YEARS[yi]; const d0 = derive(S0);
    const { S, parts, notes, bud } = decide(S0, yi, choices, B);
    const add = (f, label, v) => { if (Math.abs(v) >= 0.5) parts[f].push([label, v]); };
    const d1 = derive(S);
    const ev = []; let econNext = 1, jobsF = 1, planCut = 0, reliefNext = 1, evCost = 0;
    for (const id of events) {
      const E = EVENTS[id]; const r = { id, name: E.name, note: E.note, lines: [] };
      if (id === 'fire') {
        const dmg = Math.round(d1.V * 0.02 * (1 - 0.15 * S.infra.fire) * (S.flags.zoning === 'none' ? 1.5 : 1));
        const cost = dmg * 0.06; evCost += cost; S.fireLoss = dmg; S.fires++; r.cost = cost;
        r.lines.push(`${fmt(dmg)} of property burned${S.infra.fire ? ` (your fire engines, level ${S.infra.fire}, limited the damage)` : ' (the town had no fire engines)'}.`);
        add('old', 'Mill fire', -6); add('company', 'Mill fire', -5); add('workers', 'Mill fire', -3); add('irish', 'Mill fire', -2);
      } else if (id === 'riot') {
        const m = S.infra.police >= 2 ? 0.5 : 1; evCost += 80; r.cost = 80; S.riots++;
        S.cohesion -= 8 * m; add('old', 'Street riot', -6 * m); add('irish', 'Street riot', -8 * m); add('workers', 'Street riot', -2);
        r.lines.push(S.infra.police >= 2 ? 'Your police broke it up quickly.' : 'With only a few watchmen, the fighting went on all night.');
      } else if (id === 'freshet') {

      } else if (id === 'sickness') {

<script>
// ===== Town map =====
function drawTown(S) {
  const r = rng(S.name + '-map'); const d = MT.derive(S);
  const W = 640, H = 380; let g = '';
  const rc = Math.round(100 - d.river);
  const water = `color-mix(in srgb, var(--mud) ${Math.min(85, rc)}%, var(--water))`;
  g += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--land)"/>`;
  // the moor: open common, or enclosed fields
  if (S.flags.enclosure === 'none' || !S.flags.enclosure) g += `<path d="M380 10 Q 500 0 630 20 L 630 120 Q 520 100 380 110 Z" fill="var(--field)" opacity=".7"/><text x="470" y="64" font-size="11" fill="var(--muted)" font-family="Libre Franklin, sans-serif">The common</text>`;
  else { const n = Math.max(4, 15 - Math.round(S.mills * 0.25)); for (let i = 0; i < n; i++) { const x = 392 + (i % 5) * 46, y = 14 + Math.floor(i / 5) * 32; g += `<rect x="${x}" y="${y}" width="40" height="26" rx="1" fill="var(--field)" stroke="var(--roof)" stroke-width=".5" stroke-dasharray="2 2"/>`; } }
  if (S.flags.enclosure === 'allot') g += `<rect x="40" y="330" width="80" height="26" fill="var(--field)" stroke="var(--roof)" stroke-width=".5"/><text x="46" y="347" font-size="10" fill="var(--muted)" font-family="Libre Franklin, sans-serif">Allotments</text>`;
  if (S.flags.waterworks) g += `<ellipse cx="596" cy="150" rx="30" ry="13" fill="var(--water)"/><path d="M566 150 C 470 158, 300 126, 150 122" fill="none" stroke="var(--water)" stroke-width="2" stroke-dasharray="5 4"/>`;
  // river and canal
  g += `<path d="M-10 268 C 120 250, 230 290, 330 262 S 520 230, 650 246" fill="none" stroke="${water}" stroke-width="30" stroke-linecap="round"/>`;
  g += `<text x="280" y="300" font-size="11" fill="var(--muted)" font-family="Libre Franklin, sans-serif">River</text>`;
  if (S.mills > 4) g += `<path d="M0 214 C 160 206, 420 214, 640 200" fill="none" stroke="${water}" stroke-width="5"/>`;
  if (S.infra.roads >= 2) g += `<rect x="180" y="248" width="12" height="40" fill="var(--roof)" transform="rotate(-8 186 268)"/>`;
  // mills, with chimneys once steam arrives
  const steam = S.millCap > 30 || S.flags.zoning || S.flags.smokeRules;
  for (let i = 0; i < S.mills; i++) {
    const col = i % 14, row = Math.floor(i / 14);
    let x = 250 + col * 27, y = 190 - row * 22;
    if (S.flags.zoning === 'none' && i >= 8) { x = 40 + r() * 560; y = 90 + r() * 120; }
    g += `<rect x="${x}" y="${y}" width="22" height="14" fill="var(--mill)"/><rect x="${x}" y="${y}" width="22" height="3" fill="var(--roof)"/>`;
    if (steam && i % 2 === 0) {
      g += `<rect x="${x + 17}" y="${y - 14}" width="3" height="14" fill="var(--mill)"/>`;
      if (!S.flags.smokeRules) g += `<circle cx="${x + 20}" cy="${y - 18}" r="4" fill="var(--smoke)" opacity=".45"/><circle cx="${x + 26}" cy="${y - 23}" r="5" fill="var(--smoke)" opacity=".3"/>`;
    }
  }
  if (S.mills) g += `<text x="470" y="236" font-size="11" fill="var(--muted)" font-family="Libre Franklin, sans-serif">Mill district</text>`;
  // workers' terraces
  const rows = Math.min(48, Math.round(S.pop.ops / 450));
  for (let i = 0; i < rows; i++) {
    let x = 252 + (i % 12) * 30, y = 126 - Math.floor(i / 12) * 12;
    if (S.flags.zoning === 'none') { x = 230 + r() * 360; y = 70 + r() * 100; }
    g += `<rect x="${x}" y="${y}" width="27" height="7" fill="var(--board)"/>`;
  }
  // the old town: parish church, market place, houses
  g += `<rect x="120" y="58" width="18" height="18" fill="var(--house)" stroke="var(--roof)"/><rect x="124" y="40" width="10" height="18" fill="var(--house)" stroke="var(--roof)"/>`;
  const nh = Math.min(70, Math.round(S.pop.old / 120));
  for (let i = 0; i < nh; i++) {
    let x, y;
    if (S.flags.improve === 'full') { x = 30 + (i % 14) * 15; y = 150 + Math.floor(i / 14) * 14; }
    else { const a = r() * Math.PI * 2, rad = 30 + r() * (60 + nh * 1.4); x = 128 + Math.cos(a) * rad * 1.5; y = 104 + Math.sin(a) * rad * 0.7; }
    x = Math.max(4, Math.min(W - 14, x)); y = Math.max(6, Math.min(226, y));
    g += `<rect x="${x}" y="${y}" width="9" height="7" fill="var(--house)" stroke="var(--roof)" stroke-width=".6"/><path d="M${x - 1} ${y} L${x + 4.5} ${y - 4} L${x + 10} ${y} Z" fill="var(--roof)"/>`;
  }
  for (let i = 0; i < S.infra.schools; i++) g += `<rect x="${200 + i * 20}" y="66" width="12" height="10" fill="var(--brick)"/>`;
  if (S.flags.gas === 'public') g += `<circle cx="70" cy="240" r="12" fill="none" stroke="var(--roof)" stroke-width="3"/><text x="50" y="230" font-size="10" fill="var(--muted)" font-family="Libre Franklin, sans-serif">Gasworks</text>`;
  if (S.flags.workhouse) g += `<rect x="560" y="300" width="56" height="30" fill="var(--roof)"/><text x="552" y="345" font-size="10" fill="var(--muted)" font-family="Libre Franklin, sans-serif">Workhouse</text>`;
  // Little Ireland: cellars by the river
  const na = Math.min(110, Math.round(S.pop.irish / 160));

    g += neat ? `<rect x="${x}" y="${y}" width="10" height="7" fill="var(--shack)"/>` : `<rect x="${x}" y="${y}" width="${5 + r() * 3}" height="${4 + r() * 2}" fill="var(--shack)" transform="rotate(${(r() - 0.5) * 20} ${x} ${y})"/>`;
  }
  if (S.pop.irish > 1500) g += `<rect x="330" y="318" width="14" height="16" fill="var(--house)" stroke="var(--roof)"/><path d="M337 302 v14 M333 307 h8" stroke="var(--roof)" stroke-width="1.6"/>`;
  if (S.pop.irish > 600) g += `<text x="92" y="372" font-size="11" fill="var(--muted)" font-family="Libre Franklin, sans-serif">Little Ireland</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of ${esc(S.name)}: ${S.mills} mills, about ${MT.fmtN(d.pop)} people">${g}</svg>`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function tagsFor(o) {
  const fx = o.fx; const t = [];
  const arrows = v => (Math.abs(v) < 6 ? 1 : Math.abs(v) < 13 ? 2 : 3);
  for (const f of FK) if (fx[f]) t.push(`<span class="tag ${fx[f] > 0 ? 'up' : 'dn'}">${FACTION[f].short} ${(fx[f] > 0 ? '▲' : '▼').repeat(arrows(fx[f]))}</span>`);
  if (fx.cash) t.push(`<span class="tag ${fx.cash > 0 ? 'up' : 'dn'}">${money(fx.cash, true)}</span>`);
  if (fx.debt) t.push(`<span class="tag dn">Loan ${money(fx.debt)}</span>`);
  if (fx.healthMod) t.push(`<span class="tag ${fx.healthMod > 0 ? 'up' : 'dn'}">Health ${fx.healthMod > 0 ? '▲' : '▼'}</span>`);
  if (fx.cohesion) t.push(`<span class="tag ${fx.cohesion > 0 ? 'up' : 'dn'}">Getting along ${fx.cohesion > 0 ? '▲' : '▼'}</span>`);
  if (fx.housingQ) t.push(`<span class="tag ${fx.housingQ > 0 ? 'up' : 'dn'}">Housing ${fx.housingQ > 0 ? '▲' : '▼'}</span>`);
  if (fx.planAdj || fx.millCapAdd) t.push(`<span class="tag">${(fx.planAdj || 0) < 0 ? 'Fewer' : 'More'} mills</span>`);
  if (fx.reliefAdd) t.push(`<span class="tag dn">Poor relief costs ▲</span>`);
  if (fx.reliefCut) t.push(`<span class="tag up">Poor relief costs ▼</span>`);
  if (fx.deaths) t.push(`<span class="tag dn">Bloodshed</span>`);
  return t.join('');
}

}

    if (!Rv.trackPop) { Rv.trackPop = [res.report.d0.pop]; Rv.trackHealth = [res.report.d0.health]; }

// ---------- results ----------
function whyBox(r, prev, voters, nameOf) {
  const R = v => Math.round(v);
  const pts = v => `${R(Math.abs(v))} point${R(Math.abs(v)) === 1 ? '' : 's'}`;
  const fks = Object.keys(r.approvals).filter(f => voters[f] > 0);
  const base = prev != null ? prev : fks.reduce((s, f) => s + voters[f] * r.approvals[f].before, 0);
  const diff = r.support - base;
  const moves = fks.map(f => { const a = r.approvals[f]; const d = a.after - a.before; return { f, a, d, w: voters[f], impact: voters[f] * d }; });
  const up = moves.filter(m => m.impact >= 0.5).sort((x, y) => y.impact - x.impact)[0];
  const dn = moves.filter(m => m.impact <= -0.5).sort((x, y) => x.impact - y.impact)[0];
  const reasons = m => { const ps = m.a.parts.filter(p => Math.sign(p[1]) === Math.sign(m.d)).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1])).slice(0, 2);
    return ps.length ? `, mostly because of ${ps.map(p => `<b>${p[0]}</b> (${signed(p[1])})`).join(' and ')}` : ', as old feelings faded'; };
  const who = m => `<b>${nameOf(m.f)}</b> (${R(m.w * 100)}% of voters)`;
  const big = moves.slice().sort((x, y) => y.w - x.w)[0];
  const s = [];
  s.push(r.won ? `You won with <b>${R(r.support)}%</b> of the vote. You needed 50%, so you won by ${pts(r.support - 50)}.` : `You lost with <b>${R(r.support)}%</b> of the vote. You needed 50%, so you fell ${pts(50 - r.support)} short.`);
  if (prev != null) s.push(Math.abs(diff) < 1 ? `That is about the same as the last election (${R(prev)}%).` : `That is <b>${diff > 0 ? 'up' : 'down'} ${pts(diff)}</b> from the last election (${R(prev)}%).`);
  else s.push(Math.abs(diff) < 1 ? `That is about the same support you had when you took office (${R(base)}%).` : `When you took office, about ${R(base)}% of voters were on your side, so your support went <b>${diff > 0 ? 'up' : 'down'} ${pts(diff)}</b>.`);
  const lines = [];
  if (dn) lines.push(`${who(dn)} turned against you, dropping from ${dn.a.before} to ${dn.a.after}${reasons(dn)}.`);
  if (up) lines.push(`${who(up)} helped you, rising from ${up.a.before} to ${up.a.after}${reasons(up)}.`);
  if (!up && !dn) lines.push('No group changed its mind very much.');
  const tip = `Remember: ${nameOf(big.f)} cast the most votes (${R(big.w * 100)}%), so their opinion counts the most.`;
  return `<div class="callout ${r.won ? 'good' : 'bad'}" style="max-width:76ch"><b style="font-size:16px">${r.won ? 'Why you won' : 'Why you lost'}</b><p style="margin-top:4px">${s.join(' ')}</p><ul style="margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px">${lines.map(l => `<li>${l}</li>`).join('')}</ul><p class="small" style="margin-top:6px">${tip}</p></div>`;
}

            ${r.evCost ? `<div class="rline"><span>Disasters</span><span class="amt neg">${money(-r.evCost)}</span><span class="how">${r.events.filter(e => e.cost).map(e => `${e.name} ${money(e.cost)}`).join(', ')}</span></div>` : ''}</div>
          <div class="bigline"><span>Treasury at year’s end</span><span class="num">${money(S.treasury)}</span></div>
          <div class="sec"><h3>4 · Loans</h3>
            ${bud.bonds.map(b => `<p>New loan (${b.label}): <b class="num">${money(b.amt)}</b>.</p>`).join('')}
            ${r.emergency ? `<div class="callout bad">The treasury ran dry. The town borrowed <b class="num">${money(r.emergency)}</b> in an emergency.</div>` : ''}
            ${r.overLimit ? `<div class="callout bad">Borrowing is over the safe limit of ${money(r.dA.debtLimit)}. Ratepayers are alarmed.</div>` : ''}
            <p class="small">Total loans <b class="num ${r.overLimit ? 'neg' : ''}">${money(S.debt)}</b>, costing about ${money(S.debt * 0.05)} a year in interest.</p>
            ${r.notes.map(n => `<div class="callout bad small">${n}</div>`).join('')}</div>
          <div class="sec"><h3>5 · Growth by the next round</h3>
            <div class="rline"><span>Mills</span><span class="amt">${r.millsBefore} → <b>${S.mills}</b></span>${r.newMills === 0 && S.mills >= S.millCap ? '<span class="how">No more land for mills.</span>' : ''}</div>
            ${growth('old', 'Ratepayers’ households')}${growth('ops', 'Factory workers')}${growth('irish', 'Irish laborers')}
            <div class="rline"><span>Public health</span><span class="amt">${Math.round(r.d0.health)} → <b class="${r.dA.health >= r.d0.health ? 'pos' : 'neg'}">${Math.round(r.dA.health)}</b></span></div>
            <div class="rline"><span>River</span><span class="amt">${Math.round(r.d0.river)} → <b class="${r.dA.river >= r.d0.river ? 'pos' : 'neg'}">${Math.round(r.dA.river)}</b></span></div>
            <div class="rline"><span>Getting along</span><span class="amt">${Math.round(r.cohesion[0])} → <b class="${r.cohesion[1] >= r.cohesion[0] ? 'pos' : 'neg'}">${Math.round(r.cohesion[1])}</b></span></div>
            <div class="rline"><span>Rateable value</span><span class="amt">${fmt(r.d0.RV)} → <b>${fmt(r.dA.RV)}</b></span></div></div>
        </div>
      </div>
      <div class="stack">
        <div class="panel"><h2>What happened this year</h2>
          ${r.events.length ? r.events.map(e => `<div class="callout ${EVENTS[e.id].kind === 'local' || e.deaths ? 'bad' : ''} small"><b>${e.name}.</b> ${e.note} ${e.lines.join(' ')}</div>`).join('') : '<p class="small muted">A quiet year. No disasters struck.</p>'}
          <p class="small muted"><b>What really happened:</b> ${yr.hist}</p></div>
        <figure class="map">${drawTown(S)}<figcaption>${esc(S.name)} after ${yr.year}.</figcaption></figure>
        <div class="panel"><h2>Voices of the town</h2>${voices(S)}</div>
        <div class="panel"><div class="row"><h2>The election</h2><span class="spacer"></span><span class="pill ${r.won ? 'good' : 'bad'}">${Math.round(r.support)}% support</span></div>
          ${FK.map(f => { const a = r.approvals[f]; const parts = a.parts.slice().sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
            return `<details class="facd c-${f}"><summary class="fac"><span class="nm">${FACTION[f].name}</span><span class="bar"><i style="width:${a.after}%"></i></span><b class="num" style="text-align:right">${a.after}</b></summary>
            <span class="why">${a.before} → ${a.after}. ${Math.round(YEARS[r.yi].voters[f] * 100)}% of voters. ${parts.slice(0, 6).map(p => `${p[0]} <b class="${cls(p[1])}">${signed(p[1])}</b>`).join(' · ')}${Math.abs(a.drift) >= 0.5 ? ` · Memories fade <b>${signed(a.drift)}</b>` : ''}</span></details>`; }).join('')}
          <p class="small muted">Tap a group to see why its approval moved.</p></div>
        <div class="panel"><h2>The neighboring towns</h2>${neighbors()}</div>
      </div>
    </div>
    <div class="footer-actions"><button class="btn" id="nextBtn">${G.yi < LAST ? `On to ${YEARS[G.yi + 1].year}` : 'See how it all turned out'}</button></div>
  </div>`;
}
function townRows() {
  const all = [{ id: 'me', name: me().name, label: 'Your town', S: me(), won: G.history.filter(h => h.won).length },
    ...G.rivals.map(Rv => { const R = RIVALS.find(x => x.id === Rv.id); return { id: R.id, name: R.name, label: R.label, S: Rv.S, won: Rv.track.filter(t => t.won).length }; })];
  return all.map(t => ({ ...t, d: MT.derive(t.S) }));
}
function neighbors() {
  const rows = townRows(); const n = G.history.length;
  return `<div class="tblwrap"><table><thead><tr><th>Town</th><th class="r">People</th><th class="r">Mills</th><th class="r">Health</th><th class="r">Deaths</th><th class="r">Loans</th><th class="r">Elections won</th></tr></thead><tbody>
    ${rows.map(t => `<tr class="${t.id === 'me' ? 'me' : ''}"><td>${esc(t.name)}<br><span class="small muted">${t.label}</span></td><td class="r num">${fmtN(t.d.pop)}</td><td class="r num">${t.S.mills}</td><td class="r num ${t.d.health < 55 ? 'neg' : ''}">${Math.round(t.d.health)}</td><td class="r num">${fmtN(t.S.deaths)}</td><td class="r num ${t.S.debt > t.d.debtLimit ? 'neg' : ''}">${money(t.S.debt)}</td><td class="r num">${t.won} of ${n}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="small muted">${RIVALS.map(R => `<b>${R.name}</b>: “${R.motto}”`).join(' · ')}</p>`;
}
function nextRound() {
  if (G.yi >= LAST) G.stage = 'end';
  else { G.yi++; G.stage = 'plan'; G.choices = {}; G.budget = defaultBudget(); }
  save(); render(); window.scrollTo(0, 0);
}

// ---------- end ----------
function lineChart(series, labels, fmtY, aria) {
  const Wd = 560, Ht = 230, L = 64, R = 14, T = 12, Bm = 28;
  const all = series.flatMap(s => s.v); let lo = Math.min(0, ...all), hi = Math.max(...all, 1);
  const span = hi - lo; const step = Math.pow(10, Math.floor(Math.log10(span / 3))); const nice = [1, 2, 2.5, 5, 10].map(m => m * step).find(s => span / s <= 5) || step * 10;
  lo = Math.floor(lo / nice) * nice; hi = Math.ceil(hi / nice) * nice;
  const X = i => L + i * (Wd - L - R) / (labels.length - 1); const Y = v => T + (hi - v) / (hi - lo) * (Ht - T - Bm);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += nice) g += `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmtY(v)}</text>`;
  labels.forEach((l, i) => g += `<text x="${X(i)}" y="${Ht - 8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${l}</text>`);
  series.forEach(s => { g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" stroke-dasharray="${s.dash || ''}" points="${s.v.map((v, i) => X(i) + ',' + Y(v)).join(' ')}"/>`; s.v.forEach((v, i) => g += `<circle cx="${X(i)}" cy="${Y(v)}" r="${s.w > 2 ? 3.5 : 2.5}" fill="${s.color}"/>`); });
  return `<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${aria}">${g}</svg>`;
}
function grade(v, cuts) { return v >= cuts[0] ? 'A' : v >= cuts[1] ? 'B' : v >= cuts[2] ? 'C' : v >= cuts[3] ? 'D' : 'F'; }
function renderEnd() {
  const S = me(); const H = G.history; const d = MT.derive(S);
  const labels = ['Start', ...H.map(h => String(h.year))];
  const mine = { pop: [H[0].d0.pop, ...H.map(h => h.dA.pop)], health: [H[0].d0.health, ...H.map(h => h.dA.health)] };
  const colors = { me: 'var(--brick)', thorn: 'var(--f-workers)', gars: 'var(--f-company)', hal: 'var(--f-old)', fell: 'var(--muted)' };
  const won = H.filter(h => h.won).length;
  const fair = ((S.approval.workers + S.approval.irish) / 2 + S.cohesion) / 2;
  const debtRatio = S.debt / d.V;
  const grades = [
    ['Prosperity', grade(d.RV, [180000, 140000, 100000, 60000]), `${fmt(d.RV)} rateable value`],
    ['Public health', grade(d.health, [75, 65, 55, 45]), `Health ${Math.round(d.health)}; ${fmtN(S.deaths)} deaths from epidemics and violence`],
    ['Town finances', grade(-debtRatio, [-0.01, -0.03, -0.05, -0.07]), `${money(S.debt)} in loans, ${(debtRatio * 100).toFixed(1)}% of capital value`],
    ['Fairness', grade(fair, [70, 60, 50, 40]), `Workers ${S.approval.workers}, Irish ${S.approval.irish}, getting along ${Math.round(S.cohesion)}`],
    ['The river', grade(d.river, [70, 55, 40, 25]), `River health ${Math.round(d.river)} of 100`],
    ['Politics', grade(won, [6, 5, 4, 3]), `Won ${won} of ${H.length} elections`],
  ];
  const cholera49 = Math.round(d.pop * (100 - d.health) / 100 * 0.03);
  const f = S.flags;
  app.innerHTML = `<div class="stack fade">
    <div class="yearhead"><span class="era">1786–1842 · Final report</span><h1>${esc(S.name)}, ${d.feel.toLowerCase()}</h1></div>
    <p class="intro">In 1786 your town had about 3,000 people and no mills. It now has <b>${fmtN(d.pop)}</b> people and <b>${S.mills}</b> mills. Ratepayers’ households are ${Math.round(S.pop.old / d.pop * 100)}% of the town, factory workers and their families ${Math.round(S.pop.ops / d.pop * 100)}%, and Irish migrants ${Math.round(S.pop.irish / d.pop * 100)}%.</p>
    <div class="panel"><h2>Report card</h2>
      <div class="grades">${grades.map(([k, g, why]) => `<div class="grade"><span class="lbl">${k}</span><b class="g-${g}">${g}</b><span class="small muted">${why}</span></div>`).join('')}</div>
      <p class="small muted">There is no single score. Historians still argue over whether early industrialization raised or lowered working people’s standard of living. Which grades matter most is a question for discussion.</p></div>
    <div class="grid even">
      <div class="panel chart"><h2>Population</h2>${lineChart([...G.rivals.map(Rv => ({ v: Rv.trackPop || [3020], color: colors[Rv.id], w: 1.6, dash: '4 3' })), { v: mine.pop, color: colors.me, w: 3 }], labels, v => v >= 1000 ? Math.round(v / 1000) + 'k' : v, 'Population by year')}${legend(colors)}</div>
      <div class="panel chart"><h2>Public health</h2>${lineChart([...G.rivals.map(Rv => ({ v: Rv.trackHealth || [85], color: colors[Rv.id], w: 1.6, dash: '4 3' })), { v: mine.health, color: colors.me, w: 3 }], labels, v => Math.round(v), 'Public health by year')}${legend(colors)}</div>
    </div>
    <div class="panel"><h2>The neighboring towns</h2>${neighbors()}</div>
    <div class="panel"><h2>Your decisions</h2><div class="tblwrap"><table><thead><tr><th>Year</th><th>Decisions</th><th class="r">Rate</th><th>Events</th><th class="r">People after</th><th class="r">Health</th><th class="r">Support</th></tr></thead><tbody>
      ${H.map(h => `<tr><td class="num">${h.year}</td><td class="small">${YEARS[h.yi].issues.map(id => `${ISSUES[id].short}: <b>${MT.opt(id, h.choices[id]).label}</b>`).join('<br>')}</td><td class="r num">${sd(h.B.rate)}</td><td class="small">${h.events.map(e => e.name).join(', ') || '–'}</td><td class="r num">${fmtN(h.dA.pop)}</td><td class="r num">${Math.round(h.dA.health)}</td><td class="r num ${h.won ? 'pos' : 'neg'}">${Math.round(h.support)}%</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="panel"><h2>Epilogue: 1845–1849</h2>
      <p class="intro"><b>1845.</b> Friedrich Engels published <i>The Condition of the Working Class in England</i>, built on what he saw in Manchester’s back streets. ${d.health < 55 ? `A visitor to ${esc(S.name)}’s cellars would have found the same things.` : `${esc(S.name)}’s cleaner streets would have given him less to write about.`} Three years later he and Karl Marx published <i>The Communist Manifesto</i>.</p>
      <p class="intro"><b>1846.</b> Led by Richard Cobden and John Bright of the Manchester-based Anti-Corn Law League, Parliament repealed the Corn Laws. Cheap foreign grain lowered bread prices, a victory for the masters and for free trade.</p>
      <p class="intro"><b>1847.</b> Parliament passed the Ten Hours Act for women and young people. ${f.tenHour ? `${esc(S.name)}’s MPs had backed the cause since 1832.` : ''} The same year, refugees from the Great Famine poured into Lancashire through Liverpool, and Little Ireland grew again.</p>
      <p class="intro"><b>1848–1849.</b> The Chartists’ third great petition failed, and the movement faded. Parliament passed the first Public Health Act. Then cholera returned. ${f.waterworks ? `Thanks to the waterworks and sewers you built in 1842, ${esc(S.name)} got off lightly.` : `In ${esc(S.name)}, with health at ${Math.round(d.health)}, the game estimates about ${fmtN(cholera49)} deaths.`} England did not grant votes to most working men until 1867 and 1884, and to women until 1918 and 1928.</p>
    </div>
    <div class="panel"><h2>Think it over</h2>
      <ol class="qs">
        <li>Was enclosure a necessary step toward industrialization, or a transfer of wealth from the poor to landowners? Use your town’s numbers.</li>
        <li>Political economists argued that relief like Speenhamland trapped the poor and that the New Poor Law would make them self-reliant. Did your choices on poor relief support or undercut that argument?</li>
        <li>The Luddites, Peterloo, and the Plug Plot all involved people with no vote. When you used force, what did it gain you, and what did it cost?</li>
        <li>Chadwick blamed filth, not poverty, for early death. Compare your health and death figures with your neighbors’. Was he right?</li>
        <li>Choose two neighboring towns. Which would you rather have lived in as a child piecer? As a mill master? As a famine refugee?</li>
        <li>Engels described industrial Manchester as a social war. Andrew Ure, in <i>The Philosophy of Manufactures</i> (1835), praised the factory as a place of progress and discipline. Whose description fits your town better, and why?</li>
        <li>Why might Britain’s propertied classes have feared giving workers the vote? Did your town’s history give them reason to fear it?</li>
      </ol></div>
    <div class="footer-actions"><button class="btn" id="restartBtn2">Play again</button></div>
  </div>`;
}
function legend(colors) { return `<div class="legend"><span style="--c:${colors.me}">${esc(me().name)}</span>${G.rivals.map(Rv => `<span style="--c:${colors[Rv.id]}">${RIVALS.find(x => x.id === Rv.id).name}</span>`).join('')}</div>`; }

function render() {
  renderChrome();
  if (!G) return renderSetup();
  if (G.stage === 'intro') return renderIntro();
  if (G.stage === 'plan') return renderPlan();
  if (G.stage === 'desk') return renderDesk();
  if (G.stage === 'results') return renderResults();
  if (G.stage === 'end') return renderEnd();
}
let confirmArmed = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.issue) { G.choices[b.dataset.issue] = b.dataset.opt; b.parentElement.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); updateForecast(); return; }
  if (b.dataset.up) { G.budget.ups[b.dataset.up] = !G.budget.ups[b.dataset.up]; b.setAttribute('aria-pressed', !!G.budget.ups[b.dataset.up]); save(); updateForecast(); return; }
  if (b.dataset.relief) { G.budget.relief = b.dataset.relief; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); updateForecast(); return; }
  switch (b.id) {
    case 'startBtn': setup.desk = $('#desk').checked; startGame(); break;
    case 'introBtn': G.stage = 'plan'; save(); render(); window.scrollTo(0, 0); break;
    case 'adoptBtn': adopt(); break;
    case 'histEvBtn': { const pre = MT.decide(me(), G.yi, G.choices, G.budget).S; G.cond = { events: MT.suggestEvents(pre, G.yi, Math.random, 'history') }; save(); renderDesk(); break; }
    case 'redrawBtn': { const pre = MT.decide(me(), G.yi, G.choices, G.budget).S; G.cond = { events: MT.suggestEvents(pre, G.yi) }; save(); renderDesk(); break; }
    case 'revealBtn': reveal(); break;
    case 'nextBtn': nextRound(); break;
    case 'restartBtn2': G = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); window.scrollTo(0, 0); break;
    case 'restartBtn':
      if (Date.now() - confirmArmed < 4000) { G = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); }
      else { confirmArmed = Date.now(); b.textContent = 'Click again to restart'; setTimeout(() => { if (b.isConnected) b.textContent = 'Restart game'; }, 4000); }
      break;
  }
});
document.addEventListener('input', e => {
  if (!G) { if (e.target.id === 'nm') setup.name = e.target.value; return; }
  if (G.stage !== 'plan') return;
  if (e.target.id === 'rate') { G.budget.rate = +e.target.value; save(); updateForecast(); }
  if (e.target.id === 'borrow') { G.budget.borrow = +e.target.value; save(); updateForecast(); }
});
document.addEventListener('change', e => {
  if (G && G.stage === 'desk' && e.target.dataset.ev) { const id = e.target.dataset.ev; G.cond.events = e.target.checked ? [...new Set([...G.cond.events, id])] : G.cond.events.filter(x => x !== id); save(); updateDeskPreview(); }
});
render();
})();
</script>
