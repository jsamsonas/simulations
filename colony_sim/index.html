<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Colony Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#DCD6C8; --paper:#F3EEE3; --paper-2:#E8E1D2; --ink:#26221B; --ink-soft:#5E574A; --rule:#BFB49F;
  --river:#335F7E; --seal:#8E2F23; --on-seal:#FBF6EF; --brass:#7A5A1A; --brass-fill:#C9A04A;
  --good:#3F6B34; --bad:#A13A2A; --warn:#B07A12;
  --c-food:#6B8E3A; --c-economy:#B08A2E; --c-population:#335F7E; --c-natives:#9A5B2E; --c-britain:#8E2F23;
  --shadow:0 1px 0 rgba(38,34,27,.06), 0 18px 40px -24px rgba(38,34,27,.5);
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --text:"Alegreya Sans","Gill Sans","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#13110D; --paper:#1E1B15; --paper-2:#27231B; --ink:#EAE3D4; --ink-soft:#ADA48F; --rule:#433C30;
    --river:#8DB6D2; --seal:#DE7A66; --on-seal:#1E0E0A; --brass:#DFBD6B; --brass-fill:#BE9641;
    --good:#8FC07D; --bad:#EE8A75; --warn:#E3B14F;
    --c-food:#9BC062; --c-economy:#DDB65A; --c-population:#8DB6D2; --c-natives:#D49565; --c-britain:#DE7A66;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#13110D; --paper:#1E1B15; --paper-2:#27231B; --ink:#EAE3D4; --ink-soft:#ADA48F; --rule:#433C30;
  --river:#8DB6D2; --seal:#DE7A66; --on-seal:#1E0E0A; --brass:#DFBD6B; --brass-fill:#BE9641;
  --good:#8FC07D; --bad:#EE8A75; --warn:#E3B14F;
  --c-food:#9BC062; --c-economy:#DDB65A; --c-population:#8DB6D2; --c-natives:#D49565; --c-britain:#DE7A66;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:1.125rem;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--river);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.shell{max-width:1040px;margin:0 auto;padding:16px clamp(16px,3vw,32px) 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-family:var(--display);font-size:1.25rem;color:var(--ink-soft)}
.seals{display:flex;gap:5px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.seals li{font-family:var(--display);font-size:.82rem;color:var(--ink-soft);border:1.5px solid var(--rule);border-radius:999px;padding:1px 8px}
.seals li.done{background:var(--ink-soft);border-color:var(--ink-soft);color:var(--paper)}
.seals li.now{border-color:var(--seal);color:var(--seal);font-weight:700}
.seals li.lost{background:var(--bad);border-color:var(--bad);color:var(--paper)}

/* meters */
.status{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px 0 10px;margin-bottom:6px}
.status-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
@media (max-width:640px){.status-in{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px}}
.meter .lbl{display:flex;justify-content:space-between;gap:4px;font-size:.82rem;color:var(--ink-soft);line-height:1.2}
.meter .lbl b{color:var(--ink);font-size:1rem}
.meter .bar{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-top:4px;border:1px solid var(--rule)}
.meter .bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.meter.danger .lbl b{color:var(--bad)}
.meter.danger .bar{border-color:var(--bad)}
@media (max-width:640px){.meter .lbl{flex-direction:column}.meter .lbl .full{display:none}}
@media (min-width:641px){.meter .lbl .short{display:none}}
.c-food{--c:var(--c-food)} .c-economy{--c:var(--c-economy)} .c-population{--c:var(--c-population)} .c-natives{--c:var(--c-natives)} .c-britain{--c:var(--c-britain)}
.meter .bar i{background:var(--c)}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:clamp(18px,3.4vw,38px)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;margin:0 0 .45em}
h1{font-size:clamp(2.6rem,8vw,4.8rem);line-height:.98}
h2{font-size:clamp(1.9rem,4.4vw,2.7rem)}
h3{font-size:1.45rem}
.sub{font-family:var(--display);font-style:italic;font-size:clamp(1.15rem,2.3vw,1.4rem);color:var(--ink-soft);margin:.2em 0 1em}
.dateline{font-family:var(--display);font-style:italic;color:var(--seal);font-size:1.15rem;margin:0 0 .2em}
.prose p{margin:0 0 .85em;max-width:66ch}
.muted{color:var(--ink-soft)}
.small{font-size:.95rem}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(18px,3.5vw,40px);align-items:start}
@media (max-width:780px){.split{grid-template-columns:minmax(0,1fr)}}

/* pictures */
figure.photo{margin:0}
figure.photo .frame{background:var(--paper-2);border:1px solid var(--rule);border-radius:2px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
figure.photo img{width:100%;height:100%;object-fit:cover;display:block}
figure.photo.contain img{object-fit:contain;background:#efe8d8}
figure.photo figcaption{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-size:.98rem;margin-top:6px;line-height:1.3}
.missing{padding:24px;text-align:center;font-family:var(--display);font-style:italic;color:var(--ink-soft)}

/* forms */
.field{display:grid;gap:5px}
.field label{font-weight:700;font-size:1rem}
.field input,.field select{font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink);width:100%}
.field input:focus,.field select:focus{border-color:var(--river);outline:none}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
@media (max-width:520px){.formgrid{grid-template-columns:1fr}}
.formgrid .wide{grid-column:1/-1}
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pickbtn{appearance:none;font:inherit;padding:9px 16px;border-radius:3px;border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink);cursor:pointer}
.pickbtn[aria-pressed="true"]{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 12%,var(--paper-2));font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:1rem}
.chk input{margin-top:5px;width:18px;height:18px;flex:none}
.hint{color:var(--bad);font-weight:700;min-height:1.4em;margin:6px 0 0}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.btn{appearance:none;font:inherit;font-weight:700;font-size:1.05rem;border-radius:3px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--seal) 86%,black)}
.btn.small{font-size:.9rem;padding:6px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* intro */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.mcard{border:1px solid var(--rule);border-top:5px solid var(--c);background:var(--paper-2);padding:12px 14px;border-radius:3px}
.mcard b{font-family:var(--display);font-weight:400;font-size:1.25rem;display:block}
.mcard p{margin:4px 0 0;font-size:.98rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--seal);color:var(--on-seal);display:grid;place-items:center;font-family:var(--display)}

/* decision cards */
.question{font-family:var(--display);font-size:1.5rem;line-height:1.2;margin:1.2em 0 .6em}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--paper-2);border:1.5px solid var(--rule);border-radius:6px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.choice:hover{transform:translateY(-2px);border-color:var(--ink-soft);box-shadow:var(--shadow)}
.choice[aria-pressed="true"]{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 10%,var(--paper-2));box-shadow:0 0 0 3px color-mix(in srgb,var(--seal) 25%,transparent)}
.choice .ct{font-family:var(--display);font-size:1.3rem;line-height:1.1}
.choice .cb{font-size:1rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:6px}
.tg{font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tg.up{color:var(--good)} .tg.down{color:var(--bad)}
.projects{margin-top:26px;border-top:1px solid var(--rule);padding-top:18px}
.projects h3{margin-bottom:.2em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.proj{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--paper);border:1.5px dashed var(--rule);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.proj[aria-pressed="true"]{border-style:solid;border-color:var(--brass);background:color-mix(in srgb,var(--brass-fill) 16%,var(--paper))}
.proj:disabled{cursor:default;opacity:.55}
.proj .pt{font-weight:700}
.proj .pc{font-size:.85rem;color:var(--bad)}
.proj .pp{font-size:.85rem;color:var(--ink-soft)}
.owned{display:inline-block;font-size:.75rem;font-weight:700;background:var(--brass-fill);color:#2A1E05;border-radius:99px;padding:0 7px;align-self:flex-start}

/* event card */
.deck{display:grid;place-items:center;margin:20px 0 6px;perspective:1200px}
.flip{width:min(100%,430px);aspect-ratio:3/4;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.3,1);cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit}
.flip.open{transform:rotateY(180deg);cursor:default}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;border:1px solid var(--rule);box-shadow:var(--shadow);overflow:hidden}
.back{background:var(--seal);color:var(--on-seal);display:grid;place-items:center;text-align:center;padding:20px}
.back .inner{border:2px solid color-mix(in srgb,var(--on-seal) 60%,transparent);border-radius:6px;inset:12px;position:absolute;display:grid;place-items:center;padding:16px}
.back .q{font-family:var(--display);font-size:2rem;line-height:1.1}
.back .q small{display:block;font-size:1rem;font-style:italic;margin-top:10px;opacity:.85}
.front{transform:rotateY(180deg);background:var(--paper);display:flex;flex-direction:column}
.front .art{flex:0 0 46%;background:var(--paper-2);display:grid;place-items:center;border-bottom:1px solid var(--rule);overflow:hidden}
.front .art img{width:100%;height:100%;object-fit:cover}
.front .art svg{width:46%;height:auto}
.front .body{padding:14px 18px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.front .kind{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.front .kind.good{color:var(--good)} .front .kind.bad{color:var(--bad)}
.front h3{margin:0;font-size:1.6rem}
.front p{margin:0;font-size:1rem}
.shield{font-size:.9rem;font-weight:700;color:var(--brass)}
.desk{border:2px dashed var(--brass);border-radius:6px;padding:16px 18px;margin-top:16px;background:color-mix(in srgb,var(--brass-fill) 8%,var(--paper))}
.desk label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule);font-size:1rem}
.desk label:last-of-type{border-bottom:0}
.desk input{margin-top:5px}

/* results */
.ledger{display:grid;gap:10px;margin:16px 0}
.lrow{display:grid;grid-template-columns:8.5rem 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.lrow:last-child{border-bottom:1px solid var(--rule)}
.lrow .k{font-family:var(--display);font-style:italic;color:var(--ink-soft)}
.lrow .v b{font-weight:700}
@media (max-width:520px){.lrow{grid-template-columns:1fr;gap:2px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:.85rem;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--paper-2);border:1px solid var(--rule)}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.history{margin-top:18px;border-left:4px solid var(--river);background:color-mix(in srgb,var(--river) 7%,var(--paper));padding:12px 16px;border-radius:0 4px 4px 0}
.history h3{color:var(--river);font-size:1.25rem;margin-bottom:.25em}
.history p{margin:0 0 .5em;font-size:1rem}
.history p:last-child{margin:0}
.liberty{margin-top:14px;border-left:4px solid var(--brass);background:color-mix(in srgb,var(--brass-fill) 10%,var(--paper));padding:10px 16px;border-radius:0 4px 4px 0;font-size:1rem}
.gameover{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--paper));padding:16px 18px;border-radius:4px;margin:16px 0}
.gameover h3{color:var(--bad)}
.compare{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:640px){.compare{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmp{background:var(--paper-2);border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:3px;padding:8px 10px;font-size:.92rem}
.cmp b{display:block;font-size:1.25rem}
.cmp .d.up{color:var(--good)} .cmp .d.down{color:var(--bad)}

/* end */
.stamp{display:inline-grid;place-items:center;text-align:center;width:120px;height:120px;border-radius:50%;border:3px double;font-family:var(--display);font-size:1rem;line-height:1.1;padding:12px;transform:rotate(-8deg);animation:stamp .5s ease-out both;flex:none}
.stamp.win{color:var(--good);border-color:var(--good)}
.stamp.lose{color:var(--bad);border-color:var(--bad)}
@keyframes stamp{from{transform:scale(1.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.headrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-size:clamp(2.2rem,6vw,3.4rem);line-height:1}
.sect{margin-top:30px;padding-top:22px;border-top:1px solid var(--rule)}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:1rem;min-width:520px}
.t th{font-family:var(--display);font-weight:400;font-style:italic;text-align:left;color:var(--ink-soft);padding:6px 8px;border-bottom:1.5px solid var(--ink-soft)}
.t td{padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}
.grade{font-family:var(--display);font-size:1.6rem;width:2.4rem;text-align:center}
.g-A,.g-B{color:var(--good)} .g-C{color:var(--warn)} .g-D,.g-F{color:var(--bad)}
.why{display:grid;gap:8px;margin:10px 0}
.why li{margin-left:1.1em}
.dq li{margin:0 0 .6em}
textarea.summary{width:100%;min-height:280px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88rem;line-height:1.5;padding:12px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)}
.copyok{color:var(--good);font-weight:700}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink-soft);font-size:.9rem}
.linkbtn{appearance:none;background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">The Colony Simulation</div>
    <ol class="seals" id="seals" aria-label="Rounds"></ol>
  </header>
  <div class="status" id="status" hidden><div class="status-in" id="meters" aria-live="polite"></div></div>
  <main id="app" tabindex="-1"></main>
  <div class="foot"><span>Mr. Sam’s History Simulations · <a href="../" style="color:inherit">All simulations</a></span><button class="linkbtn" id="restart" hidden>Start over</button></div>
</div>

<script>
/* ======================================================================
   THE COLONY SIMULATION (card version)
   All game content is in ROUNDS, PROJECTS and EVENTS below. Each "fx"
   object lists how many points a meter gains (+) or loses (-).
   ====================================================================== */
/*ENGINE-START*/
const METERS = {
  food:       { name: 'Food',              short: 'Food',    about: 'Enough to eat through the winter.' },
  economy:    { name: 'Economy',           short: 'Money',   about: 'Money, trade and the investors back in England.' },
  population: { name: 'Population',        short: 'People',  about: 'How many colonists live here, and how happy they are to stay.' },
  natives:    { name: 'Native Relations',  short: 'Natives', about: 'Peace and trust with the Native nations whose land surrounds you.' },
  britain:    { name: 'British Relations', short: 'Britain', about: 'How the King and Parliament see your colony.' }
};
const MK = Object.keys(METERS);
const START = 50, CAP = 100;
const TEACHERS = ['Mr. Sam', 'Mrs. Sondej'];

// Each round after the decision and event, the colony produces according to how it makes its living (round 1).
const PRODUCTION = {
  FUR:     { fx: { food: 5,  economy: 8,  population: 3, natives: 3 },  text: 'Traders bring furs and deerskins into {colony}, and the colony grows a little food of its own.' },
  TOBACCO: { fx: { food: 4,  economy: 10, population: 5, natives: -2 }, text: 'Tobacco fields spread along the rivers of {colony}, and every ship to England is packed with it.' },
  FARMS:   { fx: { food: 10, economy: 6,  population: 6, natives: -1 }, text: 'Families clear new fields, fish the coast, and cut timber. {colony} grows slowly but steadily.' }
};

const ROUNDS = [
  { year: '1612', title: 'How Will the Colony Make a Living?',
    img: ['Adventures of Captain John Smith in Virginia 1624.jpg', 'Scenes of trade and conflict between the English and the Powhatan, from John Smith’s 1624 history of Virginia.'],
    text: [
      'It is 1612. {colony} has barely survived its first years. Disease, hunger and fighting have killed most of the people who came on the first ships. The investors in London want a profit, and they want it soon.',
      'All around you live the Powhatan, a confederation of about 30 tribes led by the paramount chief Wahunsenaca, whom the English call Powhatan. They grow corn, hunt and trade across the region. How {colony} makes its living will shape everything that comes after.'
    ],
    question: 'What will be the heart of {colony}’s economy?',
    options: [
      { key: 'FUR', name: 'Trade with the Powhatan', blurb: 'Swap copper, tools and cloth for corn and furs. You need few settlers and little land.',
        fx: { economy: 15, population: -10, natives: 20 },
        result: 'Trade keeps the peace and the furs sell well. But a trading post doesn’t grow, and few English families want to move to {colony}.',
        who: 'New Netherland and New France built their colonies on the fur trade. Early Jamestown survived on Powhatan corn.' },
      { key: 'TOBACCO', name: 'Plant tobacco', blurb: 'John Rolfe has a sweet tobacco from the Caribbean that sells for high prices in London. It needs lots of land and workers.',
        fx: { economy: 25, food: -10, population: 10, natives: -15, britain: 5 },
        result: 'Tobacco fever! Money pours in and settlers rush over. But colonists plant tobacco instead of food, and the fields push deeper into Powhatan land.',
        who: 'Virginia and Maryland. Within twenty years Virginia was shipping more than a million pounds of tobacco a year.' },
      { key: 'FARMS', name: 'Family farms and fishing', blurb: 'Bring whole families to grow food, fish the coast and cut timber. Steady, but slow money.',
        fx: { food: 20, population: 15, natives: -10 },
        result: 'Families arrive and the storehouses fill up. Each new farm, though, is land the Native peoples once used.',

function newGame(player) {
  return { v: 2, player, stage: 'intro', round: 0, m: Object.fromEntries(MK.map(k => [k, START])), flags: {}, owned: [], econ: null,
    picks: [], log: [], liberty: [], over: null, desk: !!player.desk, pending: null, srcs: Object.fromEntries(MK.map(k => [k, []])) };
}
function fxOf(o, G) { return typeof o === 'function' ? o(G) : o; }
function apply(G, fx, src) {
  for (const k of MK) if (fx[k]) { G.m[k] = Math.min(CAP, G.m[k] + fx[k]); G.srcs[k].push([src, fx[k]]); }
}
function failed(G, final) { return MK.find(k => G.m[k] <= 0 && !(final && k === 'britain')) || null; }
function eligibleEvents(G) {
  const r = G.round + 1; // 1-based round just decided
  return EVENTS.map(e => ({ e, w: (r >= e.from && r <= e.to) ? e.w(G) : 0 })).filter(x => x.w > 0);

// Decision + optional project for the current round.
function decide(G, optKey, projKey) {

  if (projKey) { const P = PROJECTS.find(p => p.key === projKey); apply(G, P.cost, 'Project: ' + P.name); G.owned.push(projKey); entry.parts.push(['project', P.name, P.cost]); }
  const fx = fxOf(o.fx, G); apply(G, fx, R.year + ' decision: ' + o.name); entry.parts.push(['decision', o.name, fx]);
  if (o.flag) G.flags[o.flag] = true;
  if (G.round === 0) G.econ = optKey;

}

function epilogue() {
  const p = G.picks, b = G.m.britain, pop = G.m.population;
  if (G.over) return `${fill(OVER[G.over.meter], G)} Many early colonies failed this way. Roanoke vanished in the 1580s, and Jamestown came within days of being abandoned in 1610.`;
  const tea = p[8], stamp = p[7];
  let s;
  if (tea === 'DESTROY' || b <= 15) s = `Parliament punishes ${esc(G.player.colony)} the way it punished Massachusetts: it closes your port and takes away your self-government. Your people do not back down. In April 1775, militia from ${esc(G.player.colony)} face British regulars, and the Revolution begins. You were one of its leaders.`;
  else if (tea === 'ALLOW' || b >= 75) s = `${esc(G.player.colony)} stays loyal to the Crown longer than almost any colony. When war comes in 1775, Loyalists here are strong, and many will flee to Canada or Britain after the war. Your patriot neighbors never fully trust you.`;
  else s = `${esc(G.player.colony)} walks a careful line. When fighting breaks out at Lexington and Concord in 1775, your people are divided. Like New York and Pennsylvania, you join the Revolution, but not everyone in your colony agrees.`;
  if (G.flags.slavery) s += ` When the Declaration of Independence proclaims that “all men are created equal,” enslaved people in ${esc(G.player.colony)} will remind the patriots that those words are not yet true for them.`;
  if (G.m.natives < 30) s += ` The Native nations you pushed aside will mostly side with Britain, hoping a British victory will stop settlers from taking more of their land.`;
  else if (G.m.natives >= 70) s += ` Your long peace with your Native neighbors is rare. Across the colonies, the Revolution would bring new wars for Native land.`;
  return s;
}
function whyList() {
  const out = [];

    const k = G.over.meter; const losses = G.srcs[k].filter(x => x[1] < 0).sort((a, b) => a[1] - b[1]).slice(0, 3);
    out.push(`<b>${METERS[k].name} hit zero.</b> The biggest losses came from:`);
    losses.forEach(([src, v]) => out.push(`${esc(src)} (${sgn(v)})`));
    const proj = { food: 'Roads and wharves', population: 'Doctors and inoculation', natives: 'a fort or a treaty', britain: 'an Agent in London' }[k];
    if (proj) out.push(`A different choice or ${proj} might have saved your colony.`);
  } else {
    const best = MK.reduce((a, k) => G.m[k] > G.m[a] ? k : a, MK[0]), worst = MK.reduce((a, k) => G.m[k] < G.m[a] ? k : a, MK[0]);
    const top = G.srcs[best].filter(x => x[1] > 0).sort((a, b) => b[1] - a[1])[0];
    const low = G.srcs[worst].filter(x => x[1] < 0).sort((a, b) => a[1] - b[1])[0];
    out.push(`<b>Your strength was ${METERS[best].name} (${G.m[best]}).</b>${top ? ' The biggest boost: ' + esc(top[0]) + ' (' + sgn(top[1]) + ').' : ''}`);
    out.push(`<b>Your weak spot was ${METERS[worst].name} (${Math.max(0, G.m[worst])}).</b>${low ? ' The biggest blow: ' + esc(low[0]) + ' (' + sgn(low[1]) + ').' : ''}`);
    const shields = [...new Set(G.log.filter(l => l.shielded).map(l => EVENTS.find(e => e.key === l.event).name))];
    if (shields.length) out.push(`Your projects softened: ${shields.map(esc).join(', ')}.`);
    else if (G.owned.length) out.push(`You built ${G.owned.length} project${G.owned.length > 1 ? 's' : ''}, but none of them ended up shielding you from a disaster.`);
  }
  return out;
}
const DQ = [
  'Which decision was the hardest for you? What made it hard, and who did your choice help or hurt?',
  'Look at your Liberty Record. Did the choices that helped your colony survive also expand freedom? Why might colonial leaders have faced that same conflict?',
  'Several colonies chose differently on the same issue (for example, Rhode Island and Massachusetts on religion). What did each colony value most?',
  'Native nations, enslaved people and women had no vote in any colony. How would this simulation be different if you played as one of them?',
  'By 1773, why were so many colonists ready to defy Britain when they had considered themselves loyal English subjects for 150 years?'
];
function report() {
  const pl = G.player; const surv = !G.over; const lines = [
    'THE COLONY SIMULATION - SUMMARY REPORT',
    `Student: ${pl.first} ${pl.last}`, `Teacher: ${pl.teacher}    Period: ${pl.period}`, `Colony: ${pl.colony}`,
    `Completed: ${new Date().toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' })}${G.desk ? ' (teacher’s desk)' : ''}`, '',
    `Result: ${surv ? 'SURVIVED to 1773' : 'Colony failed in ' + ROUNDS[G.over.round].year + ' (' + METERS[G.over.meter].name + ' reached 0)'}`,
    `Rounds completed: ${surv ? ROUNDS.length : G.over.round} of ${ROUNDS.length}`
  ];
  if (surv) lines.push(`Final colony score: ${totalScore(G)} of 500`);
  lines.push('', 'DECISIONS');
  ROUNDS.forEach((R, i) => {
    const l = G.log.find(x => x.round === i);
    if (!l) { lines.push(`${i + 1}. ${R.year} ${R.title}: (not reached)`); return; }
    const o = R.options.find(x => x.key === l.choice);
    lines.push(`${i + 1}. ${R.year} ${R.title}: ${o.name}`);
    if (l.project) lines.push(`   Project: ${PROJECTS.find(p => p.key === l.project).name}`);
    if (l.event) lines.push(`   Event: ${EVENTS.find(e => e.key === l.event).name}${l.shielded ? ' (shielded)' : ''}`);
  });
  lines.push('', 'REPORT CARD');
  MK.forEach(k => lines.push(`   ${METERS[k].name}: ${Math.max(0, G.m[k])} (${surv ? grade(G.m[k]) : '-'})`));
  lines.push('', `LIBERTY RECORD: ${sgn(libertyScore(G)) || '0'}`);
  G.liberty.forEach(x => lines.push(`   ${x.year}: ${x.text} (${sgn(x.pts)})`));
  return lines.join('\n');
}
function renderEnd() {
  const surv = !G.over; const lib = libertyScore(G);
  app.innerHTML = `<div class="card fade">
    <div class="headrow">
      <div class="stamp ${surv ? 'win' : 'lose'}">${surv ? 'Survived<br>to 1773' : 'Colony<br>failed<br>' + ROUNDS[G.over.round].year}</div>
      <div><p class="dateline">Final report · ${esc(G.player.colony)}</p>
        <h2 style="margin:0">${surv ? 'You are a true founder, ' + esc(G.player.first) + '!' : 'The end of ' + esc(G.player.colony)}</h2>
        ${surv ? `<p class="big" style="margin:.2em 0 0">${totalScore(G)} <span class="muted" style="font-size:1.1rem;font-family:var(--text)">of 500 points</span></p>` : ''}</div>
    </div>
    <div class="sect"><h3>Why you ${surv ? 'survived' : 'failed'}</h3><ul class="why" style="padding-left:1.1em">${whyList().map(w => `<li style="margin-left:0">${w}</li>`).join('')}</ul></div>
    <div class="sect"><h3>What became of ${esc(G.player.colony)}</h3><div class="prose"><p>${epilogue()}</p></div></div>
    <div class="sect"><h3>Report card</h3><div class="tablewrap"><table class="t"><thead><tr><th>Meter</th><th>Final</th><th>Grade</th></tr></thead><tbody>
      ${MK.map(k => { const g = surv ? grade(G.m[k]) : '—'; return `<tr><td>${METERS[k].name}</td><td>${Math.max(0, G.m[k])}</td><td class="grade g-${g}">${g}</td></tr>`; }).join('')}
      </tbody></table></div><p class="small muted">A = 80+, B = 65+, C = 50+, D = 35+, F = below 35.</p></div>
    <div class="sect"><h3>Your choices and history</h3><div class="tablewrap"><table class="t"><thead><tr><th>Year</th><th>Your choice</th><th>Who really chose this</th></tr></thead><tbody>
      ${ROUNDS.map((R, i) => { const l = G.log.find(x => x.round === i); const o = l && R.options.find(x => x.key === l.choice); return `<tr><td>${R.year}</td><td>${o ? '<b>' + o.name + '</b><br><span class="small muted">' + R.title + '</span>' : '<span class="muted">Not reached</span>'}</td><td class="small">${o ? esc(o.who) : ''}</td></tr>`; }).join('')}
      </tbody></table></div></div>
    <div class="sect"><h3>Liberty Record: <span style="color:${lib > 0 ? 'var(--good)' : lib < 0 ? 'var(--bad)' : 'var(--ink-soft)'}">${sgn(lib) || '0'}</span></h3>
      ${G.liberty.length ? `<ul class="small">${G.liberty.map(x => `<li><b>${x.year}:</b> ${esc(x.text)} <b style="color:${x.pts > 0 ? 'var(--good)' : 'var(--bad)'}">(${sgn(x.pts)})</b></li>`).join('')}</ul>` : '<p class="small muted">None of your choices changed anyone’s rights.</p>'}
      <p class="small muted">The Liberty Record doesn’t affect survival. It shows whether your colony expanded or limited the rights of colonists, Native peoples and enslaved people.</p></div>
    <div class="sect"><h3>Discussion questions</h3><ol class="dq">${DQ.map(q => `<li>${q}</li>`).join('')}</ol></div>
    <div class="sect"><h3>Your summary report</h3><p class="small">Copy this report and paste it into Canvas.</p>
      <textarea class="summary" id="rep" readonly>${esc(report())}</textarea>
      <div class="actions"><button class="btn primary" id="copy">Copy report</button><span id="copied" class="copyok" aria-live="polite"></span><span style="flex:1"></span><button class="btn" id="again">Play again</button></div></div>
  </div>`;
  $('#copy').onclick = async () => {
    const t = $('#rep'); let ok = false;
    try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { t.select(); try { ok = document.execCommand('copy'); } catch (e2) {} }
    $('#copied').textContent = ok ? 'Copied! Now paste it into Canvas.' : 'Select the text above and copy it.';
  };
  $('#again').onclick = restart;
}

// ---------- router ----------
function restart() {
  if (G && G.stage !== 'end' && !confirmRestart()) return;
  if (G) setup = { ...setup, teacher: G.player.teacher, first: G.player.first, last: G.player.last, period: G.player.period, colony: '', desk: G.player.desk, err: '' };
  G = null; ui = {}; try { localStorage.removeItem(KEY); } catch (e) {} render();
}
function confirmRestart() {
  const b = $('#restart');
  if (b.dataset.sure) return true;
  b.dataset.sure = '1'; b.textContent = 'Click again to erase this game'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Start over'; }, 4000);
  return false;
}
$('#restart').onclick = restart;
function render() {
  renderChrome();
  if (!G) renderSetup();
  else ({ intro: renderIntro, round: renderRound, event: renderEvent, results: renderResults, end: renderEnd })[G.stage]();
  renderChrome();
  app.focus({ preventScroll: true }); window.scrollTo(0, 0);
}
render();
</script>
</body>
