<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La seigneurie: a noble's estate before 1789</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon:ital@0;1&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#151A2E; --muted:#555C72; --rule:#D9DDE5;
  --chip:#F1F3F7; --chip-off:#FAFBFC; --navy:#14213D; --crimson:#9E1B32;
  --c-lord:#A3172F; --c-king:#1F4E89; --c-church:#6A4C93; --c-noble:#96690F;
  --aside:#F7EEF0; --focus:#E8A317;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1324; --panel:#131B31; --ink:#E8EBF3; --muted:#A2A9BF; --rule:#28314E;
    --chip:#1B2440; --chip-off:#151D35; --navy:#C9D4EE; --crimson:#E46A7E;
    --c-lord:#E8687C; --c-king:#80A9E6; --c-church:#B79DE3; --c-noble:#E3B654;
    --aside:#221A2C;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1324; --panel:#131B31; --ink:#E8EBF3; --muted:#A2A9BF; --rule:#28314E;
  --chip:#1B2440; --chip-off:#151D35; --navy:#C9D4EE; --crimson:#E46A7E;
  --c-lord:#E8687C; --c-king:#80A9E6; --c-church:#B79DE3; --c-noble:#E3B654;
  --aside:#221A2C;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 420px}
.stage{position:relative;overflow:hidden;background:#CBD9E2;min-height:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;margin:-11px 0 0 -11px;pointer-events:auto;display:flex;align-items:center;gap:6px;
  background:none;border:0;padding:0;cursor:pointer;will-change:transform}
.pin .dot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pc);border:3px solid #fff;
  box-shadow:0 1px 4px rgba(10,15,30,.45);transition:transform .15s}
.pin .lab{background:rgba(255,255,255,.93);color:#151A2E;font-size:12.5px;font-weight:600;line-height:1;
  padding:5px 8px;border-radius:3px;white-space:nowrap;box-shadow:0 1px 3px rgba(10,15,30,.25)}
.pin:hover .dot{transform:scale(1.15)}
.pin.sel .dot{transform:scale(1.3)}
.pin.sel .lab{background:var(--pc);color:#fff}
.pin:focus-visible{outline:none}
.pin:focus-visible .dot{outline:3px solid var(--focus);outline-offset:2px}
.pin[hidden]{display:none}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.tools > *{pointer-events:auto}
.btn-ghost{background:rgba(255,255,255,.94);color:#151A2E;border:0;border-radius:4px;padding:7px 12px;font-size:13px;font-weight:600;
  box-shadow:0 1px 3px rgba(10,15,30,.25);cursor:pointer}
.btn-ghost:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hint{font-size:12.5px;color:#26304A;background:rgba(255,255,255,.75);padding:6px 10px;border-radius:4px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#26304A;font-size:14px}

.panel{background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.phead{padding:22px 26px 0}
.title{font-family:'IM Fell French Canon','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-style:italic;
  font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--navy);letter-spacing:-.01em}
.title-sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:22px;margin-top:18px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;padding:8px 0 10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--crimson)}
.tab:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pbody{flex:1;overflow:auto;padding:18px 26px 28px;min-height:0}
.lede{margin:0 0 16px;max-width:60ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;border:0}
.filters legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;padding:0}
.chip{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--rule);border-radius:999px;
  padding:5px 12px 5px 8px;font-size:13px;cursor:pointer}
.chip .sw{width:12px;height:12px;border-radius:50%;background:var(--sc)}
.chip[aria-pressed="false"]{background:var(--chip-off);color:var(--muted);text-decoration:line-through}
.chip[aria-pressed="false"] .sw{background:transparent;box-shadow:inset 0 0 0 2px var(--sc)}
.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.group{margin:0 0 20px}
.group h3{font-size:13px;font-weight:700;margin:0 0 6px;color:var(--gc);display:flex;align-items:center;gap:8px}
.group h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gc)}
.sitelist{list-style:none;margin:0;padding:0}
.siteitem{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:left;background:none;border:0;
  border-top:1px solid var(--rule);padding:9px 2px;cursor:pointer}
.siteitem:hover .sn{color:var(--crimson)}
.siteitem:focus-visible{outline:3px solid var(--focus);outline-offset:-2px}
.sn{font-weight:600}
.sf{font-family:'IM Fell French Canon',Georgia,serif;font-style:italic;color:var(--muted);font-size:15px;text-align:right}
.group[hidden],.siteli[hidden]{display:none}

.back{background:none;border:0;padding:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.catline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--dc);margin:0 0 4px}
.catline::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dc)}
.dname{font-family:'IM Fell French Canon',Georgia,serif;font-weight:400;font-size:31px;line-height:1.1;margin:0;color:var(--ink)}
.dfr{font-family:'IM Fell French Canon',Georgia,serif;font-style:italic;font-size:19px;color:var(--muted);margin:4px 0 16px}
.who{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 16px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:14px}
.who dt{font-weight:600;color:var(--muted)}
.who dd{margin:0}
.dbody p{margin:0 0 12px;max-width:62ch}
.impact{background:var(--aside);border-left:4px solid var(--crimson);padding:12px 14px;margin:16px 0 12px}
.impact h4,.after h4{margin:0 0 4px;font-size:13px;font-weight:700}
.impact p,.after p{margin:0}
.after{border-left:4px solid var(--rule);padding:4px 14px;margin:14px 0 0;color:var(--ink)}
.stepper{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.stepper button{background:var(--chip);border:1px solid var(--rule);border-radius:4px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;max-width:48%}
.stepper button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:0 0 18px}
.seg button{background:var(--chip-off);border:0;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--panel)}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.bar{display:flex;height:46px;border-radius:4px;overflow:hidden;margin:0 0 6px;background:var(--chip)}
.bar span{display:block;height:100%;transition:flex-basis .5s ease;min-width:0;border-right:1px solid var(--panel)}
.bar span:last-child{border-right:0}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 16px}
.hlist{list-style:none;margin:0 0 16px;padding:0}
.hlist li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--rule)}
.hlist .sw{width:14px;height:14px;border-radius:3px;margin-top:3px}
.hlist .hl{font-weight:600}
.hlist .hn{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.hlist .hv{font-variant-numeric:tabular-nums;font-weight:700}
.hlist li.kept{border-top:2px solid var(--ink)}
.note{font-size:13px;color:var(--muted);max-width:62ch}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:52% 48%}
  .panel{border-left:0;border-top:1px solid var(--rule)}
  .phead{padding:14px 18px 0}
  .title{font-size:34px}
  .pbody{padding:14px 18px 24px}
  .pin .lab{display:none}
  .pin.sel .lab,.pin:hover .lab,.pin:focus-visible .lab{display:block}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){
  .bar span,.pin .dot{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage" aria-label="3D model of a French noble's estate">
    <div class="loading" id="loading">Building the estate…</div>
    <div class="pins" id="pins"></div>
    <div class="tools">
      <button class="btn-ghost" id="reset" type="button">Reset view</button>
      <span class="hint">Drag to turn the estate. Scroll or pinch to zoom. Right-drag to pan.</span>
    </div>
  </main>
  <aside class="panel" aria-label="Information panel">
    <div class="phead">
      <h1 class="title">La seigneurie</h1>
      <p class="title-sub">A noble's estate in northern France, the 1780s</p>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-estate" aria-selected="true" aria-controls="pbody">The estate</button>
        <button class="tab" role="tab" id="tab-harvest" aria-selected="false" aria-controls="pbody">Where a harvest went</button>
      </div>
    </div>
    <div class="pbody" id="pbody" role="tabpanel" tabindex="-1"></div>
  </aside>
</div>

<!-- three.js r128 and OrbitControls, shared with the Brooks tour so this page doesn't depend on outside sites -->
<script src="../brooks-ship/lib/three.min.js"></script>
<script src="../brooks-ship/lib/OrbitControls.js"></script>
<script>
(function(){
'use strict';

/* ---------------- Content ---------------- */
const CAT = {
  lord:   {label:'Dues paid to the lord',  short:'Paid to the lord',   pin:'#A3172F', css:'--c-lord'},
  king:   {label:'Taxes paid to the king', short:'Paid to the king',   pin:'#1F4E89', css:'--c-king'},
  church: {label:'Paid to the Church',     short:'Paid to the Church', pin:'#6A4C93', css:'--c-church'},
  noble:  {label:'Rights of the nobility', short:'A noble right',      pin:'#B8860B', css:'--c-noble'}
};
const CAT_ORDER = ['lord','king','church','noble'];
const xs = z => 25 + 5*Math.sin(z/22);   // stream centerline

const SITES = [
 {id:'mill', cat:'lord', tags:['lord'], name:"The lord's mill", fr:'le moulin banal',
  pos:[xs(-15)-6,-15], h:11, dist:48,
  who:[['Collected by','The lord, through the miller who leased the mill'],['Paid by','Every household that ate bread']],
  body:["The mill was a banalité, one of the lord's monopolies. Peasants were required to grind their grain here and nowhere else, and they paid with a share of the grain, often around one-sixteenth.",
        "Taking grain to a cheaper mill in a neighboring lordship, or grinding at home with a hand mill, was forbidden and could bring fines and confiscation."],
  impact:"With no competition, the miller had little reason to work quickly or honestly. Villagers widely suspected millers of keeping more than their legal share."},
 {id:'oven', cat:'lord', tags:['lord'], name:"The lord's oven", fr:'le four banal',
  pos:[49,11], h:7, dist:40,
  who:[['Collected by','The lord, through the baker who leased the oven'],['Paid by','Households in the village']],
  body:["In many lordships the large village oven was another banalité. Families shaped their dough at home and carried it here to bake, paying a fee in bread or dough each time.",
        "Building a private oven could be forbidden, so the fee was paid week after week, year after year."],
  impact:"Bread made up most of what a poor family ate, so the oven fee was a charge on the most basic food there was."},
 {id:'press', cat:'lord', tags:['lord'], name:"The lord's wine press", fr:'le pressoir banal',
  pos:[74,44], h:8, dist:45,
  who:[['Collected by','The lord'],['Paid by','Village grape growers']],
  body:["In wine regions, growers had to press their grapes at the lord's press and pay a share of the wine.",
        "Many lords also held the banvin, the right to sell their own wine before anyone else in the village for a set period each year."],
  impact:"Growers waited their turn at the press while grapes spoiled, and then could not sell their own wine until the lord's had gone to market."},
 {id:'demesne', cat:'lord', tags:['lord'], name:"The lord's fields", fr:'la réserve et la corvée',
  pos:[-46,1], h:5, dist:60,
  who:[['Benefited','The lord'],['Paid by','Peasant families, in unpaid labor']],
  body:["The lord kept some land for himself, called the demesne or réserve. He might farm it with hired workers, rent it out, or call on his peasants to work it.",
        "The corvée was unpaid labor owed to the lord: a set number of days each year plowing, harvesting, or hauling, often with the peasant's own tools and animals. The number of days varied widely, and by the 1700s many lords had converted it to a cash payment."],
  impact:"Corvée days often fell at planting and harvest, the very weeks when a family's own crops most needed attention."},
 {id:'strips', cat:'lord', tags:['lord'], name:'Peasant fields', fr:'la censive',
  pos:[74,-64], h:4, dist:70,
  who:[['Collected by','The lord'],['Paid by','Peasants holding land in the lordship']],
  body:["Peasants held a large share of France's farmland, but their land was not truly free. It was a censive, land held from the lord and permanently burdened with dues.",
        "The cens was a small yearly rent in cash, more a sign of the lord's ownership than a heavy cost. The champart was heavier: a share of the harvest, often around one-twelfth to one-eighth, taken right from the field.",
        "When land changed hands, the lord took a fee called the lods et ventes, often around one-twelfth of the sale price. In some regions, especially in the east, peasants under mainmorte also owed fees to marry outside the lordship and could lose their property to the lord if they died without heirs living with them."],
  impact:"A family could farm the same strips for generations and still owe dues on them. Selling the land or passing it on cost money too."},
 {id:'bridge', cat:'lord', tags:['lord','king'], name:'The toll bridge and road', pin:'Toll bridge', fr:'le péage et la corvée royale',
  pos:[xs(20),20], h:6, dist:45,
  who:[['Collected by','The lord (tolls) and the king (road labor)'],['Paid by','Anyone moving goods to market']],
  body:["Many lords collected tolls on the bridges, roads, and rivers of their lordship. Carts of grain, wine, or livestock paid at each one, so goods moving any distance paid again and again, which raised prices.",
        "Peasants also owed the royal corvée: unpaid days building and repairing the king's roads. Reformers attacked it, and in 1787 it was replaced by a money tax, another bill for the same people."],
  impact:"Taking a cart of grain to a town market could mean paying tolls along the way, on roads that had been built with peasants' unpaid labor."},

 {id:'homes', cat:'king', tags:['king'], name:'Peasant homes', fr:'la taille',
  pos:[77,8], h:8, dist:50,
  who:[['Collected by',"The king's government"],['Paid by','The Third Estate, overwhelmingly peasants']],
  body:["The taille was the main direct royal tax, charged on land or income. Nobles and clergy were exempt, so its full weight fell on commoners, and on peasants most of all.",
        "Each village was assigned a total, and villagers themselves had to serve as collectors. If neighbors could not pay, the collectors could be held responsible for the shortfall.",
        "Newer taxes, the capitation (a head tax) and the vingtième (one-twentieth of income), were meant to fall on everyone. In practice, nobles and the Church negotiated reductions and paid far less than their share. Young men also faced militia service, chosen by lot."],
  impact:"Visible signs of prosperity, like a new roof or another cow, could raise a family's assessment, so families had good reason to look poorer than they were."},
 {id:'tavern', cat:'king', tags:['king'], name:'The village tavern', fr:'les aides et la gabelle',
  pos:[40,30], h:9, dist:45,
  who:[['Collected by','Tax farmers, private financiers who bought the right to collect'],['Paid by','Ordinary consumers']],
  body:["The aides were royal taxes on wine and other drinks, charged as they were made, moved, and sold. A cup of wine in the tavern carried tax from every step.",
        "The gabelle, the salt tax, was the most hated tax of all. Salt was essential for preserving food. In much of northern France, every household had to buy a minimum amount of salt each year at a high government price, whether it needed that much or not. Rates varied enormously from province to province, so smuggling was common and punishments were severe.",
        "These taxes were collected by tax farmers, private financiers who paid the crown in advance and kept whatever extra they could squeeze out."],
  impact:"Because these taxes were built into the price of basic goods, the poorest families paid the most compared with what they had."},

 {id:'church', cat:'church', tags:['church','noble'], name:'The parish church and tithe barn', pin:'Church and tithe barn', fr:'la dîme',
  pos:[60,-19], h:23, dist:65,
  who:[['Collected by','The Church, the First Estate'],['Paid by','Nearly everyone who farmed']],
  body:["The tithe was a share of the harvest owed to the Church. In name it was one-tenth, but in practice it was often less, roughly one-twelfth or one-thirteenth on average. Collectors took sheaves straight from the field before the farmer took his own share, and stored them in the tithe barn.",
        "Much of the tithe went to distant bishops, abbeys, or other holders rather than the village priest, who often lived on a small fixed allowance. The Church owned about a tenth of the land in France and paid no regular taxes, offering the king a voluntary \u201cfree gift\u201d instead.",
        "The lord had honors here too: a reserved pew at the front, the right to be buried inside the church, and a place of honor in processions and prayers."],
  impact:"Villagers watched their grain leave for the tithe barn while their own priest stayed poor. Many parish priests sympathized with the Third Estate in 1789."},

 {id:'chateau', cat:'noble', tags:['noble'], name:'The château', fr:'le château seigneurial',
  pos:[-25,-27], h:21, dist:85,
  who:[['Home of','The seigneur (lord) and his family'],['Supported by','Rents, dues, and fees from everyone in the lordship']],
  body:["The château was the seat of the seigneurie: the lord's estate and the web of rights attached to it. Many nobles drew much of their income not from farming themselves but from what peasants owed them.",
        "Noble status brought legal privileges: exemption from the taille, the main royal tax; the right to be tried in separate courts; the right to wear a sword and display a coat of arms; and near-exclusive access to the top posts in the army, the Church, and royal government. Nobles did pay some newer taxes, but usually far less than their share.",
        "Somewhere in the château sat the terrier, the lord's register listing every plot in the lordship and exactly what each household owed."],
  impact:"The terrier was the paper proof behind every due. In the 1700s many lords hired experts to comb old records for forgotten dues, then demanded them again, sometimes with years of back payments."},
 {id:'court', cat:'noble', tags:['noble'], name:"The lord's court and gallows", pin:'Court and gallows', fr:'la justice seigneuriale',
  pos:[-80,36], h:9, dist:45,
  who:[['Held by','The seigneur, through a judge he appointed'],['Judged','Peasants of the lordship']],
  body:["Many lords held the right to run their own court. It usually met in the château or a small village courtroom, where the lord's judge settled boundary disputes, minor offenses, and arguments over unpaid dues.",
        "Gallows at the edge of the estate advertised the lord's right of high justice. By the 1700s serious crimes had mostly passed to royal courts, but the gallows still announced who held power here.",
        "Nobles themselves were tried in separate, higher courts, not alongside commoners."],
  impact:"A peasant who disputed a due often had to argue the case before a judge the lord had hired and could dismiss."},
 {id:'hunt', cat:'noble', tags:['noble'], name:'The hunting forest', fr:'le droit de chasse',
  pos:[-62,-66], h:13, dist:60,
  who:[['Reserved for','The lord and his guests'],['Cost borne by','Peasants whose crops fed the game']],
  body:["Hunting was a noble privilege. Deer, wild boar, hares, and rabbits were protected for the lord's sport, and gamekeepers patrolled the woods.",
        "Peasants could not kill animals that ate their crops. In many places they were forbidden to fence their fields, or to cut hay before nesting birds had hatched, so the game could roam and breed freely. Poaching brought heavy fines or, for repeat offenders, the galleys.",
        "Lords also restricted peasants' traditional use of the woods for firewood and for grazing pigs."],
  impact:"A family could watch deer strip a field of wheat overnight and have no legal way to stop it."},
 {id:'dovecote', cat:'noble', tags:['noble'], name:'The dovecote', fr:'le colombier',
  pos:[-4,-28], h:14, dist:42,
  who:[['Reserved for','The lord, in most regions'],['Cost borne by','Peasants whose fields fed the birds']],
  body:["A large round dovecote was a mark of noble rank. It could hold hundreds or even thousands of pigeons, raised for the lord's table and for their droppings, a valuable fertilizer.",
        "The birds fed freely on the peasants' fields, especially on newly sown seed. Peasants were not allowed to kill them."],
  impact:"Pigeons eating the seed meant a smaller harvest months later, on top of every other due the family owed.",
  after:"Complaints about pigeons and game appear again and again in the cahiers de doléances, the lists of grievances villages drew up for the Estates-General in 1789."},
 {id:'commons', cat:'noble', tags:['noble'], name:'The village commons', fr:'les communaux',
  pos:[-4,62], h:4, dist:55,
  who:[['Used by','The whole village, for grazing'],['Claimed by','The lord, more and more']],
  body:["Common pasture let poor families keep a cow or a few sheep they could never have fed on their own small plots.",
        "Under a royal law of 1669, a lord could claim up to a third of a village's commons for himself, a right called triage. In the later 1700s some lords pressed these claims or fenced off common land, and many could graze large flocks of their own on village pasture."],
  impact:"Losing the commons could mean losing the family cow, and with it milk, manure, and a small cushion against hunger."}
];
const byId = Object.fromEntries(SITES.map(s=>[s.id,s]));

const HARVEST = {
  peasant:{
    rows:[
      ['seed','Seed saved for next year',20,'#8D93A3','Yields were low, so about a fifth of the grain had to be kept for planting.'],
      ['tithe','Tithe to the Church',8,'#6A4C93','Taken in sheaves at the field.'],
      ['champart','Champart to the lord',8,'#A3172F','A share of the crop, where the lord held this right.'],
      ['mill','Mill fees to the lord',3,'#C4475B','Paid in grain each time the family ground flour.'],

function renderDetail(s){
  const i = SITES.indexOf(s);

function renderHarvest(){
  const d = HARVEST[view.harvest];
  let h = `<p class="lede">Follow 100 sacks of grain from a small farm, and see how much a peasant family kept compared with a noble harvesting his own fields.</p>
  <div class="seg" role="group" aria-label="Whose harvest">

  </div>
  <div class="bar" role="img" aria-label="${d.rows.map(r=>r[1]+': '+r[2]+' sacks').join('; ')}">`;
  // keep a stable set of segment keys so widths animate between views
  const keys = ['seed','tithe','champart','mill','cens','taille','salt','kept'];
  const colorFor = {}; HARVEST.peasant.rows.forEach(r=>colorFor[r[0]]=r[3]);
  for(const k of keys){
    const r = d.rows.find(x=>x[0]===k);
    h += `<span data-k="${k}" style="flex:0 0 ${r?r[2]:0}%;background:${r?r[3]:colorFor[k]}"></span>`;
  }
  h += `</div><div class="scale"><span>0</span><span>50</span><span>100 sacks</span></div><ul class="hlist">`;
  for(const r of d.rows){

function setTab(t){
  view.tab = t;
  tabEstate.setAttribute('aria-selected', t==='estate');
  tabHarvest.setAttribute('aria-selected', t==='harvest');
  if(t==='harvest'){ pbody.innerHTML = renderHarvest(); }
  else if(view.site){ renderDetail(byId[view.site]); }
  else renderEstateList();
}

function switchHarvest(which){
  if(which===view.harvest) return;
  view.harvest = which;
  // animate bar in place, then replace list
  const d = HARVEST[which];
  pbody.querySelectorAll('.bar span').forEach(sp=>{
    const r = d.rows.find(x=>x[0]===sp.dataset.k);
    sp.style.flexBasis = (r?r[2]:0)+'%';
    if(r) sp.style.background = r[3];
  });
  pbody.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.h===which));
  const tmp = document.createElement('div'); tmp.innerHTML = renderHarvest();
  pbody.querySelector('.hlist').replaceWith(tmp.querySelector('.hlist'));
  pbody.querySelector('.note').replaceWith(tmp.querySelector('.note'));
  pbody.querySelector('.bar').setAttribute('aria-label', tmp.querySelector('.bar').getAttribute('aria-label'));
}

/* ---------------- Pins ---------------- */
const pinsEl = document.getElementById('pins');
const pinEls = {};
for(const s of SITES){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'pin'; b.style.setProperty('--pc', CAT[s.cat].pin);
  b.setAttribute('aria-label', `${s.name}: ${CAT[s.cat].short}`);
  b.innerHTML = `<span class="dot"></span><span class="lab">${s.pin||s.name}</span>`;
  b.addEventListener('click', ()=>selectSite(s.id, false));
  pinsEl.appendChild(b); pinEls[s.id] = b;
}
function updatePinVisibility(){ for(const s of SITES) pinEls[s.id].dataset.filtered = siteVisible(s) ? '' : '1'; }

const ring = new THREE.Mesh(new THREE.RingGeometry(3.2,4,48), new THREE.MeshBasicMaterial({color:0xC2213D, transparent:true, opacity:0.9, depthWrite:false}));
ring.rotation.x = -Math.PI/2; ring.visible = false; scene.add(ring);

/* ---------------- Camera moves ---------------- */
let anim = null;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function flyTo(pos, target){
  if(reduceMotion){ camera.position.copy(pos); controls.target.copy(target); return; }
  anim = {t0:performance.now(), dur:1100, p0:camera.position.clone(), p1:pos, q0:controls.target.clone(), q1:target};
}
function flyToSite(s){
  const target = new THREE.Vector3(s.pos[0], 2, s.pos[1]);
  const dir = camera.position.clone().sub(controls.target); dir.y = 0;
  if(dir.lengthSq() < 1) dir.set(0,0,1);
  dir.normalize();
  const pos = target.clone().add(dir.multiplyScalar(s.dist*0.85)); pos.y = s.dist*0.66 + 4;
  flyTo(pos, target);
}

function selectSite(id, fromPanel){
  const s = byId[id]; if(!s) return;
  if(view.site) pinEls[view.site].classList.remove('sel');
  view.site = id; pinEls[id].classList.add('sel');
  ring.position.set(s.pos[0], 0.2, s.pos[1]); ring.visible = true;
  flyToSite(s);
  if(view.tab !== 'estate'){ view.tab='estate'; tabEstate.setAttribute('aria-selected',true); tabHarvest.setAttribute('aria-selected',false); }
  renderDetail(s);
  if(fromPanel){ const d = document.getElementById('dname'); if(d) d.focus({preventScroll:true}); }
}
function deselect(){
  if(view.site) pinEls[view.site].classList.remove('sel');
  view.site = null; ring.visible = false;
  renderEstateList();
}
document.getElementById('reset').addEventListener('click', ()=>{ flyTo(homePos(), HOME.target.clone()); });

// click on buildings
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY}; anim = null; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!down || Math.hypot(e.clientX-down.x, e.clientY-down.y) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  for(const hit of ray.intersectObjects(scene.children, true)){
    let o = hit.object; while(o && !o.userData.site) o = o.parent;
    if(o){ const s = byId[o.userData.site]; if(siteVisible(s)) { selectSite(s.id,false); } return; }
    if(hit.object === ground) return;
  }
});

/* ---------------- Loop ---------------- */
let resized = false;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  if(!resized){ resized = true; camera.position.copy(homePos()); }
}
new ResizeObserver(resize).observe(stage); resize();

const v = new THREE.Vector3();
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if(anim){
    const t = Math.min(1,(now-anim.t0)/anim.dur), k = ease(t);
    camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.q0, anim.q1, k);
    if(t>=1) anim = null;
  }
  controls.update();
  if(!reduceMotion){
    wheel.rotation.x -= dt*0.9;
    for(const p of pigeons){ p.a += dt*p.s; p.m.position.set(-4+Math.cos(p.a)*p.r, p.h+Math.sin(p.a*3)*0.6, -28+Math.sin(p.a)*p.r); p.m.rotation.y = -p.a - (p.s>0?0:Math.PI); }
    if(ring.visible){ const s = 1 + 0.12*Math.sin(now/260); ring.scale.set(s,s,s); }
  } else if(pigeons[0].m.position.y===0){
    for(const p of pigeons) p.m.position.set(-4+Math.cos(p.a)*p.r, p.h, -28+Math.sin(p.a)*p.r);
  }
  renderer.render(scene, camera);
  const W = stage.clientWidth, H = stage.clientHeight;
  for(const s of SITES){
    const el = pinEls[s.id];
    v.set(s.pos[0], s.h, s.pos[1]).project(camera);
    const off = el.dataset.filtered==='1' || v.z>1 || v.x<-1.1 || v.x>1.1 || v.y<-1.1 || v.y>1.1;
    if(off){ if(!el.hidden) el.hidden = true; continue; }
    if(el.hidden) el.hidden = false;
    el.style.transform = `translate(${(v.x*.5+.5)*W}px,${(-v.y*.5+.5)*H}px)`;
    el.style.zIndex = el.classList.contains('sel') ? 2000 : String(1000-Math.round(v.z*900));
  }
  requestAnimationFrame(frame);
}
updatePinVisibility();
renderEstateList();
requestAnimationFrame(frame);
})();
