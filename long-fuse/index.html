<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A classroom simulation of the Great Powers from 1890 to the July Crisis of 1914.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Long Fuse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field-gray header band over a two-column "cabinet dispatch box" workspace; one column on phones. */
:root {
  --bg: #ECECE8; --surface: #FAFAF7; --sunk: #E0E0DA; --ink: #1D1F21; --muted: #5C6064; --line: #C9CAC4;
  --accent: #3E4A3F; --accent-ink: #FFFFFF; --red: #A3312B; --gold: #96690F;
  --good: #2E7547; --bad: #B03A2A; --warn: #96690F;
  --f-military: #4A5A3C; --f-nationalists: #A3312B; --f-business: #2F4A6E; --f-socialists: #B0507A;
  --p-GBR: #B23A3A; --p-FRA: #3156A8; --p-GER: #3B3B3B; --p-AUT: #C9A227; --p-RUS: #2E7D5B;
  --map: #E3E2DA; --sea: #C9D5DC;
  --f-display: "Playfair Display", "Iowan Old Style", Georgia, serif;
  --f-body: "Libre Franklin", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131514; --surface: #1B1E1C; --sunk: #252826; --ink: #E5E7E4; --muted: #9EA39F; --line: #333834;
  --accent: #C9D3C4; --accent-ink: #161A16; --red: #E77A70; --gold: #DDAE4E;
  --good: #79BE8D; --bad: #EC7B67; --warn: #DDAE4E;
  --f-military: #A9BE93; --f-nationalists: #E77A70; --f-business: #9FB6DA; --f-socialists: #E39BBC;
  --p-GBR: #E57B7B; --p-FRA: #8FAAE8; --p-GER: #C9C9C9; --p-AUT: #E6C65A; --p-RUS: #7CC6A3;
  --map: #252824; --sea: #22303A;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131514; --surface: #1B1E1C; --sunk: #252826; --ink: #E5E7E4; --muted: #9EA39F; --line: #333834;
  --accent: #C9D3C4; --accent-ink: #161A16; --red: #E77A70; --gold: #DDAE4E;
  --good: #79BE8D; --bad: #EC7B67; --warn: #DDAE4E;
  --f-military: #A9BE93; --f-nationalists: #E77A70; --f-business: #9FB6DA; --f-socialists: #E39BBC;
  --p-GBR: #E57B7B; --p-FRA: #8FAAE8; --p-GER: #C9C9C9; --p-AUT: #E6C65A; --p-RUS: #7CC6A3;
  --map: #252824; --sea: #22303A;
  color-scheme: dark; }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--accent);color:var(--accent-ink);border-bottom:4px solid var(--red)}
header.band .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:31px;line-height:1.05;font-weight:700}
.brand small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px}
.timeline{display:flex;gap:4px;flex-wrap:wrap}
.timeline span{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);opacity:.6}
.timeline span.done{opacity:.85}
.timeline span.now{opacity:1;background:var(--accent-ink);color:var(--accent);font-weight:500}
.statusbar{border-bottom:1px solid var(--line);background:var(--surface)}
.statusbar .wrap{display:flex;flex-wrap:wrap;gap:6px 26px;padding-block:10px;align-items:baseline}
.stat{display:flex;gap:8px;align-items:baseline}
.stat b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:16px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.meter{display:inline-block;width:64px;height:7px;border-radius:4px;background:var(--sunk);vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.meter i.mid{background:var(--warn)} .meter i.low{background:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
main{padding-block:22px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,5vw,48px);line-height:1.05}
h2{font-size:19px;font-weight:700}
h3{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
.grid.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:880px){.grid,.grid.even{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r);padding:11px 20px;font-weight:700;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:focus-visible,input:focus-visible,.opt:focus-visible,.seg button:focus-visible,.choice:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.yearhead{display:flex;flex-direction:column;gap:4px}
.era{font-family:var(--f-mono);font-size:13px;color:var(--red);letter-spacing:.03em}
.intro{max-width:66ch}
.callout{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,transparent);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:14px}
.callout.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.callout.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.issue .who{font-size:12.5px;color:var(--muted);font-style:italic}
.role{font-size:13.5px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.opt b{font-size:14.5px}
.opt .d{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--red);padding:9px 11px;background:color-mix(in srgb,var(--red) 6%,var(--surface))}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);white-space:nowrap}
.tag.up{color:var(--good)} .tag.dn{color:var(--bad)}
.hint{font-size:12.5px;border-top:1px dashed var(--line);padding-top:5px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:fit-content;max-width:100%}
.seg button{border:none;background:var(--surface);color:var(--ink);padding:7px 13px;font-size:13.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.me td{background:color-mix(in srgb,var(--gold) 14%,transparent);font-weight:600}
.fac{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:4px 10px;align-items:center}
.fac .nm{font-weight:700;display:flex;align-items:center;gap:7px}
.fac .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.fac .bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fac .bar i{display:block;height:100%;background:var(--c)}
.why{display:block;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.facd summary{list-style:none;cursor:pointer}
.facd summary::-webkit-details-marker{display:none}
.facd[open] summary .nm{text-decoration:underline}
.c-military{--c:var(--f-military)} .c-nationalists{--c:var(--f-nationalists)} .c-business{--c:var(--f-business)} .c-socialists{--c:var(--f-socialists)}
.quote{border-left:3px solid var(--c);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.quote q{font-family:var(--f-display);font-size:18px;line-height:1.3;quotes:"“" "”"}
.quote span{font-size:12.5px;color:var(--muted)}
.facgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.facgrid{grid-template-columns:minmax(0,1fr)}}
.faccard{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.faccard p{font-size:13.5px}
.votebar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.votebar i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv div{display:flex;flex-direction:column;gap:1px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.choice{border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:var(--r);padding:10px 12px;background:var(--surface);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.choice[aria-pressed="true"]{border:2px solid var(--accent);border-left:6px solid var(--pc);padding:9px 11px}
.choice span{font-size:12.5px;color:var(--muted)}
label.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px}
label.chk input{margin-top:3px}
.map{margin:0;display:flex;flex-direction:column;gap:6px}
.map svg{width:100%;height:auto;display:block;border-radius:4px}
.map figcaption{font-size:12.5px;color:var(--muted)}
.fuse{height:16px;border-radius:8px;background:linear-gradient(to right,var(--good),var(--warn) 50%,var(--bad));position:relative}
.fuse i{position:absolute;top:-5px;width:4px;height:26px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.fuselabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:8px}
.log .ent{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.log .ent b{color:var(--pc)}
.chart svg{width:100%;height:auto;display:block}
.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grade{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.grade b{font-family:var(--f-display);font-size:36px;line-height:1}
.g-A,.g-B{color:var(--good)} .g-C{color:var(--warn)} .g-D,.g-F{color:var(--bad)}
.footer-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand"><small>The Great Powers, 1890–1914 · You + 4 rivals</small>The Long Fuse</div>
    <div class="timeline" id="timeline"></div>
  </div>
</header>
<div class="statusbar" id="statusbar" hidden><div class="wrap" id="statusInner"></div></div>
<main><div class="wrap" id="app"></div></main>

<script>
// ===== The Long Fuse engine =====
const LF = (() => {
  const IDS = ['GBR', 'FRA', 'GER', 'AUT', 'RUS'];
  const FK = ['military', 'nationalists', 'business', 'socialists'];
  const P = {
    GBR: { name: 'Britain', adj: 'British', army: 2, navy: 9, seaF: 1.0, nat: 35, w: { military: 0.10, nationalists: 0.25, business: 0.35, socialists: 0.30 },
      fn: { military: 'Admiralty & War Office', nationalists: 'Imperialist press & Unionists', business: 'City of London & trade', socialists: 'Radical Liberals & Labour' },
      blurb: 'The world’s greatest navy and empire, and the banker of the world. Your tiny army can’t fight a continental war, and you’ve avoided alliances for decades.' },
    FRA: { name: 'France', adj: 'French', army: 6, navy: 4, seaF: 0.3, nat: 55, w: { military: 0.20, nationalists: 0.30, business: 0.25, socialists: 0.25 },
      fn: { military: 'Army & General Staff', nationalists: 'Revanchists', business: 'Bankers & investors', socialists: 'Socialists' },
      blurb: 'A republic still bitter over losing Alsace-Lorraine to Germany in 1871, and alone in Europe. Your banks are rich and your population is smaller than Germany’s.' },
    GER: { name: 'Germany', adj: 'German', army: 7, navy: 2, seaF: 0.4, nat: 40, w: { military: 0.35, nationalists: 0.25, business: 0.20, socialists: 0.20 },
      fn: { military: 'Kaiser & General Staff', nationalists: 'Pan-German nationalists', business: 'Industrialists & bankers', socialists: 'Social Democrats' },
      blurb: 'Europe’s strongest army and fastest-growing economy, in the middle of the continent between France and Russia. Young Kaiser Wilhelm II has just dismissed Bismarck.' },
    AUT: { name: 'Austria-Hungary', adj: 'Austro-Hungarian', army: 4, navy: 1, seaF: 0.2, nat: 45, w: { military: 0.35, nationalists: 0.25, business: 0.20, socialists: 0.20 },
      fn: { military: 'Emperor’s court & generals', nationalists: 'Hawks & Magyar elites', business: 'Bankers & industry', socialists: 'Socialists & subject nationalities' },
      blurb: 'An old empire of a dozen nationalities ruled from Vienna and Budapest. Serb, Czech, and other nationalists threaten to pull it apart, and Russia backs the Balkan Slavs.' },
    RUS: { name: 'Russia', adj: 'Russian', army: 7, navy: 3, seaF: 0.2, nat: 40, w: { military: 0.40, nationalists: 0.30, business: 0.20, socialists: 0.10 },
      fn: { military: 'Tsar’s court & generals', nationalists: 'Pan-Slavists', business: 'Industrialists & landowners', socialists: 'Duma liberals & workers' },
      blurb: 'A vast autocracy with the largest army in Europe, slow to mobilize and short of money. Pan-Slavists want Russia to protect the Balkan Slavs, especially Serbia.' },
  };
  const FACTION = {
    military: 'Generals and admirals, and in the monarchies the ruler’s court. They want a strong military, firm diplomacy, and war plans that guarantee victory.',
    nationalists: 'Patriotic leagues, the popular press, and parties that see foreign policy as a contest of national honor. A diplomatic defeat enrages them.',
    business: 'Bankers, traders, and industrialists. They profit from world trade and fear the taxes and chaos of war, though some build warships and guns.',
    socialists: 'Socialist and labor parties and liberal reformers. They oppose arms spending and talk of a general strike against war.',
  };
  const pk = (a, b) => [a, b].sort().join('-');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const clone = o => JSON.parse(JSON.stringify(o));

  const CRISES = {
    colonies: { title: 'The scramble for empire', who: 'A memorandum from the Colonial Office', type: 'colonial',
      text: 'Europe’s powers are racing to claim Africa and Asia. Colonies bring prestige, markets, and naval bases, but every new claim brushes against a rival’s.',
      rivals: { GBR: ['FRA', 'RUS'], FRA: ['GBR'], GER: ['GBR', 'FRA'], AUT: ['RUS'], RUS: ['GBR'] } },
    fashoda: { title: 'Showdown at Fashoda', who: 'Telegrams from the upper Nile, September 1898', type: 'crisis', A: 'FRA', D: 'GBR',
      text: 'A small French expedition has raised the tricolor at Fashoda on the upper Nile, cutting across Britain’s plans for a Cape-to-Cairo empire. A British army fresh from victory in Sudan has arrived. Newspapers in both countries call for war.' },
    morocco: { title: 'The Moroccan Crisis', who: 'Reports from Tangier, March 1905', type: 'crisis', A: 'GER', D: 'FRA',
      text: 'France is moving to take control of Morocco. Kaiser Wilhelm II has landed at Tangier and declared support for the Sultan’s independence, hoping to test, and break, the new friendship between Britain and France.' },
    bosnia: { title: 'The Bosnian Annexation', who: 'Dispatches from Vienna and Belgrade, October 1908', type: 'crisis', A: 'AUT', D: 'RUS',
      text: 'Austria-Hungary has annexed Bosnia-Herzegovina, which it had occupied since 1878. Serbia, which wanted the province’s Serbs, is furious, and calls on Russia to protect fellow Slavs. Russia’s army is still weak after its defeat by Japan.' },
    balkans: { title: 'The Balkan Wars', who: 'News from the front, 1912–1913', type: 'crisis', A: 'AUT', D: 'RUS',
      text: 'Serbia, Bulgaria, Greece, and Montenegro have driven the Ottoman Turks almost out of Europe. Victorious Serbia demands a port on the Adriatic. Austria-Hungary refuses to let Serbia grow stronger and moves troops to the border. Russia backs Serbia.' },
  };

  // Second issue each round: options per power
  const ISSUES = [
    { title: 'Partners after Bismarck', who: 'A cabinet discussion, 1890', text: 'Bismarck kept France isolated and Russia friendly with a web of treaties. Now he is gone, and the web is coming loose. Every power is rethinking its friendships.',
      opts: {
        GER: [{ k: 'renew', label: 'Renew the Reinsurance Treaty', desc: 'Keep the secret pact with Russia that Bismarck built.', fx: { military: -3, seek: { Q: 'RUS', want: ['germany'], commit: 0.6, host: -10, name: 'Reinsurance Treaty renewed' } } },
              { k: 'lapse', label: 'Let it lapse', desc: 'Your new advisers say it contradicts the alliance with Austria-Hungary.', fx: { military: 3, commitSet: { RUS: 0 }, host: { RUS: 5 } }, hist: true },
              { k: 'britain', label: 'Court Britain instead', desc: 'Trade colonial claims for British friendship.', fx: { host: { GBR: -6 }, seek: { Q: 'GBR', want: ['germany'], commit: 0.3, host: -6, name: 'Anglo-German colonial understanding' } } }],
        FRA: [{ k: 'russia', label: 'Seek an alliance with Russia', desc: 'Offer French loans to the Tsar in return for a military alliance.', fx: { nationalists: 3, business: 2, seek: { Q: 'RUS', want: ['france'], commit: 1, host: -15, name: 'Franco-Russian Alliance' } }, hist: true },
              { k: 'alone', label: 'Stand alone', desc: 'Keep a free hand.', fx: { nationalists: -2 } },
              { k: 'germany', label: 'Seek reconciliation with Germany', desc: 'Accept the loss of Alsace-Lorraine and mend relations.', fx: { host: { GER: -15 }, nationalists: -20, socialists: 6, nat: -8 } }],
        RUS: [{ k: 'france', label: 'Take French loans and an alliance', desc: 'French money will build your railways and army.', fx: { business: 4, seek: { Q: 'FRA', want: ['russia'], commit: 1, host: -15, name: 'Franco-Russian Alliance' } }, hist: true },
              { k: 'germany', label: 'Stay close to Germany', desc: 'Ask Berlin to renew the Reinsurance Treaty.', fx: { seek: { Q: 'GER', want: ['renew'], commit: 0.6, host: -10, name: 'Reinsurance Treaty renewed' } } },
              { k: 'free', label: 'Keep a free hand', desc: 'Commit to no one.', fx: {} }],
        GBR: [{ k: 'isolation', label: 'Splendid isolation', desc: 'The Royal Navy is all the friend Britain needs.', fx: { nationalists: 2 }, hist: true },
              { k: 'germany', label: 'Make a colonial deal with Germany', desc: 'Trade the island of Heligoland for Zanzibar, as Britain did in 1890.', fx: { host: { GER: -8 }, seek: { Q: 'GER', want: ['britain'], commit: 0.2, host: -4, name: 'Anglo-German colonial understanding' } } },
              { k: 'france', label: 'Settle colonial quarrels with France', desc: 'Swap claims in Africa and Asia.', fx: { host: { FRA: -8 }, nationalists: -3 } }],

function whyBox(r, prev, voters, nameOf, word) {

  s.push(r.won ? `Your government survived with <b>${R(r.support)}%</b> support. You needed 50%, so you had ${pts(r.support - 50)} to spare.` : `Your government fell with only <b>${R(r.support)}%</b> support. You needed 50%, so you fell ${pts(50 - r.support)} short.`);
  if (prev != null) s.push(Math.abs(diff) < 1 ? `That is about the same as last round (${R(prev)}%).` : `That is <b>${diff > 0 ? 'up' : 'down'} ${pts(diff)}</b> from last round (${R(prev)}%).`);
  else s.push(Math.abs(diff) < 1 ? `That is about the same support you had when you took office (${R(base)}%).` : `When you took office your support was about ${R(base)}%, so it went <b>${diff > 0 ? 'up' : 'down'} ${pts(diff)}</b>.`);
  const lines = [];
  if (dn) lines.push(`${who(dn)} turned against you, dropping from ${dn.a.before} to ${dn.a.after}${reasons(dn)}.`);
  if (up) lines.push(`${who(up)} backed you more, rising from ${up.a.before} to ${up.a.after}${reasons(up)}.`);
  if (!up && !dn) lines.push('No group changed its mind very much.');
  return `<div class="callout ${r.won ? 'good' : 'bad'}" style="max-width:76ch"><b style="font-size:16px">${r.won ? 'Why your government survived' : 'Why your government fell'}</b><p style="margin-top:4px">${s.join(' ')}</p><ul style="margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px">${lines.map(l => `<li>${l}</li>`).join('')}</ul><p class="small" style="margin-top:6px">Remember: ${nameOf(big.f)} have the most influence in ${P[G.me].name} (${R(big.w * 100)}%).</p></div>`;
}
const QUOTES = {
  military: { lo: 'The diplomats are throwing away what the army would win. We cannot plan for war with a government like this.', mid: 'We are ready, more or less. But the others are arming faster.', hi: 'At last, a government that understands strength is the only language Europe respects.', who: 'a senior general' },
  nationalists: { lo: 'Another humiliation! The nation’s honor is being sold at the conference table.', mid: 'The nation stands firm, but our rivals grow bolder every year.', hi: 'The whole world now respects our flag.', who: 'a nationalist newspaper editor' },
  business: { lo: 'Every war scare wipes millions off the stock exchange. Who will pay for all these warships?', mid: 'Trade is good, but the newspapers talk too much of war.', hi: 'Peace and commerce: the foundation of national greatness.', who: 'a banker' },
  socialists: { lo: 'Workers of every nation have nothing to gain from the generals’ games. The arms race is robbing our children.', mid: 'We watch the arms budgets closely. The working class will not march for the kings.', hi: 'This government, at least, prefers conferences to cannons.', who: 'a socialist deputy' },
};
function voices(id) { const a = G.W.P[id].approval; return FK.map(f => { const Q = QUOTES[f]; const q = a[f] < 40 ? Q.lo : a[f] < 62 ? Q.mid : Q.hi; return `<div class="quote c-${f}"><q>${q}</q><span>${Q.who} · ${fn(f, id)} ${a[f]}</span></div>`; }).join(''); }
function labelOf(yi, id, plan) {
  const cr = ROUNDS[yi].crisis; const co = LF.crisisOpts(cr, id).find(o => o.k === plan.crisis); const io = ISSUES[yi].opts[id].find(o => o.k === plan.issue);
  return { crisis: co ? co.label : plan.crisis, issue: io ? io.label : plan.issue };
}
function renderResults() {
  const r = G.history[G.history.length - 1]; const rd = G.rounds[G.rounds.length - 1]; const yr = ROUNDS[r.yi]; const id = G.me;
  const prev = G.history.length > 1 ? G.history[G.history.length - 2].support : null;
  app.innerHTML = `<div class="stack fade">
    <div class="yearhead"><span class="era">Results of ${yr.year}</span><h1>${r.won ? 'Your government survives' : 'Your government falls'}</h1></div>
    ${whyBox(r, prev, P[id].w, f => fn(f, id))}
    <div class="grid">
      <div class="stack">
        <div class="panel"><h2>Dispatches</h2>
          <div class="callout ${rd.crisis.loser === id ? 'bad' : rd.crisis.winner === id || rd.crisis.settled ? 'good' : ''}"><b>${CRISES[yr.crisis].title}.</b> ${rd.crisis.text}</div>
          ${rd.news.map(n => `<p class="small">${n.text}</p>`).join('')}
          ${rd.events.map(e => `<div class="callout small"><b>${e.name}.</b> ${e.note}</div>`).join('')}
          <p class="small muted"><b>What really happened:</b> ${yr.hist}</p></div>
        <div class="panel"><h2>What each power did</h2><div class="tblwrap"><table><thead><tr><th>Power</th><th>Crisis</th><th>${ISSUES[r.yi].title}</th><th class="r">Arms</th><th class="r">Gov’t</th></tr></thead><tbody>
          ${IDS.map(q => { const pl = rd.plans[q]; const L = labelOf(r.yi, q, pl); return `<tr class="${q === id ? 'me' : ''}"><td style="color:var(--p-${q});font-weight:700">${P[q].name}</td><td class="small">${L.crisis}</td><td class="small">${L.issue}</td><td class="r num">${signed(pl.B.army) || 0}/${signed(pl.B.navy) || 0}</td><td class="r">${rd.wins[q] ? '<span class="pill good">held</span>' : '<span class="pill bad">fell</span>'}</td></tr>`; }).join('')}
        </tbody></table></div></div>
        <div class="panel"><h2>${P[id].name} this round</h2>
          <div class="kv">
            <div><span class="lbl">Security</span><b>${R(r.before.sec)} → <span class="${r.after.sec >= r.before.sec ? 'pos' : 'neg'}">${R(r.after.sec)}</span></b></div>
            <div><span class="lbl">Prestige</span><b>${R(r.before.prestige)} → <span class="${r.after.prestige >= r.before.prestige ? 'pos' : 'neg'}">${R(r.after.prestige)}</span></b></div>
            <div><span class="lbl">Nationalism</span><b>${R(r.before.nat)} → ${R(r.after.nat)}</b></div>
            <div><span class="lbl">Europe’s tension</span><b>${R(rd.T0)} → <span class="${rd.T <= rd.T0 ? 'pos' : 'neg'}">${R(rd.T)}</span></b></div>
          </div></div>
      </div>
      <div class="stack">
        <figure class="map">${drawMap(G.W, id)}<figcaption>${mapLegend}</figcaption></figure>
        <div class="panel"><h2>Voices in ${P[id].name}</h2>${voices(id)}</div>
        <div class="panel"><div class="row"><h2>Support for your government</h2><span class="spacer"></span><span class="pill ${r.won ? 'good' : 'bad'}">${R(r.support)}%</span></div>
          ${FK.map(f => { const a = r.approvals[f]; const parts = a.parts.slice().sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
            return `<details class="facd c-${f}"><summary class="fac"><span class="nm">${fn(f, id)}</span><span class="bar"><i style="width:${a.after}%"></i></span><b class="num" style="text-align:right">${a.after}</b></summary><span class="why">${a.before} → ${a.after}. ${R(P[id].w[f] * 100)}% of influence. ${parts.slice(0, 6).map(p => `${p[0]} <b class="${cls(p[1])}">${signed(p[1])}</b>`).join(' · ')}${Math.abs(a.drift) >= 0.5 ? ` · Memories fade <b>${signed(a.drift)}</b>` : ''}</span></details>`; }).join('')}
          <p class="small muted">Tap a group to see why its support moved.</p></div>
        <div class="panel"><h3>The Great Powers now</h3>${powersTable()}</div>
      </div>
    </div>
    <div class="footer-actions"><button class="btn" id="nextBtn">On to ${ROUNDS[G.yi + 1].year}</button></div>
  </div>`;
}
function nextRound() { G.yi++; G.choice = {}; G.B = { army: 0, navy: 0 }; G.stage = ROUNDS[G.yi].july ? 'july' : 'plan'; G.J = []; G.jstep = 0; save(); render(); window.scrollTo(0, 0); }

// ---------- July 1914 ----------
function fuseBar(v) { return `<div class="fuse" role="img" aria-label="War fuse at ${R(v)} of 100"><i style="left:${v}%"></i></div><div class="fuselabels"><span>Peace</span><span>Local war</span><span>Continental war</span><span>World war</span></div>`; }
function renderJuly() {
  const id = G.me; const step = G.jstep; const S = JULY[step]; const f = LF.fuse(G.W, G.J);
  const log = G.J.map((c, s) => `<div class="stack" style="gap:6px"><h3>${JULY[s].title} · ${JULY[s].dates}</h3><div class="log">${IDS.map(q => { const o = JULY[s].opts[q].find(x => x.k === c[q]); return `<div class="ent" style="--pc:var(--p-${q})"><b>${P[q].name}</b><span>${o.label}${q === id ? ' <span class="pill">you</span>' : ''}</span></div>`; }).join('')}</div></div>`).join('');
  app.innerHTML = `<div class="grid fade">
    <div class="stack">
      <div class="yearhead"><span class="era">Round 6 of 6 · ${P[id].name} · Step ${step + 1} of 3</span><h1>1914: The July Crisis</h1></div>
      ${step === 0 ? `<p class="intro">${ROUNDS[5].intro}</p>` : ''}
      <div class="panel"><h3>The fuse</h3>${fuseBar(f)}<p class="small">Europe starts the crisis at <b>${R(LF.fuseBase(G.W))}</b> out of 100, because of tension (${R(LF.tension(G.W))}), rigid war plans, nationalism, and tight alliances built up since 1890. Every decision now moves the marker.</p></div>
      <figure class="map">${drawMap(G.W, id)}<figcaption>${mapLegend}</figcaption></figure>
      ${log ? `<div class="panel">${log}</div>` : ''}
    </div>
    <div class="stack">
      <div class="panel issue"><h2>${S.title}</h2><span class="who">${S.dates}</span><p class="small">${S.text}</p>
        <div class="opts">${LF.julyOpts(step, id, G.W).map(o => `<button class="opt" data-slot="july" data-opt="${o.k}" aria-pressed="${G.choice.july === o.k}"><b>${o.label}</b><span class="d">${o.desc}</span><span class="tags">${tagsFor(o.fx)}<span class="tag ${o.w > 0 ? 'dn' : o.w < 0 ? 'up' : ''}">Fuse ${o.w > 0 ? '▲' : o.w < 0 ? '▼' : '–'}</span></span></button>`).join('')}</div></div>
      <div class="panel"><h3>Who keeps you in office</h3>${approvalBars(id)}</div>
      <div class="footer-actions"><button class="btn" id="julyBtn" ${G.choice.july ? '' : 'disabled'}>${step < 2 ? 'Send instructions and see what happens' : 'Make the final decision'}</button></div>
    </div></div>`;
}
function julyNext() {
  const cur = LF.julyStep(G.W, G.jstep, G.J, G.me, G.choice.july);
  G.J.push(cur); G.choice = {};
  if (G.jstep < 2) { G.jstep++; save(); render(); window.scrollTo(0, 0); return; }
  const res = LF.resolveJuly(G.W, G.J, G.me);
  G.W = res.W; G.out = res.out; G.history.push(res.reports[G.me]); G.julyWins = Object.fromEntries(IDS.map(q => [q, res.reports[q].won]));
  G.stage = 'end'; save(); render(); window.scrollTo(0, 0);
}

// ---------- end ----------
function lineChart(series, labels, fmtY, aria, maxY) {
  const Wd = 560, Ht = 230, L = 46, Rr = 14, T = 12, Bm = 28; let lo = 0, hi = maxY || 100;
  const X = i => L + i * (Wd - L - Rr) / (labels.length - 1); const Y = v => T + (hi - v) / (hi - lo) * (Ht - T - Bm);
  let g = '';
  for (let v = 0; v <= hi; v += 25) g += `<line x1="${L}" x2="${Wd - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmtY(v)}</text>`;
  labels.forEach((l, i) => g += `<text x="${X(i)}" y="${Ht - 8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${l}</text>`);
  series.forEach(s => { g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" stroke-dasharray="${s.dash || ''}" points="${s.v.map((v, i) => X(i) + ',' + Y(v)).join(' ')}"/>`; s.v.forEach((v, i) => g += `<circle cx="${X(i)}" cy="${Y(v)}" r="${s.w > 2 ? 3.5 : 2.5}" fill="${s.color}"/>`); });
  return `<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${aria}">${g}</svg>`;
}
const OUTCOME = {
  world: { h: 'The lamps are going out', grade: 'F', text: 'Europe went to war, and so did Britain and its empire. As Sir Edward Grey watched the lamps being lit in London on 3 August, he is said to have remarked, “The lamps are going out all over Europe.”' },
  continental: { h: 'War on the continent', grade: 'D', text: 'The continental powers went to war, but Britain stayed out, at least for now. This is an alternate history. Some historians argue that without Britain, Germany might have won a shorter war; others think Britain would have been drawn in eventually.' },
  local: { h: 'A third Balkan war', grade: 'B', text: 'Austria-Hungary fought Serbia, but the other powers held back, as they had during the Balkan Wars of 1912–13. This is an alternate history. The alliances, war plans, and arms race all remained. Would the next crisis end the same way?' },
  peace: { h: 'Peace, for now', grade: 'A', text: 'The powers settled the crisis at the conference table. This is an alternate history, and a rare one: in this game, keeping the peace usually takes restraint from several powers at once, built up over many years.' },
};
function renderEnd() {
  const id = G.me; const out = G.out; const O = OUTCOME[out.kind]; const H = G.history; const p = G.W.P[id];
  const wins = H.filter(h => h.won).length; const avgT = G.W.Ttrack.slice(0, -1).reduce((s, x) => s + x, 0) / (G.W.Ttrack.length - 1);
  const gr = (v, c) => v >= c[0] ? 'A' : v >= c[1] ? 'B' : v >= c[2] ? 'C' : v >= c[3] ? 'D' : 'F';
  const grades = [
    ['Keeping the peace', O.grade, `July 1914 ended in ${out.kind === 'world' ? 'world war' : out.kind === 'continental' ? 'continental war' : out.kind === 'local' ? 'a local war' : 'peace'} (fuse ${R(out.fuse)})`],
    ['Security', gr(LF.security(G.W, id), [75, 62, 50, 38]), `${P[id].name}’s security ended at ${R(LF.security(G.W, id))}`],
    ['Prestige', gr(p.prestige, [70, 58, 46, 34]), `Prestige ${R(p.prestige)}${p.humiliated ? `; humiliated ${p.humiliated} time${p.humiliated > 1 ? 's' : ''}` : ''}`],
    ['Calming Europe', gr(100 - avgT, [65, 58, 50, 42]), `Average tension ${R(avgT)} from 1890 to 1912`],
    ['Staying in office', gr(wins, [6, 5, 4, 3]), `Government survived ${wins} of ${H.length} rounds`],
  ];
  const labels = ['1890', '1898', '1905', '1908', '1912', '1914', 'July'];
  const T = G.W.Ttrack;
  const log = G.J.map((c, s) => `<div class="stack" style="gap:6px"><h3>${JULY[s].title} · ${JULY[s].dates}</h3><div class="log">${IDS.map(q => { const o = JULY[s].opts[q].find(x => x.k === c[q]); return `<div class="ent" style="--pc:var(--p-${q})"><b>${P[q].name}</b><span>${o.label}${q === id ? ' <span class="pill">you</span>' : ''}</span></div>`; }).join('')}</div></div>`).join('');
  app.innerHTML = `<div class="stack fade">
    <div class="yearhead"><span class="era">August 1914 · Final report</span><h1>${O.h}</h1></div>
    <p class="intro">${O.text}</p>
    ${whyBox(H[H.length - 1], H.length > 1 ? H[H.length - 2].support : null, P[id].w, f => fn(f, id))}
    <div class="grid even">
      <div class="panel"><h2>How July unfolded</h2>${fuseBar(out.fuse)}<p class="small">The crisis began with the fuse at <b>${R(LF.fuseBase(G.W))}</b> and ended at <b>${R(out.fuse)}</b>.${out.belgium ? ' Germany’s war plan sent its armies through neutral Belgium.' : ''}</p>${log}</div>
      <div class="stack">
        <div class="panel"><h2>Report card</h2><div class="grades">${grades.map(([k, g, why]) => `<div class="grade"><span class="lbl">${k}</span><b class="g-${g}">${g}</b><span class="small muted">${why}</span></div>`).join('')}</div></div>
        <div class="panel chart"><h2>Europe’s tension, and the fuse</h2>${lineChart([{ v: T, color: 'var(--red)', w: 3 }], labels.slice(0, T.length), v => v, 'Tension by round')}<p class="small muted">The last point is the July fuse.</p></div>
      </div>
    </div>
    <div class="panel chart"><h2>Security of each power</h2>${lineChart(IDS.map(q => ({ v: G.secTrack[q], color: `var(--p-${q})`, w: q === id ? 3 : 1.6, dash: q === id ? '' : '4 3' })), labels.slice(0, G.secTrack[id].length), v => v, 'Security by round')}<div class="legend">${IDS.map(q => `<span style="--c:var(--p-${q})">${P[q].name}${q === id ? ' (you)' : ''}</span>`).join('')}</div><p class="small muted">Notice how one power’s gain in security is usually another’s loss.</p></div>
    <div class="panel"><h2>Your decisions</h2><div class="tblwrap"><table><thead><tr><th>Year</th><th>Crisis</th><th>Second decision</th><th class="r">Army / navy</th><th class="r">Support</th></tr></thead><tbody>
      ${G.rounds.map((rd, i) => { const pl = rd.plans[id]; const L = labelOf(i, id, pl); return `<tr><td class="num">${ROUNDS[i].year}</td><td class="small">${L.crisis}</td><td class="small">${L.issue}</td><td class="r num">${signed(pl.B.army) || 0} / ${signed(pl.B.navy) || 0}</td><td class="r num ${H[i].won ? 'pos' : 'neg'}">${R(H[i].support)}%</td></tr>`; }).join('')}
    </tbody></table></div></div>
    <div class="panel"><h2>What really happened</h2>
      <p class="intro">Germany declared war on Russia on 1 August and on France on 3 August, and invaded Belgium. Britain declared war on Germany on 4 August. The war lasted more than four years and killed about 9 to 10 million soldiers and millions of civilians. It destroyed four empires (the German, Austro-Hungarian, Russian, and Ottoman), helped bring the Bolsheviks to power in Russia, and ended with the Treaty of Versailles, whose Article 231 blamed Germany and its allies for the war.</p>
      <p class="intro">Historians still argue about why it happened. In the 1960s Fritz Fischer argued that Germany’s leaders deliberately pursued a war of conquest. Christopher Clark’s <i>The Sleepwalkers</i> (2012) describes leaders across Europe stumbling into a war none fully intended. Margaret MacMillan’s <i>The War That Ended Peace</i> (2013) stresses the many earlier chances to change course that were missed.</p></div>
    <div class="panel"><h2>Think it over</h2><ol class="qs">
      <li>Historians often list four long-term causes: militarism, alliances, imperialism, and nationalism. Which one did the most to raise the fuse in your game? Use your numbers.</li>
      <li>Find a moment when your power armed to feel safer. What did your rivals do next? Explain the “security dilemma.”</li>
      <li>Every crisis before 1914 was resolved without war. How did those “successes” make 1914 more dangerous?</li>
      <li>How did war plans like the Schlieffen Plan or Russia’s general-mobilization-only plan limit the choices of statesmen in July 1914?</li>
      <li>Was war in 1914 inevitable? Identify the single decision, by any power, that you think could most have changed the outcome.</li>
      <li>Who keeps a government in office shaped its choices. Compare how generals, nationalists, bankers, and socialists pushed your power, and contrast it with another power.</li>
      <li>Article 231 blamed Germany. Based on your game, how should responsibility for the war be divided?</li>
    </ol></div>
    <div class="footer-actions"><button class="btn" id="restartBtn2">Play again as another power</button></div>
  </div>`;
}

function render() {
  renderChrome();
  if (!G) return renderSetup();
  if (G.stage === 'intro') return renderIntro();
  if (G.stage === 'plan') return renderPlan();
  if (G.stage === 'desk') return renderDesk();
  if (G.stage === 'results') return renderResults();
  if (G.stage === 'july') return renderJuly();
  if (G.stage === 'end') return renderEnd();
}
let confirmArmed = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.power) { setup.me = b.dataset.power; setup.desk = $('#desk').checked; renderSetup(); return; }
  if (b.dataset.slot) { G.choice[b.dataset.slot] = b.dataset.opt; b.parentElement.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); if (b.dataset.slot === 'july') { const jb = $('#julyBtn'); if (jb) jb.disabled = false; } else updateAdopt(); return; }
  if (b.dataset.arm) { G.B[b.dataset.arm] = +b.dataset.v; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); updateAdopt(); return; }
  switch (b.id) {
    case 'startBtn': setup.desk = $('#desk').checked; startGame(); break;
    case 'introBtn': G.stage = 'plan'; save(); render(); window.scrollTo(0, 0); break;
    case 'adoptBtn': adopt(); break;
    case 'histEvBtn': G.cond = { events: ROUNDS[G.yi].events.filter(([, h]) => h).map(([e]) => e) }; save(); renderDesk(); break;
    case 'redrawBtn': G.cond = { events: drawEvents() }; save(); renderDesk(); break;
    case 'revealBtn': reveal(); break;
    case 'nextBtn': nextRound(); break;
    case 'julyBtn': julyNext(); break;
    case 'restartBtn2': G = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); window.scrollTo(0, 0); break;
    case 'restartBtn':
      if (Date.now() - confirmArmed < 4000) { G = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); }
      else { confirmArmed = Date.now(); b.textContent = 'Click again to restart'; setTimeout(() => { if (b.isConnected) b.textContent = 'Restart game'; }, 4000); }
      break;
  }
});
document.addEventListener('change', e => {
  if (G && G.stage === 'desk' && e.target.dataset.ev) { const id = e.target.dataset.ev; G.cond.events = e.target.checked ? [...new Set([...G.cond.events, id])] : G.cond.events.filter(x => x !== id); save(); updateDeskPreview(); }
});
render();
})();
</script>
</body>
</html>
