<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be Lincoln: A Wartime President</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#D8DDD0;
  --paper:#EFF2E9;
  --paper-2:#E4E8DC;
  --ink:#22251E;
  --ink-soft:#565B4F;
  --rule:#B5BBA9;
  --river:#3B6987;
  --seal:#952A2A;
  --on-seal:#FBF7F2;
  --brass:#7E5D1C;
  --brass-fill:#C9A04A;
  --map:#E6EADD;
  --halo:#E6EADD;
  --sea:#D3DFDD;
  --leaf:#5C7A48;
  --wood:#8A5A34;
  --snow:#FBFCF8;
  --shadow:0 1px 0 rgba(34,37,30,.06), 0 18px 40px -24px rgba(34,37,30,.5);
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --text:"Alegreya Sans","Gill Sans","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F140F; --paper:#192019; --paper-2:#20281F; --ink:#E3E7DA; --ink-soft:#A8AF9D;
    --rule:#3A4537; --river:#8BB5CF; --seal:#DB7261; --on-seal:#1B0D0B; --brass:#DFBD6B;
    --brass-fill:#BE9641; --map:#1D251D; --halo:#1D251D; --sea:#1A2A2D; --leaf:#8DB07A; --wood:#C08A5E; --snow:#DCE4E2;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F140F; --paper:#192019; --paper-2:#20281F; --ink:#E3E7DA; --ink-soft:#A8AF9D;
  --rule:#3A4537; --river:#8BB5CF; --seal:#DB7261; --on-seal:#1B0D0B; --brass:#DFBD6B;
  --brass-fill:#BE9641; --map:#1D251D; --halo:#1D251D; --sea:#1A2A2D; --leaf:#8DB07A; --wood:#C08A5E; --snow:#DCE4E2;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:1.125rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--river);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

.shell{max-width:1080px;margin:0 auto;padding:18px clamp(12px,3vw,32px) 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;min-height:34px}
.brand{font-family:var(--display);font-size:1.2rem;color:var(--ink-soft)}
.seals{display:flex;gap:7px;list-style:none;margin:0;padding:0}
.seal{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-family:var(--display);font-size:.9rem;color:var(--ink-soft)}
.seal.current{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 14%,transparent)}
.seal.match{background:var(--brass-fill);border-color:var(--brass-fill);color:#2A1E05}
.seal.diff{background:var(--ink-soft);border-color:var(--ink-soft);color:var(--paper)}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:clamp(16px,3.4vw,40px)}
.content{max-width:740px;margin:clamp(20px,3vw,32px) auto 0}

h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;margin:0 0 .45em}
h1{font-size:clamp(3rem,9vw,5.8rem);letter-spacing:-.01em;line-height:.95}
h2{font-size:clamp(2rem,4.6vw,3rem)}
h3{font-size:1.6rem}
.sub{font-family:var(--display);font-style:italic;font-size:clamp(1.2rem,2.4vw,1.5rem);color:var(--ink-soft);margin:.25em 0 1em}
.dateline{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-size:1.1rem;margin:0 0 .3em}
.prose p{margin:0 0 .9em;max-width:64ch}
.prose p:last-child{margin-bottom:0}

/* map */
figure.map{margin:0}
figure.map svg{display:block;width:100%;height:auto;background:var(--map);border:1px solid var(--rule);border-radius:2px}
figure.map figcaption{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-size:1.02rem;margin-top:8px}
.m-frame{fill:none;stroke:var(--ink-soft);stroke-width:1}
.m-sea{fill:var(--sea)}
.m-coast{fill:none;stroke:var(--ink-soft);stroke-width:.9}
.m-ridge{fill:none;stroke:var(--ink-soft);stroke-width:.9;opacity:.6;stroke-linecap:round;stroke-linejoin:round}
.m-river{fill:none;stroke:var(--river);stroke-linecap:round;stroke-linejoin:round}
.m-rlabel{fill:var(--river);font-family:var(--display);font-style:italic;font-size:9.5px}
.m-region{fill:var(--ink-soft);font-family:var(--display);font-style:italic;font-size:12px;opacity:.85}
.m-label{fill:var(--ink);font-family:var(--display);font-size:11px;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round}
.m-note{fill:var(--ink-soft);font-family:var(--display);font-style:italic;font-size:9.5px}
.m-dot{fill:var(--ink)}
.m-fort{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.m-road{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.m-here{fill:var(--seal)}
.m-ring{fill:none;stroke:var(--seal);stroke-width:1.8}
.m-cart{fill:var(--paper);stroke:var(--ink-soft);stroke-width:.9}
.m-title{fill:var(--ink);font-family:var(--display);font-size:12px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease-in-out .2s forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.35}}

/* title */
.field{display:grid;gap:6px;margin:20px 0 12px;max-width:420px}
.field label{font-weight:700}
.field input{font:inherit;padding:11px 12px;border:1.5px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)}
.field input:focus{border-color:var(--river)}
.hint{color:var(--seal);font-size:1rem;min-height:1.5em;margin:0}
.welcome{margin:18px 0 6px;font-family:var(--display);font-size:1.3rem}
.titlegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:end;margin-bottom:clamp(20px,3vw,30px)}
@media (max-width:800px){.titlegrid{grid-template-columns:minmax(0,1fr)}}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.btn{appearance:none;font:inherit;font-weight:700;font-size:1.05rem;border-radius:3px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--seal) 88%,black)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* intro */
.parties{display:grid;margin-top:6px}
.party{display:grid;grid-template-columns:9rem 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--rule)}
.party:last-child{border-bottom:1px solid var(--rule)}
.party strong{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.2}
.party p{margin:0}
@media (max-width:520px){.party{grid-template-columns:1fr;gap:2px}}
.commission{margin:22px 0 0;border:1px solid var(--rule);background:var(--paper-2);padding:18px 20px;border-radius:2px}
.commission h3{font-size:1.35rem;margin-bottom:.5em}
.commission dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.commission dt{color:var(--ink-soft)}
.commission dd{margin:0;font-weight:500}

/* decisions */
.question{font-family:var(--display);font-size:1.55rem;line-height:1.2;margin:1.1em 0 .6em}
.orders{display:grid;gap:10px}
.order{appearance:none;width:100%;text-align:left;font:inherit;color:inherit;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--paper-2);border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:3px;padding:13px 16px;cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
.order:hover:not(:disabled){border-left-color:var(--ink-soft)}
.order[aria-pressed="true"]{border-color:var(--seal);border-left-color:var(--seal);background:color-mix(in srgb,var(--seal) 9%,var(--paper-2))}
.order:disabled{cursor:default}
.order:disabled:not([aria-pressed="true"]){opacity:.5}
.mark{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-family:var(--display);font-size:1.05rem;color:var(--ink-soft);margin-top:-1px}
.order[aria-pressed="true"] .mark{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.panel{margin-top:30px;padding-top:24px;border-top:1px solid var(--rule)}
.verdict{display:flex;align-items:center;gap:16px;margin:0 0 18px}
.stamp{width:88px;height:88px;flex:none;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:.82rem;line-height:1.08;padding:10px;border:2px solid;transform:rotate(-9deg);animation:stamp .4s cubic-bezier(.2,.9,.3,1.25)}
.stamp.match{color:var(--brass);border-color:var(--brass);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--brass)}
.stamp.diff{color:var(--ink-soft);border-color:var(--ink-soft);border-style:dashed}
@keyframes stamp{from{transform:scale(1.7) rotate(-9deg);opacity:0}to{transform:scale(1) rotate(-9deg);opacity:1}}
.verdict p{margin:0;font-size:1.15rem}
.think{margin-top:20px;border-left:3px solid var(--river);padding:2px 0 2px 16px}
.think h4{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0 0 2px;color:var(--river)}
.think p{margin:0;font-style:italic}

/* results */
.score{font-family:var(--display);font-size:clamp(2.4rem,7vw,4rem);line-height:1;margin:.1em 0 .15em}
.tablewrap{overflow-x:auto;margin:22px 0 8px}
table.ledger{width:100%;border-collapse:collapse;min-width:560px;font-size:1.02rem}
.ledger th{font-family:var(--display);font-weight:400;font-style:italic;text-align:left;color:var(--ink-soft);padding:6px 10px;border-bottom:1.5px solid var(--ink-soft)}
.ledger td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
.ledger td.n{font-family:var(--display);font-size:1.15rem;width:2.5rem}
.tag{display:inline-block;font-size:.85rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-top:4px}
.tag.match{background:var(--brass-fill);color:#2A1E05}
.tag.diff{border:1px solid var(--ink-soft);color:var(--ink-soft)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,44px);margin-top:30px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.styles{display:grid;grid-template-columns:auto auto auto;gap:8px 18px;align-items:center;justify-content:start;margin-top:14px}
.styles .h{font-family:var(--display);font-style:italic;color:var(--ink-soft)}
.pips{display:flex;gap:4px}
.pip{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--rule)}
.pip.on{background:var(--ink);border-color:var(--ink)}
.pips.gw .pip.on{background:var(--seal);border-color:var(--seal)}
textarea.summary{width:100%;min-height:300px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem;line-height:1.5;padding:14px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink);resize:vertical}
.status{margin:0;color:var(--ink-soft)}

.m-nation{fill:color-mix(in srgb,var(--brass-fill) 26%,transparent);stroke:var(--brass);stroke-width:1;stroke-dasharray:4 3}
.m-nlabel{fill:var(--brass);font-family:var(--display);font-style:italic;font-size:12.5px}
.m-land{fill:var(--map);stroke:var(--ink-soft);stroke-width:.9}
.m-water{fill:var(--sea)}
.m-us{fill:var(--river);stroke:var(--paper);stroke-width:1}
.m-csa{fill:var(--seal);stroke:var(--paper);stroke-width:1}
.m-fire{fill:none;stroke:var(--seal);stroke-width:1.8;stroke-dasharray:4 3}
.m-ship{fill:var(--ink)}
.m-sea-route{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:2 3}
.m-rail{fill:none;stroke:var(--ink);stroke-width:1.6}
.m-ties{fill:none;stroke:var(--ink);stroke-width:5;stroke-dasharray:1 6}
.m-x{fill:none;stroke:var(--seal);stroke-width:2}
.m-border{fill:none;stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:6 4}
.fadein{opacity:0;animation:fade .9s ease .6s forwards}
@keyframes fade{to{opacity:1}}
/* pictures (drawn in SVG) */
.visuals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.visuals{grid-template-columns:minmax(0,1fr)}}
.scene{margin:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--paper-2)}
.scene.wide{margin:0 0 6px}
.scene svg{display:block;width:100%;height:auto}
svg .ink{stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .thin{stroke-width:1.3}
svg .dash{stroke-dasharray:5 5}
svg .red{stroke:var(--seal)}
svg .f-none{fill:none} svg .f-paper{fill:var(--paper)} svg .f-wood{fill:var(--wood)} svg .f-gold{fill:var(--brass-fill)}
svg .f-green{fill:var(--leaf)} svg .f-blue{fill:var(--river)} svg .f-red{fill:var(--seal)} svg .f-ink{fill:var(--ink)}
svg .f-snow{fill:var(--snow)} svg .f-sky{fill:var(--paper-2);stroke:none}
svg .f-soft{fill:color-mix(in srgb,var(--ink) 15%,var(--paper-2))}
svg .f-water{fill:color-mix(in srgb,var(--river) 26%,var(--paper-2))}
svg .f-clear{fill:color-mix(in srgb,var(--river) 48%,var(--paper-2))}
svg .f-mud{fill:color-mix(in srgb,var(--wood) 48%,var(--paper-2))}
svg .f-ground{fill:color-mix(in srgb,var(--leaf) 26%,var(--paper-2))}
svg .f-sand{fill:color-mix(in srgb,var(--brass-fill) 34%,var(--paper-2))}
svg .f-brick{fill:color-mix(in srgb,var(--seal) 50%,var(--paper-2))}
.sv-label{font-family:var(--text);font-weight:700;fill:var(--ink)}
.sv-tag{font-size:13px}
.sv-tiny{font-size:8px}
.sv-quote,.sv-hand{font-family:var(--display);font-style:italic;font-weight:400;font-size:15px}
.sv-poster-sm{font-family:var(--display);font-weight:400;font-size:14px}
.sv-poster{font-family:var(--display);font-weight:400;font-size:24px}
.sv-poster-lg{font-family:var(--display);font-weight:400;font-size:42px;fill:var(--seal)}

/* advisors */
.advisors{margin:22px 0 4px;padding:16px 18px;background:var(--paper-2);border:1px solid var(--rule);border-radius:3px}
.adv-h{font-size:1.35rem;margin:0 0 .15em}
.adv-hint{margin:0 0 12px;color:var(--ink-soft);font-size:1rem}
.adv-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.adv{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--paper);border:1px solid var(--rule);border-top:4px solid var(--river);border-radius:3px}
.adv strong{font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.15}
.adv span{font-size:.92rem;color:var(--ink-soft);line-height:1.3}
.adv:hover{border-color:var(--ink-soft);border-top-color:var(--river)}
.adv[aria-pressed="true"]{border-color:var(--river);background:color-mix(in srgb,var(--river) 10%,var(--paper))}
.quote{margin:14px 0 0;padding:12px 16px;border-left:4px solid var(--river);background:var(--paper)}
.quote p{margin:0;font-family:var(--display);font-style:italic;font-size:1.2rem;line-height:1.35}
.quote footer{margin-top:6px;font-size:.95rem;color:var(--ink-soft)}
.m-lake{fill:var(--sea);stroke:var(--ink-soft);stroke-width:.7}
.m-nlabel.csa{fill:var(--seal)}

@media (prefers-reduced-motion: reduce){
  .fadein{opacity:1}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .draw{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand" id="brand"></div>
    <ol class="seals" id="seals" aria-label="Decision progress"></ol>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* ======================================================================
   GAME SETTINGS
   ====================================================================== */
const GAME = {
  title: "Be Lincoln",
  subtitle: "A Wartime President, 1861–1865",
  reportTitle: "BE LINCOLN: A Wartime President",
  blurb: "Face seven real crises Abraham Lincoln faced during the Civil War. Hear from your advisors, make the call, then find out what really happened. There are no right answers. You don’t know how the story ends.",
  leader: "Lincoln",
  leaderPoss: "Lincoln’s",
  leaderLabel: "Lincoln",
  storageKey: "beLincolnWar.v1",
  titleMap: {pins:[{at:"dc", here:true}], caption:"The United States at war, 1861–1865"}
};

/* ======================================================================
   STORY CONTENT
   ====================================================================== */
const INTRO = {
  heading: "A nation at war",
  paras: [
    "In April 1861, Confederate guns fired on Fort Sumter, and the Civil War began. Eleven slave states have left the Union to form the Confederate States of America.",
    "Everyone expected a short war. They were wrong. By late 1861, hundreds of thousands of men are in uniform, and the Union army has already lost badly at Bull Run in Virginia."
  ],
  listHeading: "Who wants what?",
  list: [
    {name:"The Confederacy", text:"Wants independence and the protection of slavery. Its best hope is to make the war too costly for the North, or to win help from Britain or France."},
    {name:"Lincoln", text:"Wants to restore the Union. At first he says the war is not about ending slavery. As the war goes on, that changes."},
    {name:"The border states", text:"Delaware, Maryland, Kentucky, and Missouri allow slavery but stayed in the Union. Losing them could lose the war."}
  ],
  after: "As president, you’ll face more than battles. You’ll face foreign threats, angry generals, a divided cabinet, critics at home, and hard questions about justice. Each crisis forces a choice.",
  map: {pins:[{at:"dc", here:true}], regions:true, caption:"The Union and the Confederacy, divided roughly along the Ohio River and the Potomac"}
};

const START = {
  heading: "You are Abraham Lincoln",
  paras: [
    "It is November 1861. You have been president for eight months, and the war is not going well. Your generals are cautious, Congress is impatient, and newspapers attack you every day.",
    "In the next three and a half years, you’ll face seven crises. Before each decision, you can call in your advisors. Then the choice is yours."
  ],
  factsHeading: "The situation",
  facts: [
    ["President", "Abraham Lincoln, age 52"],
    ["Confederate states", "11"],
    ["Union army", "More than 500,000 soldiers, most with no experience"],
    ["Biggest fear abroad", "Britain or France helping the Confederacy"],
    ["Biggest fear at home", "Losing the border states, or losing the public’s will to fight"]
  ],
  button: "Begin decision 1"
};

const DECISIONS = [
  {
    title:"The Trent Affair", when:"November 1861", where:"Washington, D.C.",
    setup:[
      "A U.S. Navy captain, Charles Wilkes, has stopped a British mail ship, the Trent, near Cuba. He arrested two Confederate diplomats, James Mason and John Slidell, who were sailing to Europe to ask Britain and France for help.",
      "Northerners are thrilled, and Wilkes is a hero. But Britain is furious. It says the U.S. broke international law, demands the men’s release, and is sending thousands of soldiers to Canada."
    ],
    question:"What do you do with the two diplomats?",
    advisors:[

function usSVG(cfg, animate){
  const T = (ll, txt, cls, anchor = "middle", dx = 0, dy = 0) => { const [x, y] = UP(ll); return `<text x="${x + dx}" y="${y + dy}" text-anchor="${anchor}" class="${cls}">${txt}</text>`; };
  let s = `<svg viewBox="0 0 ${UW} ${UH}" role="img" aria-label="Map of the eastern United States${cfg.caption ? ": " + cfg.caption : ""}">`;
  s += `<rect class="m-sea" x="0" y="0" width="${UW}" height="${UH}"/>`;
  s += `<path class="m-land" d="M0 0 L${UW} 0 L${UW} ${UH} L0 ${UH} Z"/>`;
  s += `<path class="m-sea" d="${path(SEA, true)}"/><path class="m-coast" d="${path(COAST)}"/>`;
  s += `<path class="m-land" d="${path(CUBA, true)}"/><path class="m-land" d="${path(YUCATAN, true)}"/>`;
  s += LAKES.map(l => `<path class="m-lake" d="${path(l, true)}"/>`).join("");
  s += `<path class="m-border" d="${path(CANADA_LINE)}"/><path class="m-border" d="${path(MEXICO_LINE)}"/>`;
  s += `<path class="m-river" stroke-width="1.6" d="${path(MISSISSIPPI)}"/><path class="m-river" stroke-width="1.4" d="${path(OHIO)}"/><path class="m-river" stroke-width="1.2" d="${path(POTOMAC)}"/>`;
  s += T([-90.6,41.2], "Mississippi R.", "m-rlabel", "end", -6) + T([-86.2,37.4], "Ohio R.", "m-rlabel");
  s += T([-80,47.6], "CANADA", "m-region") + T([-96.6,23.4], "MEXICO", "m-region", "start");
  s += T([-71,33], "Atlantic Ocean", "m-region") + T([-90,25.6], "Gulf of Mexico", "m-region") + T([-78.4,21.0], "Cuba", "m-note");
  if (cfg.regions) s += T([-80.5,43.0], "THE UNION", "m-nlabel") + T([-86.5,32.6], "THE CONFEDERACY", "m-nlabel csa");
  if (cfg.border) s += T([-85.6,37.25], "Kentucky", "m-note") + T([-92.4,38.4], "Missouri", "m-note") + T([-76.8,39.55], "Maryland", "m-note", "end", -4) + T([-84,36.3], "border states", "m-nlabel");
  if (cfg.route === "trent") {
    const pts = [[-82.36,23.14],[-80.2,22.95],[-78.4,22.75],[-75.5,23.8],[-72,26.5],[-67.5,29]].map(UP);
    s += `<path class="m-sea-route${animate ? " draw" : ""}" pathLength="1" d="M${pts.map(q => q.join(" ")).join(" L")}"/>`;
    s += T([-71.5,25.3], "Trent’s route", "m-note", "start", 6, 0) + T([-71.5,25.3], "toward Britain", "m-note", "start", 6, 12);
  }
  (cfg.pins || []).forEach(p => {
    const pl = PLACES[p.at]; const [x, y] = UP(pl.at);
    if (p.here) s += `<circle class="m-ring${animate ? " pulse" : ""}" cx="${x}" cy="${y}" r="9"/><circle class="m-here" cx="${x}" cy="${y}" r="4.5"/>`;
    else s += `<circle class="m-dot" cx="${x}" cy="${y}" r="3.2"/>`;
    const k = p.here && Math.abs(pl.dx) < 12 && pl.dx !== 0 ? 12 / Math.abs(pl.dx) : 1;
    s += `<text x="${x + pl.dx * k}" y="${y + pl.dy}" text-anchor="${pl.anchor}" class="m-label">${pl.name}</text>`;
  });
  s += `<rect class="m-frame" x=".5" y=".5" width="${UW - 1}" height="${UH - 1}"/></svg>`;
  return s;
}
function mapSVG(cfg, animate){
  cfg = cfg || {};
  return `<figure class="map">${usSVG(cfg, animate)}${cfg.caption ? `<figcaption>${cfg.caption}</figcaption>` : ""}</figure>`;
}

/* ======================================================================
   STATE
   ====================================================================== */
const blank = () => ({name:"", screen:"title", d:0, phase:"choose", sel:null, adv:null, records:[]});
let state = blank();
let saved = null;
try { const raw = localStorage.getItem(GAME.storageKey); if (raw) saved = JSON.parse(raw); } catch(e) {}
function persist(){ try { localStorage.setItem(GAME.storageKey, JSON.stringify(state)); } catch(e) {} }
function clearSaved(){ try { localStorage.removeItem(GAME.storageKey); } catch(e) {} saved = null; }

const app = document.getElementById("app");
document.getElementById("brand").textContent = GAME.title;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paras = arr => arr.map(p => `<p>${p}</p>`).join("");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function go(screen, extra = {}){
  Object.assign(state, {screen}, extra);
  persist();
  render(true);
  window.scrollTo({top:0, behavior: reduceMotion ? "auto" : "smooth"});
}

/* ======================================================================
   RENDER
   ====================================================================== */
function renderSeals(){
  document.getElementById("seals").innerHTML = DECISIONS.map((d, i) => {
    const r = state.records[i];
    let cls = "seal", label = `Decision ${i+1}: ${d.title}`;
    if (r) { cls += r.matched ? " match" : " diff"; label += r.matched ? `, same as ${GAME.leader}` : `, different from ${GAME.leader}`; }
    else if (state.screen === "decision" && state.d === i) { cls += " current"; label += ", current"; }
    return `<li class="${cls}" aria-label="${label}">${i+1}</li>`;
  }).join("");
}

function render(fresh){
  renderSeals();
  const s = state.screen;
  if (s === "title") renderTitle();
  else if (s === "intro") renderIntro();
  else if (s === "start") renderStart();
  else if (s === "decision") renderDecision(fresh);
  else if (s === "epilogue") renderEpilogue(fresh);
  else if (s === "results") renderResults();
  if (fresh) { const h = app.querySelector("h1, h2"); if (h) { h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }
}

function renderTitle(){
  const canResume = saved && saved.name && saved.screen && saved.screen !== "title";
  app.innerHTML = `
  <section class="card">
    <div class="titlegrid">
      <div>
        <h1>${GAME.title}</h1>
        <p class="sub">${GAME.subtitle}</p>
      </div>
      <div class="prose"><p>${GAME.blurb}</p></div>
    </div>
    ${mapSVG(GAME.titleMap, false)}
    <div class="content" style="margin-left:0">
      ${canResume ? `
        <p class="welcome">Welcome back, ${esc(saved.name)}.</p>
        <div class="actions">
          <button class="btn primary" id="resume">Continue where you left off</button>
          <button class="btn" id="fresh">Start over</button>
        </div>` : `
        <div class="field">
          <label for="nm">Your first and last name</label>
          <input id="nm" autocomplete="name" value="${esc(state.name)}">
        </div>
        <p class="hint" id="hint"></p>
        <div class="actions" style="margin-top:6px"><button class="btn primary" id="begin">Begin</button></div>`}
    </div>
  </section>`;
  if (canResume){
    document.getElementById("resume").onclick = () => { state = Object.assign(blank(), saved); saved = null; render(true); };
    document.getElementById("fresh").onclick = () => { const n = saved.name; clearSaved(); state = blank(); state.name = n; renderTitle(); };
  } else {
    const input = document.getElementById("nm");
    const begin = () => {
      const n = input.value.trim();
      if (!n) { document.getElementById("hint").textContent = "Type your name to begin."; input.focus(); return; }
      state = blank(); state.name = n; go("intro");
    };
    document.getElementById("begin").onclick = begin;
    input.addEventListener("keydown", e => { if (e.key === "Enter") begin(); });
  }
}

function renderIntro(){
  app.innerHTML = `
  <section class="card">
    ${mapSVG(INTRO.map, false)}
    <div class="content">
      <h2>${INTRO.heading}</h2>
      <div class="prose">${paras(INTRO.paras)}</div>
      <h3 style="margin-top:1.1em">${INTRO.listHeading}</h3>
      <div class="parties">${INTRO.list.map(p => `<div class="party"><strong>${p.name}</strong><p>${p.text}</p></div>`).join("")}</div>
      <div class="prose" style="margin-top:1em"><p>${INTRO.after}</p></div>
      <div class="actions"><button class="btn primary" id="next">Continue</button></div>
    </div>
  </section>`;
  document.getElementById("next").onclick = () => go("start");
}

function renderStart(){
  app.innerHTML = `
  <section class="card">
    <figure class="scene wide">${ART.start}</figure>
    <div class="content">
      <h2>${START.heading}</h2>
      <div class="prose">${paras(START.paras)}</div>
      <div class="commission">
        <h3>${START.factsHeading}</h3>
        <dl>${START.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      </div>
      <div class="actions"><button class="btn primary" id="next">${START.button}</button></div>
    </div>
  </section>`;
  document.getElementById("next").onclick = () => go("decision", {d:0, phase:"choose", sel:null, adv:null});
}

function renderDecision(fresh){
  const i = state.d, d = DECISIONS[i], phase = state.phase, sel = state.sel;
  const locked = phase !== "choose";
  const chosen = sel != null ? d.options[sel] : null;
  const actual = d.options.find(o => o.historical);
  const letters = ["A","B","C","D"];
  const last = i === DECISIONS.length - 1;

  let html = `
  <section class="card">
    <div class="visuals"><figure class="scene">${ART.scenes[i]}</figure>${mapSVG(d.map, fresh)}</div>
    <div class="content">
      <p class="dateline">Decision ${i+1} of ${DECISIONS.length}. ${d.when}. ${d.where.replace(/\.$/, "")}.</p>
      <h2>${d.title}</h2>
      <div class="prose">${paras(d.setup)}</div>
      <div class="advisors">
        <h3 class="adv-h">Consult your advisors</h3>
        <p class="adv-hint">Click an advisor to hear their advice. You don’t have to follow it.</p>
        <div class="adv-row" role="group" aria-label="Advisors">${d.advisors.map((a, k) => `
          <button class="adv" data-a="${k}" aria-pressed="${state.adv === k}"><strong>${a.name}</strong><span>${a.role}</span></button>`).join("")}
        </div>
        <div class="advice" id="advice" aria-live="polite">${state.adv != null ? adviceHTML(d.advisors[state.adv]) : ""}</div>
      </div>
      <p class="question" id="q">${d.question}</p>
      <div class="orders" role="group" aria-labelledby="q">
        ${d.options.map((o, k) => `
          <button class="order" data-k="${k}" aria-pressed="${sel === k}" ${locked ? "disabled" : ""}>
            <span class="mark" aria-hidden="true">${letters[k]}</span><span>${o.text}</span>
          </button>`).join("")}
      </div>
      ${!locked ? `<div class="actions"><button class="btn primary" id="lock" ${sel == null ? "disabled" : ""}>Lock in this decision</button></div>` : ""}`;

  if (locked){
    html += `
      <div class="panel" id="p-outcome">
        <h3 tabindex="-1">What happens</h3>
        <div class="prose"><p>${chosen.outcome}</p></div>
        ${phase === "outcome" ? `<div class="actions"><button class="btn primary" id="reveal">See what ${GAME.leader} did</button></div>` : ""}
      </div>`;
  }
  if (phase === "history"){
    html += `
      <div class="panel" id="p-history">
        <div class="verdict">
          <div class="stamp ${chosen.historical ? "match" : "diff"}" aria-hidden="true">${chosen.historical ? `Same as ${GAME.leader}` : "A different path"}</div>
          <p>${chosen.historical ? `You made the same choice as ${GAME.leader}.` : `${cap(GAME.leader)} chose differently: <strong>${actual.short}</strong>.`}</p>
        </div>
        <h3 tabindex="-1">What really happened</h3>
        <div class="prose">${paras(d.history)}</div>
        <div class="think"><h4>Think about it</h4><p>${d.think}</p></div>
        <div class="actions"><button class="btn primary" id="next">${last ? "See what happened next" : `Go to decision ${i+2}`}</button></div>
      </div>`;
  }
  html += `</div></section>`;
  app.innerHTML = html;

  app.querySelectorAll(".adv").forEach(b => b.onclick = () => {
    state.adv = +b.dataset.a; persist();
    app.querySelectorAll(".adv").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.a === state.adv)));
    document.getElementById("advice").innerHTML = adviceHTML(d.advisors[state.adv]);
  });
  app.querySelectorAll(".order").forEach(b => b.onclick = () => {
    state.sel = +b.dataset.k; persist();
    app.querySelectorAll(".order").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.k === state.sel)));
    document.getElementById("lock").disabled = false;
  });
  const lock = document.getElementById("lock");
  if (lock) lock.onclick = () => {
    if (state.sel == null) return;
    state.phase = "outcome"; persist(); render(false); reveal("p-outcome");
  };
  const rev = document.getElementById("reveal");
  if (rev) rev.onclick = () => {
    const c = d.options[state.sel];
    state.records[i] = {title:d.title, student:c.short, leader:actual.short, matched:c.historical, style:c.style};
    state.phase = "history"; persist(); render(false); reveal("p-history");
  };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => last ? go("epilogue") : go("decision", {d:i+1, phase:"choose", sel:null, adv:null});
}

function adviceHTML(a){
  return `<blockquote class="quote"><p>“${a.advice}”</p><footer>${a.name}, ${a.role}</footer></blockquote>`;
}

function reveal(id){
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"start"});
  const h = el.querySelector("h3"); if (h) h.focus({preventScroll:true});
}

function renderEpilogue(){
  app.innerHTML = `
  <section class="card">
    ${mapSVG(EPILOGUE.map, false)}
    <div class="content">
      <h2>${EPILOGUE.heading}</h2>
      <div class="prose">${paras(EPILOGUE.paras)}</div>
      <div class="actions"><button class="btn primary" id="next">See your results</button></div>
    </div>
  </section>`;
  document.getElementById("next").onclick = () => go("results");
}

function tally(list){ const c = {bold:0, cautious:0, diplomatic:0}; list.forEach(s => c[s]++); return c; }
function profileKey(c){ const top = Math.max(c.bold, c.cautious, c.diplomatic); const lead = Object.keys(c).filter(k => c[k] === top); return lead.length === 1 ? lead[0] : "balanced"; }
function matchComment(m, t){
  if (m === t) return `You think exactly like ${GAME.leader}. (Is that a good thing?)`;
  if (m >= t - 2) return `You think a lot like ${GAME.leader}.`;
  if (m >= Math.floor(t / 3)) return `You and ${GAME.leader} saw things differently at key moments.`;
  return "You would have taken a very different path. Would history have turned out better, or worse?";
}
const pips = (n, cls = "") => `<span class="pips ${cls}">${Array.from({length:DECISIONS.length}, (_, k) => `<span class="pip${k < n ? " on" : ""}"></span>`).join("")}</span>`;

function buildReport(recs, m, t, key, c){
  const when = new Date().toLocaleString([], {dateStyle:"long", timeStyle:"short"});
  const lines = [GAME.reportTitle, `Student: ${state.name}`, `Completed: ${when}`, "", "DECISIONS"];
  recs.forEach((r, i) => {
    lines.push(`${i+1}. ${r.title} [${r.matched ? "MATCH" : "DIFFERENT"}]`);
    lines.push(`   Me: ${r.student}`);
    lines.push(`   ${GAME.leaderLabel}: ${r.leader}`);
  });
  lines.push("", `Matched ${GAME.leader}: ${m} of ${t}`,
    `Leadership style: ${PROFILES[key][0]} (${c.bold} bold, ${c.cautious} cautious, ${c.diplomatic} diplomatic)`);
  return lines.join("\n");
}

function renderResults(){
  const recs = state.records, t = recs.length, m = recs.filter(r => r.matched).length;
  const c = tally(recs.map(r => r.style));
  const gw = tally(DECISIONS.map(d => d.options.find(o => o.historical).style));
  const key = profileKey(c), [pName, pText] = PROFILES[key];
  const report = buildReport(recs, m, t, key, c);

  app.innerHTML = `
  <section class="card">
    <p class="dateline">Your results, ${esc(state.name)}</p>
    <h2>You matched ${GAME.leader}</h2>
    <p class="score">${m} of ${t}</p>
    <div class="prose"><p>${matchComment(m, t)}</p></div>

    <div class="tablewrap">
      <table class="ledger">
        <thead><tr><th></th><th>Decision</th><th>Your choice</th><th>${GAME.leaderPoss} choice</th></tr></thead>
        <tbody>${recs.map((r, i) => `
          <tr><td class="n">${i+1}</td><td>${r.title}<br><span class="tag ${r.matched ? "match" : "diff"}">${r.matched ? "Same" : "Different"}</span></td>
          <td>${r.student}</td><td>${r.leader}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>

    <div class="cols">
      <div>
        <p class="dateline">Your leadership style</p>
        <h3>${pName}</h3>
        <div class="prose"><p>${pText}</p></div>
        <div class="styles" aria-label="Your choices compared with ${GAME.leaderPoss}">
          <span></span><span class="h">You</span><span class="h">${cap(GAME.leader)}</span>
          ${["bold","cautious","diplomatic"].map(k => `
            <span>${cap(k)}</span>
            <span aria-label="You: ${c[k]}">${pips(c[k])}</span>
            <span aria-label="${cap(GAME.leader)}: ${gw[k]}">${pips(gw[k], "gw")}</span>`).join("")}
        </div>
      </div>
      <div>
        <p class="dateline">For your Canvas assignment</p>
        <h3>Your summary</h3>
        <textarea class="summary" id="sum" readonly aria-label="Summary report">${esc(report)}</textarea>
        <div class="actions">
          <button class="btn primary" id="copy">Copy summary</button>
          <button class="btn" id="again">Play again</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
    </div>
  </section>`;

  const ta = document.getElementById("sum");
  ta.addEventListener("focus", () => ta.select());
  document.getElementById("copy").onclick = async () => {
    const st = document.getElementById("status");
    try { await navigator.clipboard.writeText(report); st.textContent = "Copied. Paste it into your Canvas assignment."; }
    catch (e) {
      ta.focus(); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
      st.textContent = ok ? "Copied. Paste it into your Canvas assignment." : "The text is selected. Press Ctrl+C (or Cmd+C on a Mac) to copy it.";
    }
  };
  document.getElementById("again").onclick = () => { const n = state.name; clearSaved(); state = blank(); state.name = n; go("title"); };
}

render(false);
</script>
</body>
</html>
